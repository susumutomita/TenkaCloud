<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#081a24">
<meta name="description" content="分かったカードから先取り。クラウドの役割、HTTP、AWS API を見分けるサバイバルゲーム。">
<title>目指せクラウドマスター | TenkaCloud</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./game.css">
<script type="module" src="./game.js"></script>
</head>
<body>
<main class="arcade">
  <header class="masthead"><a href="../" class="brand" aria-label="TenkaCloud の LP に戻る">天<span>TenkaCloud</span></a><h1>目指せクラウドマスター</h1><button id="pause" type="button" disabled aria-label="一時停止">Ⅱ</button></header>
  <nav id="modes" aria-label="出題モード"></nav>
  <section class="game" aria-label="落ちものサバイバル">
    <div class="mission"><div><p id="mode-caption"></p><h2 id="objective"></h2><p id="objective-detail"></p></div><div class="scoreboard"><span>SCORE</span><strong id="score">0</strong><small id="record">0 キャッチ</small><span id="lives" class="lives" aria-label="残りライフ3">♥ ♥ ♥</span></div></div>
    <div class="sky" id="field">
      <div class="sun" aria-hidden="true"></div><div class="horizon" aria-hidden="true"></div>
      <svg class="cloud-art cloud-a" viewBox="0 0 220 80" aria-hidden="true"><path d="M8 66h201a27 27 0 0 0-27-35c-4-36-55-35-62-9-22-26-57-5-51 19C40 24 12 37 8 66Z"/></svg>
      <svg class="cloud-art cloud-b" viewBox="0 0 220 80" aria-hidden="true"><path d="M8 66h201a27 27 0 0 0-27-35c-4-36-55-35-62-9-22-26-57-5-51 19C40 24 12 37 8 66Z"/></svg>
      <div class="lane-lines" aria-hidden="true"><i></i><i></i><i></i></div>
      <p id="field-cue" class="field-cue">光るカードでキャッチを試そう ↓</p>
      <div id="cards" class="cards" aria-label="落ちてくるカード"></div>
      <div id="effects" class="effects" aria-hidden="true"></div>
      <div class="miss-line"><span id="miss-rule">見逃し −1・停止して解説</span></div>
      <div id="overlay" class="overlay" hidden></div>
    </div>
    <div class="catch-zone" id="catch-zone"><span class="catch-mark" id="catch-mark" aria-hidden="true"></span><div><small>拾うのは、これだけ</small><strong id="catch-label"></strong></div><span class="catch-arrow" aria-hidden="true">↑</span><p id="catch-hint">カードを直接タップ</p></div>
    <div class="controls" id="controls"></div>
    <p id="rule-line" class="rule-line"><strong>ライフ3 · 0で終了。</strong> 誤タップ −1 ／ 見逃し −1。対象外は見送る。</p>
  </section>
  <div class="underbar"><span id="seed-label"></span><span>合成データ・通信なし・端末保存なし</span></div>
  <p class="fair-note">得点はこのプレイ内の記録。スキル認定ではありません。</p>
  <section id="review" class="review" hidden aria-labelledby="review-title"><h2 id="review-title">この回のキャッチを振り返る</h2><div id="review-list"></div></section>
  <p id="live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
</main>
<noscript>JavaScript を有効にすると遊べます。</noscript>
</body>
</html>
