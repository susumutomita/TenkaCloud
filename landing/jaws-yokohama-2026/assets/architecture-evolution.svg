<svg xmlns="http://www.w3.org/2000/svg" width="3300" height="1500" viewBox="0 0 3300 1500" role="img" aria-labelledby="title desc">
<title id="title">02 設計転換 — AWS-nativeへ</title>
<desc id="desc">TenkaCloudのDraw.io構成図の閲覧用表示。初期側は方針の概念図。AWSアイコンは公開されたモノクロsprite、文字と線はSVG。</desc>
<metadata>Source: architecture.drawio; AWS Icons for PlantUML, Amazon.com Inc. or its affiliates, CC BY-ND 2.0.</metadata>
<defs>
<image id="i-cloudformation" width="64" height="64" href="data:image/png;base64,"/>
<image id="i-cognito" width="64" height="64" href="data:image/png;base64,"/>
<image id="i-dynamodb" width="64" height="64" href="data:image/png;base64,"/>
<image id="i-iam" width="64" height="64" href="data:image/png;base64,"/>
<image id="i-lambda" width="64" height="64" href="data:image/png;base64,"/>
<image id="i-step" width="64" height="64" href="data:image/png;base64,"/>
</defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Noto Sans CJK JP,Hiragino Sans,Arial,sans-serif">
<rect x="70" y="180" width="1440" height="1130" fill="#fafbfc" stroke="#405a78" stroke-width="2"/>
<path d="M70 245H1510" stroke="#405a78" fill="none"/>
<rect x="1780" y="180" width="1440" height="1130" fill="#f9fcff" stroke="#147eba" stroke-width="2"/>
<path d="M1780 245H3220" stroke="#147eba" fill="none"/>
<g fill="#ffffff" stroke="#cfdbe6" stroke-width="1.5">
<rect x="120" y="290" width="1340" height="150" rx="9"/>
<rect x="120" y="490" width="1340" height="150" rx="9"/>
<rect x="120" y="690" width="1340" height="150" rx="9"/>
<rect x="120" y="890" width="1340" height="150" rx="9"/>
<rect x="120" y="1110" width="1340" height="145" fill="#fff1f2" rx="9"/>
<rect x="1840" y="300" width="620" height="150" stroke="#7652b6" rx="9"/>
<rect x="2520" y="300" width="630" height="150" stroke="#147eba" rx="9"/>
<rect x="1840" y="525" width="620" height="150" stroke="#c4425e" rx="9"/>
<rect x="2520" y="525" width="630" height="150" stroke="#01a88d" rx="9"/>
<rect x="1840" y="750" width="620" height="150" stroke="#2e7b50" rx="9"/>
<rect x="2520" y="750" width="630" height="150" stroke="#2e7b50" rx="9"/>
<rect x="1840" y="1000" width="1310" height="230" fill="#effcf4" rx="9"/>
</g>
<use href="#i-cognito" transform="translate(1870 335) scale(1.25)"/>
<use href="#i-lambda" transform="translate(2550 335) scale(1.25)"/>
<use href="#i-step" transform="translate(1870 560) scale(1.25)"/>
<use href="#i-dynamodb" transform="translate(2550 560) scale(1.25)"/>
<use href="#i-cloudformation" transform="translate(1870 785) scale(1.25)"/>
<use href="#i-iam" transform="translate(2550 785) scale(1.25)"/>
<g fill="#172333" font-weight="700">
<text x="60" y="92" font-size="44">共通化する境界を変えた。</text>
<text x="95" y="223" font-size="32">Before / cloud agnostic first</text>
<text x="1805" y="223" font-size="32">After / AWS-native</text>
<text x="1560" y="778" font-size="110" fill="#147eba">→</text>
<g font-size="28">
<text><tspan x="1970" y="365">Cognito</tspan><tspan x="1970" y="403">管理者認証を任せる</tspan></text>
<text><tspan x="2650" y="365">Lambda</tspan><tspan x="2650" y="403">API・競技処理の実行</tspan></text>
<text><tspan x="1970" y="590">Step Functions</tspan><tspan x="1970" y="628">デプロイ・削除の進行</tspan></text>
<text><tspan x="2650" y="590">DynamoDB</tspan><tspan x="2650" y="628">イベント・状態保存</tspan></text>
<text><tspan x="1970" y="815">CloudFormation</tspan><tspan x="1970" y="853">チーム専用スタック</tspan></text>
<text><tspan x="2650" y="815">IAM</tspan><tspan x="2650" y="853">AssumeRole + ExternalId</tspan></text>
</g></g>
<g fill="#52667b" font-size="30">
<text><tspan x="148" y="355">どのクラウドでも動く基盤を目指した。</tspan><tspan x="148" y="397">AWS / Azure / Google Cloudへの移植性。</tspan></text>
<text><tspan x="148" y="555">認証も自分で持つ / Keycloak</tspan><tspan x="148" y="597">更新・可用性・監視・障害対応。</tspan></text>
<text><tspan x="148" y="755">実行方式を共通化すると</tspan><tspan x="148" y="797">runner・権限・途中失敗からの復旧も基盤の責任。</tspan></text>
<text><tspan x="148" y="955">Terraformを共通方式にした場合</tspan><tspan x="148" y="997">state・ロック・整合性・後片付けも設計対象。</tspan></text>
<text x="148" y="1192" fill="#991b1b" font-weight="700">「動かせる」と「運用し続けられる」は違った。</text>
<text fill="#166534" font-weight="700"><tspan x="1868" y="1105">自分たちが設計するもの</tspan><tspan x="1868" y="1147">問題の契約・採点・チーム分離・削除確認・競技の面白さ。</tspan></text>
</g>
<text x="80" y="1394" font-size="34" font-weight="700" fill="#087f8c">共通化するのは、すべてのインフラではなく「問題を追加できる境界」。</text>
<text x="80" y="1462" font-size="22" fill="#52667b">初期側は方針の概念図。全クラウドで稼働済み、あるいはTerraformを実運用していたという主張ではありません。</text>
</g></svg>
