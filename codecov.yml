# Codecov config (Issue #2666).
#
# ci.yml's coverage matrix runs one leg per (shard, part) and each leg uploads its own lcov to
# Codecov. Codecov's default is to (re)evaluate + notify on every upload, so before all legs
# land it publishes a partial report (e.g. the infrastructure shard alone reads ~92.11%) as a
# *false* `codecov/project` failure that self-corrects to the real ~94.45% a minute later.
# `after_n_builds` makes Codecov wait for every upload before evaluating status or posting a
# comment, so the first status is correct.
#
# The leg count is `coverageMatrixLegs()` in scripts/workspace/run-coverage.ts (SHARD_NAMES
# expanded by COVERAGE_PARTS); keep the `after_n_builds` values below in sync with it.
# scripts/workspace/run-coverage.test.ts fails loudly if they drift — including when a shard is
# split into more parts, which adds uploads without adding shards.
codecov:
  notify:
    after_n_builds: 14
    wait_for_ci: true

comment:
  after_n_builds: 14

coverage:
  status:
    project:
      default:
        # Don't fail on rounding-level deltas (main once went red at 94.40% (-0.01%)).
        threshold: 0.5%
    patch:
      default:
        threshold: 0.5%
