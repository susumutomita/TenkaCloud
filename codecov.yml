# Codecov config (Issue #2666).
#
# ci.yml's coverage job runs a 3-shard matrix (infrastructure / spas / packages) and each
# shard uploads its own lcov to Codecov. Codecov's default is to (re)evaluate + notify on
# every upload, so before all shards land it publishes a partial report (e.g. the
# infrastructure shard alone reads ~92.11%) as a *false* `codecov/project` failure that
# self-corrects to the real ~94.45% a minute later. `after_n_builds` makes Codecov wait for
# all shards before evaluating status or posting a comment, so the first status is correct.
#
# The shard count is defined by SHARD_NAMES in scripts/workspace/run-coverage.ts; keep the
# `after_n_builds` values below in sync with it. scripts/workspace/run-coverage.test.ts fails
# loudly if they drift (e.g. a 4th shard is added but this file is not bumped).
codecov:
  notify:
    after_n_builds: 3
    wait_for_ci: true

comment:
  after_n_builds: 3

coverage:
  status:
    project:
      default:
        # Don't fail on rounding-level deltas (main once went red at 94.40% (-0.01%)).
        threshold: 0.5%
    patch:
      default:
        threshold: 0.5%
