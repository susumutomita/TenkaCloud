version: 0.2

# CodePipeline → CodeBuild エントリ。
# infrastructure/cloudformation/cd-pipeline/cd-pipeline.yaml の CodeBuildProject
# (Source.Type=CODEPIPELINE / BuildSpec 未指定) はリポジトリ root の本ファイルを参照する。
#
# 役割: scripts/install.sh の 3-phase deploy (ControlPlane → AdminConsoleHosting → ControlPlane 再 deploy) を
#       CodeBuild 上で再現する。
#
# 前提:
#   - aws/codebuild/amazonlinux-x86_64-standard:5.0 (Node.js 20 同梱)
#   - PrivilegedMode: true (CDK BucketDeployment / Lambda asset bundling が docker を呼ぶ)
#   - 環境変数 SYSTEM_ADMIN_EMAIL / CDK_PARAM_SYSTEM_ADMIN_EMAIL は cd-pipeline.yaml 側で注入

env:
  variables:
    JSII_DEPRECATED: quiet

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      # bun は標準イメージに無いので install。デフォルトでは ~/.bun/bin に入るが、
      # CodeBuild の各 command は別 shell で起動するため PATH export が引き継がれない。
      # /usr/local/bin (デフォルト PATH に含まれる) に symlink して以後の phase からも見える状態にする。
      - curl -fsSL https://bun.sh/install | bash
      - ln -sf "$HOME/.bun/bin/bun" /usr/local/bin/bun
      - ln -sf "$HOME/.bun/bin/bunx" /usr/local/bin/bunx
      - bun --version

  pre_build:
    commands:
      - test -n "$SYSTEM_ADMIN_EMAIL" || { echo "SYSTEM_ADMIN_EMAIL is required"; exit 1; }
      - export AWS_DEFAULT_REGION="${AWS_REGION:-${AWS_DEFAULT_REGION:-us-east-1}}"
      - aws sts get-caller-identity

  build:
    commands:
      # Makefile の `make deploy` と同じ呼び出し方: scripts/ に cd してから install.sh。
      # install.sh 内の `cd ..` が TenkaCloud root に戻る前提なので、この cwd 規約は守る。
      - cd scripts && bash install.sh "$SYSTEM_ADMIN_EMAIL"

artifacts:
  files:
    - 'infrastructure/cdk.out/**/*'
  discard-paths: no
  name: BuildArtifact
