services:
  # Nginx Reverse Proxy - Single entry point for all services
  nginx:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - control-plane
      - application-plane
      - tenant-management
      - battle-service
      - scoring-service
      - leaderboard-service
      - problem-service
      - gameday-service
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - tenkacloud

  control-plane:
    build:
      context: .
      dockerfile: apps/control-plane/Dockerfile
    expose:
      - "13000"
    environment:
      - AUTH_SECRET=${AUTH_SECRET:-your-secret-key-here}
      - AUTH_URL=http://localhost:3000/control
      - AUTH_SKIP=${AUTH_SKIP:-1}
      - AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID:-stub}
      - AUTH0_CLIENT_SECRET=${AUTH0_CLIENT_SECRET:-stub}
      - AUTH0_ISSUER=${AUTH0_ISSUER:-https://example.com}
      - NEXTAUTH_URL=http://localhost:3000/control
      - NEXT_PUBLIC_TENANT_API_BASE_URL=http://localhost:3000/api
      - AWS_ENDPOINT_URL=http://cloud-emulator:4566
    depends_on:
      tenant-management:
        condition: service_healthy
    networks:
      - tenkacloud

  tenant-management:
    build:
      context: .
      dockerfile: backend/services/control-plane/tenant-management/Dockerfile
    expose:
      - "13004"
    environment:
      - DYNAMODB_TABLE_NAME=TenkaCloud-dev
      - DYNAMODB_ENDPOINT=http://cloud-emulator:4566
      - AWS_REGION=ap-northeast-1
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - AUTH_SKIP=${AUTH_SKIP:-1}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:13004/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tenkacloud

  battle-service:
    build:
      context: .
      dockerfile: backend/services/application-plane/battle-service/Dockerfile
    expose:
      - "3010"
    environment:
      - PORT=3010
      - DYNAMODB_TABLE_NAME=TenkaCloud-dev
      - DYNAMODB_ENDPOINT=http://cloud-emulator:4566
      - AWS_REGION=ap-northeast-1
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - CORS_ORIGIN=http://localhost:3000,http://localhost:13001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3010/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tenkacloud

  scoring-service:
    build:
      context: .
      dockerfile: backend/services/application-plane/scoring-service/Dockerfile
    expose:
      - "3011"
    environment:
      - PORT=3011
      - DYNAMODB_TABLE_NAME=TenkaCloud-dev
      - DYNAMODB_ENDPOINT=http://cloud-emulator:4566
      - AWS_REGION=ap-northeast-1
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - CORS_ORIGIN=http://localhost:3000,http://localhost:13001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3011/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tenkacloud

  leaderboard-service:
    build:
      context: .
      dockerfile: backend/services/application-plane/leaderboard-service/Dockerfile
    expose:
      - "3012"
    environment:
      - PORT=3012
      - DYNAMODB_TABLE_NAME=TenkaCloud-dev
      - DYNAMODB_ENDPOINT=http://cloud-emulator:4566
      - AWS_REGION=ap-northeast-1
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - CORS_ORIGIN=http://localhost:3000,http://localhost:13001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3012/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tenkacloud

  problem-service:
    build:
      context: .
      dockerfile: backend/services/application-plane/problem-service/Dockerfile
    expose:
      - "3100"
    environment:
      - PORT=3100
      - DYNAMODB_TABLE_NAME=TenkaCloud-dev
      - DYNAMODB_ENDPOINT=http://cloud-emulator:4566
      - AWS_REGION=ap-northeast-1
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - CORS_ORIGIN=http://localhost:3000,http://localhost:13001
      - AUTH_SKIP=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tenkacloud

  gameday-service:
    build:
      context: .
      dockerfile: backend/services/application-plane/gameday-service/Dockerfile
    expose:
      - "3020"
    environment:
      - PORT=3020
      - DYNAMODB_TABLE_NAME=TenkaCloud-dev
      - DYNAMODB_ENDPOINT=http://cloud-emulator:4566
      - AWS_REGION=ap-northeast-1
      - CORS_ORIGIN=http://localhost:3000,http://localhost:13001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3020/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tenkacloud

  application-plane:
    build:
      context: .
      dockerfile: apps/application-plane/Dockerfile
    expose:
      - "13001"
    environment:
      - AUTH_SECRET=${AUTH_SECRET:-your-secret-key-here}
      - AUTH_URL=http://localhost:3000
      - AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID:-stub}
      - AUTH0_CLIENT_SECRET=${AUTH0_CLIENT_SECRET:-stub}
      - AUTH0_ISSUER=${AUTH0_ISSUER:-https://example.com}
      - NEXTAUTH_URL=http://localhost:3000
      - AWS_ENDPOINT_URL=http://cloud-emulator:4566
      - AWS_REGION=${AWS_REGION:-ap-northeast-1}
      - NEXT_PUBLIC_API_URL=http://localhost:3000/api
      - AUTH_SKIP=${AUTH_SKIP:-1}
      - NEXT_PUBLIC_AUTH_SKIP=${NEXT_PUBLIC_AUTH_SKIP:-1}
    networks:
      - tenkacloud

  # ========================================
  # クラウドエミュレータ（LocalStack / Kumo / Floci）
  # COMPOSE_PROFILES で切り替え（デフォルト: kumo）
  # 全エミュレータが cloud-emulator エイリアスを共有し、
  # バックエンドサービスは http://cloud-emulator:4566 で統一アクセス
  # ========================================

  # LocalStack - 成熟した AWS エミュレータ（Python ベース）
  localstack:
    image: localstack/localstack:latest
    profiles: ["localstack"]
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"
    environment:
      - SERVICES=dynamodb,cognito-idp,s3,lambda,events,iam,logs,sts,sqs
      - DEBUG=1
      - PERSISTENCE=1
      - LAMBDA_EXECUTOR=docker
      - DOCKER_HOST=unix:///var/run/docker.sock
      - AWS_DEFAULT_REGION=ap-northeast-1
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      tenkacloud:
        aliases:
          - cloud-emulator

  # Kumo - 71 AWS サービス対応の軽量エミュレータ（Go ベース）
  # https://github.com/sivchari/kumo
  kumo:
    image: ghcr.io/sivchari/kumo:latest
    profiles: ["kumo"]
    ports:
      - "4566:4566"
    environment:
      - KUMO_HOST=0.0.0.0
      - KUMO_PORT=4566
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      tenkacloud:
        aliases:
          - cloud-emulator

  # Floci - 安定性の高い AWS エミュレータ（JVM ベース、21 サービス）
  # https://github.com/hectorvent/floci
  floci:
    image: hectorvent/floci:latest
    profiles: ["floci"]
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      tenkacloud:
        aliases:
          - cloud-emulator

networks:
  tenkacloud:
    driver: bridge

volumes:
  localstack_data:
