# AWS モード用 docker-compose オーバーライド
#
# 使い方:
#   source scripts/aws-creds.sh
#   docker compose -f docker-compose.yml -f docker-compose.aws.yml up
#
# または:
#   make start-aws
#
# LocalStack / DynamoDB Local の代わりに実 AWS を使用する。
# 環境変数 AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_SESSION_TOKEN を
# シェルで事前にエクスポートしておくこと（scripts/aws-creds.sh で設定可能）。

services:
  control-plane:
    environment:
      - AWS_ENDPOINT_URL=

  tenant-management:
    environment:
      - DYNAMODB_ENDPOINT=
      - AWS_ENDPOINT_URL=
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
      - PROVISIONING_ENABLED=true
      - PROVISIONING_DELIVERY_MODE=async
      - EVENT_BUS_NAME=tenkacloud-dev-tenant-events

  battle-service:
    environment:
      - DYNAMODB_ENDPOINT=
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}

  scoring-service:
    environment:
      - DYNAMODB_ENDPOINT=
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}

  leaderboard-service:
    environment:
      - DYNAMODB_ENDPOINT=
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}

  problem-service:
    environment:
      - DYNAMODB_ENDPOINT=
      - AWS_ENDPOINT_URL=
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}

  gameday-service:
    environment:
      - DYNAMODB_ENDPOINT=
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}

  application-plane:
    environment:
      - AWS_ENDPOINT_URL=
