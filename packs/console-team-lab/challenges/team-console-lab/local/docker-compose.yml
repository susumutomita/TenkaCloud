services:
  attack:
    build: {context: ., dockerfile: Dockerfile, target: participant}
    networks: [lab]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    restart: "no"
  web:
    build: {context: ., dockerfile: Dockerfile, target: web}
    networks: [lab]
    environment: {FLAG_SEED: "${FLAG_SEED:?owned per-job secret required}"}
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    restart: "no"
  db:
    build: {context: ., dockerfile: Dockerfile, target: db}
    networks: [lab]
    environment: {FLAG_SEED: "${FLAG_SEED:?owned per-job secret required}"}
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    restart: "no"
  verifier:
    build: {context: ., dockerfile: Dockerfile, target: verifier}
    networks: [grading]
    environment: {FLAG_SEED: "${FLAG_SEED:?owned per-job secret required}"}
    ports: ["127.0.0.1:18081:8081"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    restart: "no"
networks:
  lab: {internal: true}
  grading: {internal: true}
