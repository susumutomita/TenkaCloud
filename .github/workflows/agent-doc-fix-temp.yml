name: agent-doc-fix-temp

permissions:
  contents: write

on:
  push:
    branches:
      - agent/principle-driven-harness

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/principle-driven-harness

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.11"

      - name: Install packages
        env:
          npm_config_ignore_scripts: "true"
          CI: "true"
        run: make install_ci

      - name: Apply textlint fix
        run: bun textlint --fix docs/architecture/enforcement-registry.md || true

      - name: Commit fix when needed
        run: |
          if git diff --quiet -- docs/architecture/enforcement-registry.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/enforcement-registry.md
          git commit -m "fix(agent): apply enforcement textlint fix"
          git push origin HEAD:agent/principle-driven-harness
