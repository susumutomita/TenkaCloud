name: format-symphony-branch

on:
  push:
    branches:
      - agent/symphony-polyrepo-control-plane
    paths:
      - ".github/workflows/format-symphony-branch.yml"
      - ".symphony/**"
      - "GNUmakefile"
      - "package.json"
      - "scripts/agentic/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/symphony-polyrepo-control-plane

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.11"

      - name: Install the frozen dependency graph
        env:
          npm_config_ignore_scripts: "true"
          CI: "true"
        run: make install_ci

      - name: Apply the repository formatter
        run: bun run fix:format

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "Biome made no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(agentic-dev): apply Biome formatting"
          git push origin HEAD:agent/symphony-polyrepo-control-plane
