name: cleanup-always-on-sweeper

# ADR-049 Phase 4 (Issue #2293) SLICE 4 — the Always-On runtime cleanup sweeper (ADR-049 §8).
# Nightly backstop against cost leaks: it scans CloudFormation stacks tagged
# TenkaCloud:ManagedBy=always-on-runtime whose TenkaCloud:ExpiresAt is past, retries DeleteStack,
# and on repeated failure opens a GitHub issue naming the stuck stack (loud failure, no silent
# fallback). It never touches Lite/SaaS/competitor stacks — those never carry the ManagedBy tag.

on:
  schedule:
    # 03:17 UTC nightly — off-peak, and deliberately not on the :00 minute (spread load).
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  id-token: write # OIDC federation into AWS (no long-lived keys)
  contents: read
  issues: write # open a cleanup-failure issue when a stack will not delete

concurrency:
  group: always-on-runtime-sweeper
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    environment: always-on-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.ALWAYS_ON_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
          mask-aws-account-id: true

      - name: Sweep expired always-on runtimes
        working-directory: infrastructure
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run lib/always-on-runtime/sweeper/index.ts

      - name: Notify sweeper workflow failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Always-On cleanup sweeper workflow failed" \
            --body "The nightly cleanup sweeper workflow failed before it completed. Run: ${RUN_URL}

This can leave expired Always-On runtime stacks running. Inspect the failed job, rerun the workflow, and manually destroy any expired runtime stack that remains."
