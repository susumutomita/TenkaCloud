name: Agent issue 2746 diagnose

# Temporary branch-only diagnostics; deleted before merge.
permissions:
  contents: write

on:
  push:
    branches:
      - agent/issue-2746-sakura-apprun-contract

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.11"

      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Capture focused test output
        run: |
          set +e
          bun run --filter @TenkaCloud/infrastructure test \
            test/problem-deploy/sakura-apprun-rest-client.test.ts \
            test/problem-deploy/sakura-apprun-adapter.test.ts \
            > /tmp/issue-2746-test.log 2>&1
          status=$?
          mkdir -p .agent
          cp /tmp/issue-2746-test.log .agent/issue-2746-test.log
          printf '\nexit_status=%s\n' "$status" >> .agent/issue-2746-test.log

      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agent/issue-2746-test.log
          git commit -m "chore(agent): capture issue 2746 test diagnostics"
          git push
