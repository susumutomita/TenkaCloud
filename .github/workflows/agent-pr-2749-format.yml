name: Agent PR 2749 format

permissions:
  contents: write

on:
  push:
    branches:
      - fix/multicloud-provider-wire-contracts

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.11"

      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Format changed files
        run: |
          bun x biome check --write \
            infrastructure/lib/problem-deploy/handlers/deploy-handler/adapter-dependencies.ts \
            infrastructure/lib/problem-deploy/handlers/shared/runtime/sakura-apprun-adapter.ts \
            infrastructure/lib/problem-deploy/runtime-clients/azure-deployment-stacks-rest-client.ts \
            infrastructure/lib/problem-deploy/runtime-clients/gcp-infra-manager-rest-client.ts \
            infrastructure/lib/problem-deploy/runtime-clients/runtime-output.ts \
            infrastructure/lib/problem-deploy/runtime-clients/sakura-apprun-rest-client.ts \
            infrastructure/test/problem-deploy/azure-deployment-stacks-rest-client.test.ts \
            infrastructure/test/problem-deploy/gcp-infra-manager-rest-client.test.ts \
            infrastructure/test/problem-deploy/runtime-output.test.ts \
            infrastructure/test/problem-deploy/sakura-apprun-adapter.test.ts \
            infrastructure/test/problem-deploy/sakura-apprun-rest-client.test.ts

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infrastructure/lib/problem-deploy infrastructure/test/problem-deploy
          if git diff --cached --quiet; then
            echo "Formatting already current"
          else
            git commit -m "style(multicloud): format provider wire contracts"
            git push
          fi
