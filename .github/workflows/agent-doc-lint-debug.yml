name: agent-doc-lint-debug

permissions:
  contents: write

on:
  pull_request:
    paths:
      - ".claude/**/*.md"
      - "AGENTS.md"
      - "docs/architecture/*.md"
      - ".github/workflows/agent-doc-lint-debug.yml"

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/principle-driven-harness

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.11"

      - name: Install packages
        env:
          npm_config_ignore_scripts: "true"
          CI: "true"
        run: make install_ci

      - name: Capture exact diagnostics
        run: |
          mkdir -p .claude/state
          bun textlint -f json \
            docs/architecture/principles.md \
            docs/architecture/enforcement-registry.md \
            > .claude/state/textlint-diagnostics.json || true

      - name: Commit diagnostics
        run: |
          if [ -z "$(git status --porcelain -- .claude/state/textlint-diagnostics.json)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude/state/textlint-diagnostics.json
          git commit -m "chore(agent): capture textlint diagnostics"
          git push origin HEAD:agent/principle-driven-harness
