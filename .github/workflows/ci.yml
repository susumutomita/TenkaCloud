name: ci

# Supply Chain Security:
# - All actions pinned to full SHA for immutable references
# - Safe Chain runs before dependency installation
# - Lifecycle scripts disabled during install
# - Minimal permissions following principle of least privilege

permissions:
  contents: read
  packages: read
  actions: read

on:
  # main への push (= PR merge 後) でも CI を回し coverage を Codecov に upload する。
  # これが無いと Codecov に BASE (main) の report が無く、 PR で「Please upload report for
  # BASE」 警告 + diff 不能 (base が "?") になる。 Issue #993 の延長。
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        # actions/checkout v4.3.1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: true

      - name: Setup Bun
        # oven-sh/setup-bun v2.0.2
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.11"

      # Supply Chain Security: Safe Chain for malicious package detection
      - name: Setup safe-chain
        continue-on-error: true
        run: bunx @aikidosec/safe-chain setup-ci

      # Supply Chain Security: Disable lifecycle scripts during install
      - name: Install packages via packages.json
        env:
          npm_config_ignore_scripts: "true"
          CI: "true"
        run: make install_ci

      # Supply Chain Security: dependency lifecycle script auditor。
      # scripts/security/audit-baseline.json と比較し、 新規 lifecycle script 付き package /
      # 既存 dep の新規 hook 追加を検出して fail させる (= mini Shai-Hulud 2nd 対策、
      # https://blog.flatt.tech/entry/mini_shai_hulud_2nd)。
      - name: Audit dependency lifecycle scripts
        run: |
          make audit-deps

      # Architecture enforcement must run in the remote, non-bypassable gate too. Local hooks
      # are useful feedback, but contributors and automation can bypass them.
      - name: Run architecture harness
        run: bun run .claude/harness/bin/architecture.ts --fail-on=error

      - name: Test architecture harness
        run: make harness-test

      # Issue #2949: the machine API reference is generated from MACHINE_ROUTE_SCOPES and the
      # handler's zod schemas. A PR that adds a route but forgets to regenerate would publish a
      # reference that lies about the surface, so the drift check is a gate, not a report.
      - name: OpenAPI drift gate
        run: make openapi-check

      # jscpd baseline ratchet: zero-duplication is NOT the goal (apps are split by
      # responsibility, so some intentional similarity is baselined). This fails only when
      # a PR grows duplication past scripts/quality/duplication-baseline.json — i.e. new
      # copy-paste / reimplementation landed without checking for an existing helper.
      - name: Duplication baseline ratchet (jscpd)
        run: |
          make dup-check

      # knip dead-code gate (#2866). Previously report-only: knip reports everything that
      # exists, not the PR's delta, so gating would have punished PRs for the 168 findings
      # of pre-existing debt. #2866 cleared the backlog to zero, so from here on any finding
      # IS this PR's delta and the scan gates like dup-check above (same "clear, then wire"
      # sequence as the #2862 ESLint gate). Typical false positive: a new entrypoint missing
      # from knip.json's workspace entry globs — fix the glob, don't relax the gate.
      - name: Dead-code gate (knip)
        run: |
          make dead-code

      # Submodule pin guard: reject PRs that roll the problems/ gitlink backward or
      # sideways (the ping-pong where an old-pin branch reverts a newer pin, e.g. #1927).
      # Shallow checkout has no origin/main / submodule history, so fetch both first.
      # 品質ゲートは本体と分離し .claude/skills/quality-gates へ移設済み (runner を直接呼ぶ)。
      - name: Submodule pin guard (problems must not roll back)
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git -C problems fetch --no-tags --unshallow origin 2>/dev/null || git -C problems fetch --no-tags origin || true
          bun run .claude/skills/quality-gates/scripts/run.ts submodule-not-behind

      # #2254: enforce the catalog authoring contract (schema + bilingual-README invariant) against
      # the platform's problems/ mirror, so a README-less / schema-invalid problem fails platform CI
      # too — not only the catalog repo's own CI. Green today (all problems valid); catches drift.
      - name: Validate problem catalog (schema + bilingual README, #2254)
        run: |
          make validate-problems

      - name: Run textlint
        run: |
          make lint-text

      - name: Format check
        run: |
          make lint-format

      # #2862: type-aware ESLint (scripts/). Biome は format と構文寄りの rule を見るが、型情報が
      # 要る検査 (no-floating-promises / await-thenable / sonarjs の型ベース rule) はここでしか
      # 走らない。 #2861 で gate 自体は入っていたが Makefile からも CI からも呼ばれておらず、
      # 一度も実行されていなかった。 local は `make lint` (= before-commit) 経由。
      - name: ESLint (type-aware, scripts/)
        run: |
          make lint-ts

      # #2964 follow-up: CI's only test surface is the `coverage` job's shards, and every shard
      # enters a workspace. The tests that live at the repo root — the landing generators' --check
      # mode and the seams under scripts/ — therefore ran nowhere in CI. That is how two workspaces
      # (packages/ai-eval, packages/tcloud) were added while scripts/workspace/run-workspaces.test.ts,
      # whose entire job is to fail when a workspace is added, sat red on main and nothing said so.
      # `make before-commit` catches it locally; this makes CI say the same thing.
      - name: Repo-root script tests (#2964)
        run: |
          make test-root

      - name: Type check
        run: |
          make typecheck

      - name: Build
        run: |
          make build

  # Issue #2513: coverage は元々 `ci` job 内の直列 `make test-coverage` (17 workspace &&
  # chain) が ~17m13s を占めていた。 workspace を 3 shard (infrastructure / spas / packages,
  # scripts/workspace/run-coverage.ts の SHARDS 定義) に分け、 matrix で並列実行する。 `ci` job には
  # 依存しない (= 両 job が同時に走り出す) ので、 coverage 自体の短縮に加えて job の直列待ちも
  # 消える。 shard 内の workspace 実行は従来どおり直列 + fail-fast。
  coverage:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: infrastructure
          - shard: spas
          - shard: packages
    steps:
      - name: Check out the code
        # actions/checkout v4.3.1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: true

      - name: Setup Bun
        # oven-sh/setup-bun v2.0.2
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.11"

      # Supply Chain Security: Safe Chain for malicious package detection
      - name: Setup safe-chain
        continue-on-error: true
        run: bunx @aikidosec/safe-chain setup-ci

      # Supply Chain Security: Disable lifecycle scripts during install
      - name: Install packages via packages.json
        env:
          npm_config_ignore_scripts: "true"
          CI: "true"
        run: make install_ci

      # Issue #993 / #2513: この shard に属する workspace だけを直列実行し coverage/lcov.info を
      # 生成する (root `test:coverage` script と同じ scripts/workspace/run-coverage.ts、 --shard で絞る)。
      - name: Run tests with coverage (shard ${{ matrix.shard }})
        run: |
          bun run scripts/workspace/run-coverage.ts --shard ${{ matrix.shard }}

      # Issue #2676: derive the Codecov upload file list from the same COVERAGE_WORKSPACES
      # registry that runs coverage. A hand-written matrix list drifted to 5 lcov files while
      # run-coverage.ts generated 17 workspace reports, leaving several packages invisible in
      # Codecov even though the local coverage gate still checked them.
      - name: Resolve Codecov lcov files (shard ${{ matrix.shard }})
        id: lcov
        run: |
          echo "files=$(bun run scripts/workspace/run-coverage.ts --shard ${{ matrix.shard }} --print-lcov-paths)" >> "$GITHUB_OUTPUT"

      # Issue #1424 / #2513: agent-owned workspace の 100% coverage を shard 単位で enforce。
      # 品質ゲートは本体と分離し .claude/skills/quality-gates へ移設済み (--shard で絞って直接呼ぶ、
      # run.ts は経由しない)。
      - name: Coverage gate (100% for agent-owned workspaces, shard ${{ matrix.shard }})
        run: |
          bun run .claude/skills/quality-gates/scripts/check-coverage-gate.ts --shard ${{ matrix.shard }}

      # Issue #2758: infrastructure 全体はまだ #1424 の 100% gate 対象外 (report-only) だが、
      # AssumeRole/ExternalId・tenant isolation・deploy state machine・scoring・delete
      # lifecycle・auth boundary (scripts/quality/infra-critical-paths.ts) は壊れると越境/
      # 不正スコアリングに直結するため、jscpd と同じ baseline ratchet 方式 (make dup-check) で
      # coverage の後退だけを検出する。 infrastructure shard の lcov.info しか対象にしないため
      # infrastructure shard leg でのみ実行し、テストは再実行しない (既存 lcov.info を読むだけ)。
      - name: Infra critical-path coverage ratchet (infrastructure shard only)
        if: matrix.shard == 'infrastructure'
        run: |
          make infra-coverage-check

      # 3rd-party action は tag (mutable) ではなく commit SHA (immutable) で pin する
      # (= supply-chain attack 防御、 maintainer / attacker が tag を移動できなくする)。 v5.5.4 SHA。
      # Codecov は同一 commit に対する複数 upload を 1 つの commit report へマージするため、
      # shard ごとに分けて upload しても (PR / main push いずれでも) 最終的な report は分割前と
      # 同じ全体像 (= 元 5 file 分) になる。 base report が欠けることもない。
      - name: Upload coverage reports to Codecov (shard ${{ matrix.shard }})
        uses: codecov/codecov-action@aa56896cf108bd10b5eb883cd1d24196da57f695 # v5.5.4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # Codecov 側 outage で CI 全体を落とさない。 coverage 計測は補助、 必須でない。
          fail_ci_if_error: false
          # 各 workspace の coverage/lcov.info を明示的に拾う (= auto-discover に依存しない)。
          # The list is derived from COVERAGE_WORKSPACES to avoid upload drift (#2676).
          files: ${{ steps.lcov.outputs.files }}

  # Issue #2513: branch protection 用の安定した単一 check 名。 matrix job (coverage) は shard 数
  # だけ check が並び、 shard 構成が変わるたびに required status の設定も追随させる必要が出るため
  # 直接 required にはしにくい。 `if: always()` で matrix の成否に関わらず必ず走らせ、
  # needs.coverage.result を見て 1 つの check に集約する (third-party action は使わない)。
  coverage-complete:
    needs: coverage
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check coverage matrix result
        run: |
          if [ "${{ needs.coverage.result }}" != "success" ]; then
            echo "coverage matrix did not succeed: ${{ needs.coverage.result }}" >&2
            exit 1
          fi
          echo "coverage matrix succeeded"
