name: ci

# Supply Chain Security:
# - All actions pinned to full SHA for immutable references
# - Safe Chain runs before dependency installation
# - Lifecycle scripts disabled during install
# - Minimal permissions following principle of least privilege

permissions:
  contents: read
  packages: read
  actions: read

on:
  # main への push (= PR merge 後) でも CI を回し coverage を Codecov に upload する。
  # これが無いと Codecov に BASE (main) の report が無く、 PR で「Please upload report for
  # BASE」 警告 + diff 不能 (base が "?") になる。 Issue #993 の延長。
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        # actions/checkout v4.3.1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: true

      - name: Setup Bun
        # oven-sh/setup-bun v2.0.2
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.11"

      # Supply Chain Security: Safe Chain for malicious package detection
      - name: Setup safe-chain
        continue-on-error: true
        run: bunx @aikidosec/safe-chain setup-ci

      # Supply Chain Security: Disable lifecycle scripts during install
      - name: Install packages via packages.json
        env:
          npm_config_ignore_scripts: "true"
          CI: "true"
        run: make install_ci

      # Supply Chain Security: dependency lifecycle script auditor。
      # scripts/audit-baseline.json と比較し、 新規 lifecycle script 付き package /
      # 既存 dep の新規 hook 追加を検出して fail させる (= mini Shai-Hulud 2nd 対策、
      # https://blog.flatt.tech/entry/mini_shai_hulud_2nd)。
      - name: Audit dependency lifecycle scripts
        run: |
          make audit-deps

      - name: Run textlint
        run: |
          make lint_text

      - name: Format check
        run: |
          make format_check

      - name: Type check
        run: |
          make typecheck

      # Issue #993: 旧 `make test` (= `bun run test --coverage`) は && chain の末尾 workspace
      # にしか --coverage が渡らず、 codecov に上がる coverage が trust-bridge だけだった。
      # `test-coverage` target は各 workspace の `test:coverage` script を順に叩き、
      # 各 workspace 配下に `coverage/lcov.info` を生成する → codecov-action が拾う。
      - name: Run tests with coverage
        run: |
          make test-coverage

      # Issue #1424: agent-owned workspace (3 SPA + 共有 package) の 100% coverage を enforce。
      # test-coverage が生成した lcov.info を読み 100% 未満なら CI を落とす (= 回帰検知)。
      - name: Coverage gate (100% for agent-owned workspaces)
        run: |
          make coverage-gate

      - name: Build
        run: |
          make build

      # 3rd-party action は tag (mutable) ではなく commit SHA (immutable) で pin する
      # (= supply-chain attack 防御、 maintainer / attacker が tag を移動できなくする)。 v5.5.4 SHA。
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@aa56896cf108bd10b5eb883cd1d24196da57f695 # v5.5.4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # Codecov 側 outage で CI 全体を落とさない。 coverage 計測は補助、 必須でない。
          fail_ci_if_error: false
          # 各 workspace の coverage/lcov.info を明示的に拾う (= auto-discover に依存しない)。
          files: ./infrastructure/coverage/lcov.info,./apps/admin-console/coverage/lcov.info,./apps/application-admin-console/coverage/lcov.info,./apps/participant-portal/coverage/lcov.info,./packages/trust-bridge/coverage/lcov.info
