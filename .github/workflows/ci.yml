name: ci

# Supply Chain Security:
# - All actions pinned to full SHA for immutable references
# - Safe Chain runs before dependency installation
# - Lifecycle scripts disabled during install
# - Minimal permissions following principle of least privilege

permissions:
  contents: read
  packages: read
  actions: read

on:
  # main への push (= PR merge 後) でも CI を回し coverage を Codecov に upload する。
  # これが無いと Codecov に BASE (main) の report が無く、 PR で「Please upload report for
  # BASE」 警告 + diff 不能 (base が "?") になる。 Issue #993 の延長。
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# force-push や立て続けの follow-up commit が、置き換えられた前の matrix を完走まで
# 走らせ続けていた分の runner 時間を止める。 push (main) は cancel しない -- 各 merge
# commit の run がその commit の記録であり、Codecov の BASE report もその commit に
# 紐づくため、 近接した複数の merge がどちらも完走する必要がある (ci.yml 自身の
# push スコープと同じ理由、Issue #993 の延長)。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Coverage parts are defined in scripts/workspace/run-coverage.ts. Independent jobs run
# concurrently; the final ci job requires every surviving gate to succeed.
jobs:
  # Cheap contract gates: dependency lifecycle audit, dead code, submodule pin, catalog schema,
  # prose, formatting, and the repo-root script tests. Together ~25s, so they share one leg.
  # Full history is required by the submodule ancestry guard.
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        # actions/checkout v4.3.1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          submodules: true

      - uses: ./.github/actions/bun-install

      # Supply Chain Security: dependency lifecycle script auditor。
      # scripts/security/audit-baseline.json と比較し、 新規 lifecycle script 付き package /
      # 既存 dep の新規 hook 追加を検出して fail させる (= mini Shai-Hulud 2nd 対策、
      # https://blog.flatt.tech/entry/mini_shai_hulud_2nd)。
      - name: Audit dependency lifecycle scripts
        run: make audit-deps

      # knip dead-code gate (#2866). Previously report-only: knip reports everything that
      # exists, not the PR's delta, so gating would have punished PRs for the 168 findings
      # of pre-existing debt. #2866 cleared the backlog to zero, so from here on any finding
      # IS this PR's delta and the scan gates like dup-check above (same "clear, then wire"
      # sequence as the #2862 ESLint gate). Typical false positive: a new entrypoint missing
      # from knip.json's workspace entry globs — fix the glob, don't relax the gate.
      - name: Dead-code gate (knip)
        run: make dead-code

      # Submodule pin guard: reject PRs that roll the problems/ gitlink backward or
      # sideways (the ping-pong where an old-pin branch reverts a newer pin, e.g. #1927).
      # Pull-request checkout does not guarantee origin/main or full submodule history, so fetch
      # both first (the superproject is full-depth for the release-manifest tag/gitlink gate).
      - name: Submodule pin guard (problems must not roll back)
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          # Deepen the catalog checkout so the ancestry guard can compare the pinned commits.
          git -C problems fetch --tags --unshallow origin 2>/dev/null || git -C problems fetch --tags origin || true
          make submodule-not-behind

      # #2254: enforce the catalog authoring contract (schema + bilingual-README invariant) against
      # the platform's problems/ mirror, so a README-less / schema-invalid problem fails platform CI
      # too — not only the catalog repo's own CI. Green today (all problems valid); catches drift.
      - name: Validate problem catalog (schema + bilingual README, #2254)
        run: make validate-problems

      - name: Run textlint
        run: make lint-text

      - name: Format check
        run: make lint-format

      # #2964 follow-up: CI's only test surface is the `coverage` job's shards, and every shard
      # enters a workspace. The tests that live at the repo root — the landing generators' --check
      # mode and the seams under scripts/ — therefore ran nowhere in CI. That is how two workspaces
      # (packages/ai-eval, packages/tcloud) were added while scripts/workspace/run-workspaces.test.ts,
      # whose entire job is to fail when a workspace is added, sat red on main and nothing said so.
      # `make before-commit` catches it locally; this makes CI say the same thing.
      - name: Repo-root script tests (#2964)
        run: bun run test:root

  # #2862: ESLint。 Biome は format と構文寄りの rule を見るが、型情報が要る検査
  # (no-floating-promises / await-thenable / sonarjs の型ベース rule) はここでしか走らない。
  # #2861 で gate 自体は入っていたが Makefile からも CI からも呼ばれておらず、一度も実行され
  # ていなかった。 local は `make lint` (= before-commit) 経由。
  #
  # #3014 で対象を scripts/ から repo 全体へ広げた。 既存 1,694 件は eslint-suppressions.json
  # に ceiling として凍結してあるので、ここが赤くなるのは (a) ceiling を超える新しい違反か、
  # (b) 違反を直したのに `make lint-ts-prune` を流していない (exit 2 "suppressions left that do
  # not occur anymore") のどちらか。 (b) は prune した差分を commit すれば緑になる。
  #
  # 単独 job なのは実測 (repo 全体 76s) が gates 全体より長く、直列に置くと他の gate まで
  # 待たせるため。 `--concurrency=auto` (lint:ts script 側) で runner の全 core を使う。
  lint-ts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        # actions/checkout v4.3.1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: ./.github/actions/bun-install

      - name: ESLint (repo-wide, ratcheted)
        run: make lint-ts

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        # actions/checkout v4.3.1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          # participant-portal type-checks test files that import a problem's metadata.json
          # straight out of the catalog, so the submodule has to be on disk.
          submodules: true

      - uses: ./.github/actions/bun-install

      # One `tsc --noEmit` saturates a single core, so the serial workspace chain used 1m33s of
      # CPU across 51.9s of wall time on a 4-core runner. WORKSPACE_JOBS runs four at a time.
      - name: Type check
        run: make typecheck WORKSPACE_JOBS=4

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        # actions/checkout v4.3.1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: true

      - uses: ./.github/actions/bun-install

      - name: Build
        run: make build WORKSPACE_JOBS=4

  # Split the larger application suites with Vitest --shard while preserving workspace gates.
  # The matrix below must match `coverageMatrixLegs()` in scripts/workspace/run-coverage.ts —
  # scripts/workspace/run-coverage.test.ts fails when the two drift, and codecov.yml's
  # `after_n_builds` counts these legs.
  coverage:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: portal, part: 1, parts: 2 }
          - { shard: portal, part: 2, parts: 2 }
          - { shard: app-admin, part: 1, parts: 3 }
          - { shard: app-admin, part: 2, parts: 3 }
          - { shard: app-admin, part: 3, parts: 3 }
          - { shard: packages, part: 1, parts: 1 }
    env:
      # A leg now runs one workspace's slice, so it can use the whole runner. The default of 2
      # dates from when a single leg ran 17 workspaces back to back and had to leave headroom.
      TENKACLOUD_VITEST_MAX_WORKERS: "4"
    steps:
      - name: Check out the code
        # actions/checkout v4.3.1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: true

      - uses: ./.github/actions/bun-install

      # Issue #993 / #2513: run this leg's workspaces (and, when the shard is split, this leg's
      # slice of its test files) and generate coverage/lcov.info.
      - name: Run tests with coverage (${{ matrix.shard }} ${{ matrix.part }}/${{ matrix.parts }})
        run: |
          bun run scripts/workspace/run-coverage.ts \
            --shard ${{ matrix.shard }} --part ${{ matrix.part }}/${{ matrix.parts }}

      # Issue #2676: derive the Codecov upload file list from the same COVERAGE_WORKSPACES
      # registry that runs coverage. A hand-written matrix list drifted to 5 lcov files while
      # run-coverage.ts generated 17 workspace reports, leaving several packages invisible in
      # Codecov even though the local coverage gate still checked them.
      - name: Resolve Codecov lcov files (${{ matrix.shard }})
        id: lcov
        run: |
          echo "files=$(bun run scripts/workspace/run-coverage.ts --shard ${{ matrix.shard }} --print-lcov-paths)" >> "$GITHUB_OUTPUT"

      # 3rd-party action は tag (mutable) ではなく commit SHA (immutable) で pin する
      # (= supply-chain attack 防御、 maintainer / attacker が tag を移動できなくする)。 v5.5.4 SHA。
      # Codecov は同一 commit に対する複数 upload を 1 つの commit report へマージするため、
      # leg ごとに分けて upload しても (PR / main push いずれでも) 最終的な report は分割前と
      # 同じ全体像になる。 base report が欠けることもない。
      - name: Upload coverage reports to Codecov (${{ matrix.shard }} ${{ matrix.part }}/${{ matrix.parts }})
        uses: codecov/codecov-action@aa56896cf108bd10b5eb883cd1d24196da57f695 # v5.5.4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # Codecov 側 outage で CI 全体を落とさない。 coverage 計測は補助、 必須でない。
          fail_ci_if_error: false
          # 各 workspace の coverage/lcov.info を明示的に拾う (= auto-discover に依存しない)。
          # The list is derived from COVERAGE_WORKSPACES to avoid upload drift (#2676).
          files: ${{ steps.lcov.outputs.files }}

  # Issue #2513: branch protection 用の安定した単一 check 名。 matrix job (coverage) は leg 数
  # だけ check が並び、 leg 構成が変わるたびに required status の設定も追随させる必要が出るため
  # 直接 required にはしにくい。 `if: always()` で matrix の成否に関わらず必ず走らせ、
  # needs.coverage.result を見て 1 つの check に集約する (third-party action は使わない)。
  coverage-complete:
    needs: coverage
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check coverage matrix result
        run: |
          if [ "${{ needs.coverage.result }}" != "success" ]; then
            echo "coverage matrix did not succeed: ${{ needs.coverage.result }}" >&2
            exit 1
          fi
          echo "coverage matrix succeeded"

  # Stable required check: fail when any surviving gate fails or is skipped.
  ci:
    needs: [gates, lint-ts, typecheck, build, coverage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check every gate's result
        run: |
          failed=""
          for entry in \
            "gates:${{ needs.gates.result }}" \
            "lint-ts:${{ needs.lint-ts.result }}" \
            "typecheck:${{ needs.typecheck.result }}" \
            "build:${{ needs.build.result }}" \
            "coverage:${{ needs.coverage.result }}"; do
            if [ "${entry#*:}" != "success" ]; then
              failed="$failed ${entry%%:*}(${entry#*:})"
            fi
          done
          if [ -n "$failed" ]; then
            echo "failed jobs:$failed" >&2
            exit 1
          fi
          echo "every gate succeeded"
