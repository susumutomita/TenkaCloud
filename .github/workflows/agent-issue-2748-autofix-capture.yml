name: Agent issue 2748 autofix capture

permissions:
  contents: write

on:
  push:
    branches:
      - agent/issue-2748-runtime-capability-evidence

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/issue-2748-runtime-capability-evidence
          fetch-depth: 0
          submodules: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.11"

      - name: Install locked dependencies
        run: make install_ci

      - name: Capture capability integration output
        run: |
          set +e
          python .agent/issue-2748-autofix.py > /tmp/issue-2748.log 2>&1
          status=$?
          git restore apps packages scripts landing || true
          mkdir -p .agent
          {
            echo "exit_status=$status"
            echo
            tail -n 1200 /tmp/issue-2748.log
          } > .agent/issue-2748-autofix-full.log

      - name: Commit diagnostics without racing other jobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .agent/issue-2748-autofix-full.log
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(agent): capture capability integration output"
          for attempt in 1 2 3; do
            git pull --rebase origin agent/issue-2748-runtime-capability-evidence
            if git push origin HEAD:agent/issue-2748-runtime-capability-evidence; then
              exit 0
            fi
          done
          exit 1
