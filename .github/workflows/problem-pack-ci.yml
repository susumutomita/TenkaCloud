name: problem-pack-ci

# Reusable workflow (Issue #2108): external TenkaCloud problem-pack repositories
# call this to validate their pack in CI WITHOUT copying Core CI internals or
# checking out / deploying the platform. An external pack adopts it with a single
# `uses:` stanza:
#
#   jobs:
#     validate-pack:
#       uses: susumutomita/TenkaCloud/.github/workflows/problem-pack-ci.yml@v1
#       with:
#         pack-directory: .
#         run-local-tests: true
#         upload-report: false
#
# Security and supply-chain rules (enforced here, asserted in
# packages/problem-sdk/test/reusable-workflow.test.ts):
#   - every third-party action is pinned to a full commit SHA;
#   - it is a workflow_call-only reusable workflow (no privileged PR trigger);
#   - the GitHub token is read-only (no write scopes);
#   - no cloud credentials / secrets are requested — validation is fully offline;
#   - the ONLY pack-supplied command run is the published SDK `pack-report` CLI;
#     no script from the pack is executed, and lifecycle scripts stay disabled;
#   - pack source files are NOT uploaded as artifacts — only the JSON report, and
#     only when `upload-report` is true.

on:
  workflow_call:
    inputs:
      pack-directory:
        description: "Relative path to the pack root (the directory holding tenkacloud-pack.json)."
        type: string
        required: false
        default: "."
      run-local-tests:
        description: "Run the offline local problem harness (deterministic SDK validation)."
        type: boolean
        required: false
        default: true
      upload-report:
        description: "Upload the deterministic JSON validation report as a build artifact."
        type: boolean
        required: false
        default: false
      core-version:
        description: "Optional explicit @tenkacloud/problem-sdk version for compatibility validation."
        type: string
        required: false
        default: "latest"
    outputs:
      pack-id:
        description: "Reverse-DNS pack id from the validated manifest."
        value: ${{ jobs.validate-pack.outputs.pack-id }}
      pack-version:
        description: "Exact SemVer pack version from the validated manifest."
        value: ${{ jobs.validate-pack.outputs.pack-version }}
      content-digest:
        description: "Deterministic hex SHA-256 over the pack's file bytes."
        value: ${{ jobs.validate-pack.outputs.content-digest }}
      validation-report-path:
        description: "Path to the JSON validation report inside the runner workspace."
        value: ${{ jobs.validate-pack.outputs.validation-report-path }}
      result:
        description: "Overall validation result: passed or failed."
        value: ${{ jobs.validate-pack.outputs.result }}

# Least privilege: the reusable workflow only reads the repository. It requests
# no write scopes, so a malicious pack cannot escalate through the job token.
permissions:
  contents: read

jobs:
  validate-pack:
    runs-on: ubuntu-latest
    outputs:
      pack-id: ${{ steps.report.outputs.pack-id }}
      pack-version: ${{ steps.report.outputs.pack-version }}
      content-digest: ${{ steps.report.outputs.content-digest }}
      validation-report-path: ${{ steps.report.outputs.validation-report-path }}
      result: ${{ steps.report.outputs.result }}
    steps:
      # 1. Check out the PACK repository (the caller), never TenkaCloud Core.
      #    actions/checkout v4.3.1 (pinned, matches Core ci.yml).
      - name: Check out the pack repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      # 2. Install only the pinned public CLI/SDK toolchain. oven-sh/setup-bun
      #    v2.0.2 (pinned, matches Core ci.yml).
      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.11"

      # 3-6. Validate the pack, run the offline harness (deterministic SDK
      # validation — NO pack-supplied script ever runs), produce the JSON report,
      # and surface its stable scalar fields as step outputs. Lifecycle scripts
      # stay disabled during install (supply-chain defense). The report path is
      # exported so the upload step (7) and the workflow outputs can reference it.
      - name: Validate pack and produce report
        id: report
        env:
          PACK_DIRECTORY: ${{ inputs.pack-directory }}
          RUN_LOCAL_TESTS: ${{ inputs.run-local-tests }}
          CORE_VERSION: ${{ inputs.core-version }}
          npm_config_ignore_scripts: "true"
        run: |
          set -euo pipefail
          report_path="${RUNNER_TEMP}/pack-validation-report.json"
          local_tests_flag=""
          if [ "${RUN_LOCAL_TESTS}" != "true" ]; then
            local_tests_flag="--no-local-tests"
          fi
          # Run ONLY the published SDK report CLI against the pack directory.
          # --ignore-scripts keeps any transitive lifecycle script from running.
          bunx --bun "@tenkacloud/problem-sdk@${CORE_VERSION}" \
            tenkacloud-pack-report "${PACK_DIRECTORY}" --out "${report_path}" ${local_tests_flag}

      # 7. Upload the JSON report ONLY when requested. By default nothing is
      # uploaded, and pack source files are never uploaded — only the report file.
      # actions/upload-artifact v4.6.2 (pinned to a full commit SHA).
      - name: Upload validation report
        if: ${{ inputs.upload-report && always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pack-validation-report
          path: ${{ steps.report.outputs.validation-report-path }}
          if-no-files-found: error
