name: Agent issue 2746 focused diagnose

permissions:
  contents: write

on:
  push:
    branches:
      - agent/issue-2746-sakura-hardening

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/issue-2746-sakura-hardening
          fetch-depth: 0
          submodules: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: make install_ci

      - name: Capture focused tests
        run: |
          set +e
          bun run --filter @TenkaCloud/infrastructure test \
            test/problem-deploy/sakura-apprun-rest-client.test.ts \
            test/problem-deploy/sakura-apprun-adapter.test.ts \
            test/problem-deploy/deploy-runtime-dispatch.test.ts \
            test/problem-deploy/deploy-delete.test.ts \
            test/problem-deploy/event-bulk-delete.test.ts \
            test/problem-deploy/runtime-status-reconciler.test.ts \
            > /tmp/issue-2746-focused.log 2>&1
          status=$?
          mkdir -p .agent
          {
            echo "exit_status=$status"
            echo
            cat /tmp/issue-2746-focused.log
          } > .agent/issue-2746-focused.log

      - name: Commit diagnostic and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/agent-issue-2746-focused-diagnose.yml
          git add -f .agent/issue-2746-focused.log
          git commit -m "chore(agent): capture Sakura focused test output"
          git pull --rebase origin agent/issue-2746-sakura-hardening
          git push origin HEAD:agent/issue-2746-sakura-hardening
