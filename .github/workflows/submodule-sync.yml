# Keeps the `problems/` submodule pin current automatically so nobody has to bump it by hand.
#
# Conflict-safe by design: the bump always lands as its **own isolated PR** (never injected into a
# feature commit), so it can't conflict with in-flight work — at worst the PR shows a merge conflict
# you resolve once, in one place. The pin only ever *advances* to the tip of the submodule's tracked
# branch (`branch = main` in .gitmodules), which the TenkaCloudChallenge repo has already validated
# via its own CI before merging there.
#
# It stops at a pushed branch and does NOT open the PR. `gh pr create` from Actions requires the
# repository's "Allow GitHub Actions to create and approve pull requests" toggle, which is off by
# owner decision: that single switch grants Actions PR *approval* as well as creation, and approval
# is not something a bot should hold. Every run of the old version that actually had a pin to move
# died on `GitHub Actions is not permitted to create or approve pull requests` AFTER pushing the
# branch, so the branch was the only thing it ever really delivered. That is now the stated contract
# instead of an accident, and the run stays green. Do not "fix" this by enabling the toggle.
#
# Cadence: every 6 hours, plus `workflow_dispatch`. It ran weekly until #3074 and that was the reason
# the pin kept going stale -- the catalog advances several times a day, so a Monday-only sync left the
# platform pinned up to six days behind. Fire it by hand right before cutting a release.
name: Submodule sync

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours at :17 UTC
  workflow_dispatch: {}

# It pushes a branch and writes a job summary. It no longer opens a PR, so it no longer
# needs pull-requests: write.
permissions:
  contents: write

concurrency:
  group: submodule-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 (pinned, matches ci.yml)
        with:
          submodules: true
          fetch-depth: 0

      - name: Bump problems submodule to its tracked branch tip
        id: bump
        run: |
          set -euo pipefail
          git submodule update --remote --recursive problems
          if git diff --quiet -- problems; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "problems submodule already at the latest pin — nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "short=$(git -C problems rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pinned dependencies for candidate sync
        if: steps.bump.outputs.changed == 'true'
        uses: ./.github/actions/bun-install

      - name: Push the pin-bump branch
        if: steps.bump.outputs.changed == 'true'
        env:
          SHORT: ${{ steps.bump.outputs.short }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BRANCH="chore/submodule-sync"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add problems
          # Advance only the unpublished candidate from the staged gitlink. Published release
          # history and built image identities are never rewritten by this automation.
          bun run scripts/release/host-candidate.ts --sync-catalog
          git add release/host-candidate.json
          git commit -m "chore(problems): bump submodule pin to latest ($SHORT) [automated]"
          git push --force-with-lease -u origin "$BRANCH"
          # The branch IS the deliverable — see the header comment for why this stops here.
          # Surface it where a human will actually see it, with the link that opens the PR.
          {
            echo "## Pin bump ready on \`$BRANCH\`"
            echo
            echo "Advanced the \`problems/\` pin to \`$SHORT\` and the unpublished host candidate catalog pin with it."
            echo
            echo "**Open the PR:** https://github.com/$REPO/compare/main...$BRANCH?expand=1"
            echo
            echo "Before merging, run \`make test\` locally on this branch. A catalog pin advance can"
            echo "break the platform's catalog-parity contracts, and no CI runs on a branch pushed with"
            echo "\`GITHUB_TOKEN\` — there is nothing green to trust here."
          } >> "$GITHUB_STEP_SUMMARY"
