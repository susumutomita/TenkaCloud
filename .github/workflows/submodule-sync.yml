# Keeps the `problems/` submodule pin current automatically so nobody has to bump it by hand.
#
# Conflict-safe by design: the bump always lands as its **own isolated PR** (never injected into a
# feature commit), so it can't conflict with in-flight work — at worst the PR shows a merge conflict
# you resolve once, in one place. The pin only ever *advances* to the tip of the submodule's tracked
# branch (`branch = main` in .gitmodules), which the TenkaCloudChallenge repo has already validated
# via its own CI before merging there.
#
# Cadence: every 6 hours, plus `workflow_dispatch`. It ran weekly until #3074 and that was the reason
# the pin kept going stale -- the catalog advances several times a day, so a Monday-only sync left the
# platform pinned up to six days behind. Fire it by hand right before cutting a release.
name: Submodule sync

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours at :17 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: submodule-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 (pinned, matches ci.yml)
        with:
          submodules: true
          fetch-depth: 0

      - name: Bump problems submodule to its tracked branch tip
        id: bump
        run: |
          set -euo pipefail
          git submodule update --remote --recursive problems
          if git diff --quiet -- problems; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "problems submodule already at the latest pin — nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "short=$(git -C problems rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Bun
        if: steps.bump.outputs.changed == 'true'
        # oven-sh/setup-bun v2.0.2 (pinned, matches ci.yml). The release scripts import only
        # node built-ins and repository sources, so no dependency install is needed here.
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.11"

      - name: Open (or update) the pin-bump PR
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHORT: ${{ steps.bump.outputs.short }}
        run: |
          set -euo pipefail
          BRANCH="chore/submodule-sync"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add problems
          # The release BOM pins the catalog the platform ships with, and identity validation
          # refuses to publish a tag whose gitlink and manifest disagree (#3024). Advance the
          # manifest with the pin — from the staged gitlink, never retyped — so `main` stays
          # taggable and `release:check` stays green.
          bun run release:catalog-pin
          git add release/tenkacloud-release.json release/tenkacloud-release.md
          git commit -m "chore(problems): bump submodule pin to latest ($SHORT) [automated]"
          git push --force-with-lease -u origin "$BRANCH"
          # Build the PR body in a file so multi-line markdown never breaks the YAML block scalar.
          printf '%s\n\n%s\n' \
            "Automated by \`.github/workflows/submodule-sync.yml\`. Advances the \`problems/\` pin to the tip of TenkaCloudChallenge \`main\` (\`$SHORT\`), which that repo's own CI validated before merge, and advances the release BOM catalog pin (\`release/tenkacloud-release.json\` + generated report) with it so the tree stays taggable. Review the submodule diff and merge." \
            "> **No parent CI runs on this PR.** GitHub does not trigger workflows for bot-authored PRs made with \`GITHUB_TOKEN\`, and this repository has no PAT by design. The merge gate is a reviewer running \`make test\` locally on this branch: a catalog pin advance can break the platform's catalog-parity contracts, and nothing here checks that for you. Do not merge on green-looking checks -- there are none." \
            > /tmp/pr-body.md
          # Reuse an existing open PR for this branch if there is one; otherwise open a fresh one.
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' 2>/dev/null)" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore(problems): bump submodule pin to latest" \
              --body-file /tmp/pr-body.md
          else
            echo "PR for $BRANCH already open — pushed the latest pin to it."
          fi
