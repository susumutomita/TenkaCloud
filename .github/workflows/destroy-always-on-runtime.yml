name: destroy-always-on-runtime

# ADR-049 Phase 4 (Issue #2363) — Always-On per-event runtime lifecycle (destroy).
#
# Tears down ONLY the per-event runtime stack (tenkacloud-event-runtime-<eventId>) via
# `make destroy-always-on-runtime` — the single stack for this event, never `--all`, so it
# cannot take down other events' runtimes or the shared ingress. Mirrors
# deploy-always-on-runtime.yml: GitHub OIDC only (sts:AssumeRoleWithWebIdentity), no
# long-lived AWS access keys, same environment / permission hardening (ADR-049 §12).

on:
  workflow_dispatch:
    inputs:
      eventId:
        description: Always-On event identifier to destroy the runtime for
        required: true
        type: string
      tenantId:
        description: Tenant that owns the event
        required: true
        type: string
      expiresAt:
        description: ISO-8601 deadline the runtime was tagged with (required for the destroy app synth)
        required: true
        type: string
      awsRegion:
        description: AWS region the runtime was deployed into
        required: true
        default: ap-northeast-1
        type: string

# Least privilege: id-token to mint the OIDC token, read-only on repo contents. Nothing else.
permissions:
  id-token: write
  contents: read

# One runtime lifecycle action per event at a time (deploy and destroy share the group).
concurrency:
  group: always-on-runtime-${{ inputs.eventId }}
  cancel-in-progress: false

jobs:
  destroy:
    runs-on: ubuntu-latest
    # ADR-049 §12: run inside a protected GitHub Environment so its reviewers / branch
    # rules gate the teardown, and the OIDC sub claim (repo:...:environment:*) matches.
    environment: always-on-runtime
    steps:
      # actions/checkout v4.3.1 (pinned to full SHA, matches ci.yml).
      - name: Check out the code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: true

      # oven-sh/setup-bun v2.0.2 (pinned to full SHA, matches ci.yml).
      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.11"

      - name: Install packages
        env:
          npm_config_ignore_scripts: "true"
          CI: "true"
        run: make install_ci

      # aws-actions/configure-aws-credentials v4.0.2 (pinned to full SHA). OIDC only:
      # role-to-assume + aws-region, no access keys. mask-aws-account-id keeps the
      # resolved account id out of the logs.
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ secrets.ALWAYS_ON_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.awsRegion }}
          mask-aws-account-id: true

      - name: Destroy Always-On per-event runtime
        env:
          # Untrusted-input-safe: dispatch inputs flow through env vars, never inline in run.
          # Do NOT echo account IDs; log only the stack / event identifiers.
          CDK_PARAM_AWS_REGION: ${{ inputs.awsRegion }}
          CDK_PARAM_ALWAYS_ON_EVENT_ID: ${{ inputs.eventId }}
          CDK_PARAM_ALWAYS_ON_TENANT_ID: ${{ inputs.tenantId }}
          CDK_PARAM_ALWAYS_ON_EXPIRES_AT: ${{ inputs.expiresAt }}
        run: |
          echo "Destroying Always-On per-event runtime for event: ${CDK_PARAM_ALWAYS_ON_EVENT_ID}"
          make destroy-always-on-runtime
