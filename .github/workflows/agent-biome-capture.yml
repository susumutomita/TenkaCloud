name: agent-biome-capture

permissions:
  contents: write

on:
  pull_request:
    paths:
      - ".claude/**"
      - "docs/architecture/**"
      - "infrastructure/lib/problem-deploy/**"
      - "Makefile"
      - ".github/workflows/**"

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/principle-driven-harness

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.11"

      - name: Install packages
        env:
          npm_config_ignore_scripts: "true"
          CI: "true"
        run: make install_ci

      - name: Capture Biome diagnostics
        run: bun biome check --reporter=json > biome-diagnostics.json || true

      - name: Commit diagnostics
        run: |
          if [ -z "$(git status --porcelain -- biome-diagnostics.json)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add biome-diagnostics.json
          git commit -m "chore(agent): capture Biome diagnostics"
          git push origin HEAD:agent/principle-driven-harness
