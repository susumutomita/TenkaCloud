name: Local host branch diagnostics

# Temporary read-only diagnostic workflow; removed before merge.
on:
  pull_request:
    paths:
      - '.github/workflows/local-host-fixup.yml'
permissions:
  contents: read
  packages: read
  actions: read
concurrency:
  group: local-host-diagnostics-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  diagnostics:
    if: >-
      github.repository == 'susumutomita/TenkaCloud' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/local-hosting-3226' &&
      github.actor == 'susumutomita'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/bun-install
      - name: Diagnose actual Bun request and shutdown boundaries without credentials
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/local-host/http.ts')
          s=p.read_text()
          for old,new in [
            ('validOrigin(request, origin);','console.log("TRACE request", request.method, new URL(request.url ?? "/", "http://localhost").pathname); validOrigin(request, origin);'),
            ('const raw = await readBody(request);','console.log("TRACE body before"); const raw = await readBody(request); console.log("TRACE body after");'),
            ('server.closeIdleConnections();','console.log("TRACE close begin", server.address()); server.closeIdleConnections(); console.log("TRACE idle closed");'),
            ('error => error ? reject(error) : accept()','error => { console.log("TRACE close callback", !!error); return error ? reject(error) : accept(); }'),
            ('server.listen(port, hostname, () => {','console.log("TRACE listen begin", hostname, port); server.listen(port, hostname, () => { console.log("TRACE listening");'),
            ('json(response, result.status, result.body);','console.log("TRACE result", result.status); json(response, result.status, result.body);')
          ]:
            assert old in s,old
            s=s.replace(old,new)
          p.write_text(s)
          p=Path('scripts/local-host/tests/run.ts');s=p.read_text()
          for old,new in [
            ('await entry.run();','console.log("TRACE test", entry.name); await entry.run();'),
            ('const environment = await createFixture();','console.log("TRACE fixture begin"); const environment = await createFixture(); console.log("TRACE fixture ready");'),
            ('await operation(environment);','await operation(environment); console.log("TRACE test operation done");'),
            ('await environment.close();','console.log("TRACE fixture close"); await environment.close(); console.log("TRACE fixture closed");'),
            ('for (const entry of testCases) {','for (const entry of testCases.slice(0, 2)) {')
          ]:
            assert old in s,old
            s=s.replace(old,new)
          p.write_text(s)
          PY
          set +e
          timeout -k 5 30 bun run test:host >/tmp/host-trace.log 2>&1
          echo "TRACE_EXIT=$?"
          cut -c1-500 /tmp/host-trace.log | head -150
          git restore -- scripts/local-host/http.ts scripts/local-host/tests/run.ts
      - name: Compact real-Docker and type diagnostics
        run: |
          set +e
          timeout -k 10 150 bun run test:host:docker >/tmp/host-docker.log 2>&1
          echo "DOCKER_EXIT=$?"
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/host-docker.log').read_text(errors='replace').splitlines()
          print('LOG_LINES',len(lines))
          for line in lines:
            if len(line)<1000 and line.strip():print(line)
          PY
          bun run typecheck:host 2>&1 | cut -c1-600
      - name: Collect precise lint categories and format code only in runner scratch
        run: |
          set +e
          bun run biome check --write scripts/local-host apps/application-admin-console/src/local-host apps/participant-portal/src/local-host apps/application-admin-console/vite.host.config.ts apps/participant-portal/vite.host.config.ts tsconfig.host.json package.json >/tmp/host-biome.log 2>&1
          bun run eslint scripts/local-host apps/application-admin-console/src/local-host apps/participant-portal/src/local-host apps/application-admin-console/vite.host.config.ts apps/participant-portal/vite.host.config.ts -f json >/tmp/host-eslint.json 2>/tmp/host-eslint.err
          python3 - <<'PY'
          import json,collections
          from pathlib import Path
          print('BIOME REMAINING')
          for line in Path('/tmp/host-biome.log').read_text(errors='replace').splitlines():
            if len(line)<700: print(line)
          try: reports=json.loads(Path('/tmp/host-eslint.json').read_text())
          except Exception:
            print(Path('/tmp/host-eslint.err').read_text());raise
          rules=collections.defaultdict(list)
          for f in reports:
            for m in f['messages']:
              rules[m.get('ruleId')].append((f['filePath'].split('/TenkaCloud/TenkaCloud/')[-1],m['line'],m['column'],m['message']))
          for rule,items in sorted(rules.items(),key=lambda x:-len(x[1])):
            print('RULE',rule,'COUNT',len(items))
            for item in items[:6]:print(' ',item)
          PY
