name: Local host branch diagnostics

# Temporary read-only development workflow. Remove before merging this feature.
# Export only repository content, installed packages and the public Bun executable.
# Never export .git authentication, runner HOME, environment files or credentials.
on:
  pull_request:
    paths:
      - '.github/workflows/local-host-fixup.yml'

permissions:
  contents: read
  packages: read
  actions: read

concurrency:
  group: local-host-diagnostics-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnostics:
    if: >-
      github.repository == 'susumutomita/TenkaCloud' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/local-hosting-3226' &&
      github.actor == 'susumutomita'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/bun-install
      - name: Package credential-free source and public build dependencies
        run: |
          mkdir -p /tmp/tenkacloud-validation-env
          tar --exclude='.git' --exclude='node_modules' --exclude='.env' --exclude='.env.*' -czf /tmp/tenkacloud-validation-env/source.tar.gz .
          find . -type d -name node_modules -prune -print0 | tar --null -T - -czf /tmp/tenkacloud-validation-env/dependencies.tar.gz
          gzip -c "$HOME/.bun/bin/bun" > /tmp/tenkacloud-validation-env/bun.gz
          git rev-parse HEAD > /tmp/tenkacloud-validation-env/source-commit.txt
          sha256sum /tmp/tenkacloud-validation-env/*.gz > /tmp/tenkacloud-validation-env/SHA256SUMS
          du -h /tmp/tenkacloud-validation-env/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local-host-validation-environment
          path: /tmp/tenkacloud-validation-env/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Independent diagnostic commands (not substitutes for required CI)
        run: |
          set +e
          failed=0
          for command in \
            'timeout -k 10 90 bun run test:host' \
            'bun run typecheck:host' \
            'bun run --filter @TenkaCloud/application-admin-console typecheck' \
            'bun run --filter @TenkaCloud/participant-portal typecheck' \
            'bun run build:host' \
            'timeout -k 10 180 bun run test:host:docker' \
            'bun run dead-code' \
            'bun run textlint docs/local-hosting.md' \
            'bun run biome check scripts/local-host apps/application-admin-console/src/local-host apps/participant-portal/src/local-host' \
            'bun run eslint scripts/local-host apps/application-admin-console/src/local-host apps/participant-portal/src/local-host apps/application-admin-console/vite.host.config.ts apps/participant-portal/vite.host.config.ts'; do
            echo "::group::DIAGNOSTIC $command"
            bash -c "$command"
            status=$?
            echo "DIAGNOSTIC_EXIT=$status"
            if [ "$status" -ne 0 ]; then failed=1; fi
            echo '::endgroup::'
          done
          exit "$failed"
