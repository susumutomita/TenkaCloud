name: symphony-fleet

permissions:
  contents: read

on:
  pull_request:
    paths:
      - ".symphony/**"
      - "scripts/agentic/**"
      - "GNUmakefile"
      - "package.json"
      - ".github/workflows/symphony-fleet.yml"
  push:
    branches: [main]
    paths:
      - ".symphony/**"
      - "scripts/agentic/**"
      - "GNUmakefile"
      - "package.json"
      - ".github/workflows/symphony-fleet.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.11"

      - name: Test the fleet launcher
        run: bun test scripts/agentic/symphony-fleet.test.ts

      - name: Validate all repository workflows
        run: bun run scripts/agentic/symphony-fleet.ts validate

      - name: Render the launch plan
        run: bun run scripts/agentic/symphony-fleet.ts print
