name: symphony

permissions:
  contents: read

on:
  pull_request:
    paths:
      - ".symphony/**"
      - "GNUmakefile"
      - ".github/workflows/symphony.yml"
  push:
    branches: [main]
    paths:
      - ".symphony/**"
      - "GNUmakefile"
      - ".github/workflows/symphony.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - run: make symphony-validate
