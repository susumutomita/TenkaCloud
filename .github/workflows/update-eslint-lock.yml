name: update-eslint-lock

on:
  push:
    branches: [agent/strengthen-typescript-eslint]

permissions:
  contents: write

jobs:
  update-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/strengthen-typescript-eslint
          persist-credentials: true
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: '1.3.11'
      - run: bun install --ignore-scripts
      - run: |
          rm .github/workflows/update-eslint-lock.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bun.lock .github/workflows/update-eslint-lock.yml
          git commit -m 'Update Bun lockfile for ESLint dependencies'
          git push
