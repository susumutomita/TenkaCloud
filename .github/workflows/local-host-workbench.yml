name: local-host-workbench

on:
  push:
    branches: [feat/local-event-host-3226]
    paths: [.github/workflows/local-host-workbench.yml]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.11"
      - name: Capture runtime executables, not package-manager shims
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/local-host-toolchain
          cp "$(command -v bun)" /tmp/local-host-toolchain/bun
          cp "$(command -v node)" /tmp/local-host-toolchain/node
          /tmp/local-host-toolchain/bun --version
          /tmp/local-host-toolchain/node --version
          tar -C /tmp/local-host-toolchain -czf /tmp/local-host-toolchain.tar.gz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local-host-toolchain
          path: /tmp/local-host-toolchain.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
