name: deploy-always-on-control-plane

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Cloudflare environment to deploy
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: always-on-control-plane-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloudflare-${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile
      - run: bun run --filter @tenkacloud/always-on-control-plane typecheck
      - run: bun run --filter @tenkacloud/always-on-control-plane test
      - name: Reject placeholder Auth0 configuration
        run: |
          if grep -Eq "replace-me|00000000-0000-0000-0000-000000000000" \
            apps/always-on-control-plane/wrangler.jsonc; then
            echo "Replace Auth0 and D1 placeholders before deployment." >&2
            exit 1
          fi

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/always-on-control-plane
          command: d1 migrations apply CONTROL_DB --env ${{ inputs.environment }} --remote

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/always-on-control-plane
          command: deploy --env ${{ inputs.environment }}
