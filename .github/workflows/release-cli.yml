name: release-cli

# Issue #3021 — CLI distribution. Publishes `@tenkacloud/cli` (packages/standalone-cli) as a
# tarball attached to the GitHub Release for the pushed tag, so `npm install -g` works without
# a monorepo checkout.
#
# Operational note: pushing a `v*` tag is enough. It produces the same --generate-notes
# ("What's Changed") release body as before, now with two tarballs attached
# (`tenkacloud-cli-<version>.tgz` and the fixed-name `tenkacloud-cli.tgz` used by the stable
# `releases/latest/download/` URL). Do NOT create the Release by hand before pushing the tag —
# this repository's Releases are immutable (assets cannot be added or changed after the Release
# is published), so a hand-created Release can never receive these assets. `workflow_dispatch`
# exists only to retry/backfill a `v*` tag whose Release was never created (e.g. this workflow
# failed before reaching the create step) — it cannot repair an already-published Release.
#
# Supply Chain Security: actions pinned to full SHA (matches ci.yml). No external secret is
# used; `GITHUB_TOKEN` is sufficient for both `gh release` and the `contents: write` permission.

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)build a release for, e.g. v1.3.0. Must already exist."
        required: true
        type: string

concurrency:
  group: release-cli-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the target tag
        id: tag
        env:
          # Keep event-derived values out of the shell program text. A tag/ref may contain
          # shell metacharacters, while workflow_dispatch accepts arbitrary input.
          TARGET_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          TAG="$TARGET_TAG"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG' does not look like a stable version tag (expected v<major>.<minor>.<patch>)." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check out the code
        # actions/checkout v4.3.1 (pinned, matches ci.yml)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ steps.tag.outputs.tag }}
          # scripts/assemble-runtime.mjs only copies apps/ infrastructure/ scripts/ packages/
          # and a handful of root files into the tarball. It never touches the problems/
          # submodule, so there is nothing for the CLI runtime to gain from checking it out.
          submodules: false

      - name: Setup Node.js
        # actions/setup-node v4 (pinned, matches form-sync.yml)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Setup Bun
        # oven-sh/setup-bun v2.0.2 (pinned, matches ci.yml). Only needed to run safe-chain
        # below — the packed CLI itself is smoke-tested on its bun-free path.
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.11"

      # Supply Chain Security: Safe Chain for malicious package detection
      - name: Setup safe-chain
        continue-on-error: true
        run: bunx @aikidosec/safe-chain setup-ci

      - name: Stamp the package version from the tag
        working-directory: packages/standalone-cli
        run: |
          set -euo pipefail
          npm pkg set version="${{ steps.tag.outputs.version }}"

      - name: Build the CLI tarball (prepack assembles the bundled runtime)
        working-directory: packages/standalone-cli
        # The repo-root .npmrc is this workspace's npm project config, and two of its
        # supply-chain defenses would break this step if left in effect here:
        #   - `ignore-scripts=true` silently skips prepack, producing a src-only tarball
        #     with no runtime/ (the smoke test's `--help` cannot catch that — see the
        #     assertion below). `--no-ignore-scripts` is safe in this job: @tenkacloud/cli
        #     has zero dependencies, so the only lifecycle script npm can run is this
        #     repo's own scripts/assemble-runtime.mjs.
        #   - `min-release-age` must be a Number of days; the `168h` the repo shipped
        #     until v1.3.0 makes npm 11.16 abort every command with "Invalid time value".
        #     Passing a valid value on the CLI (highest config precedence) keeps the
        #     7-day defense while letting workflow_dispatch backfill tags whose tree
        #     still carries the broken value.
        run: npm pack --no-ignore-scripts --min-release-age=7

      - name: Smoke test the packed tarball
        run: |
          set -euo pipefail
          TARBALL="$(ls packages/standalone-cli/tenkacloud-cli-*.tgz)"
          # Fail loudly if prepack was skipped (e.g. ignore-scripts crept back in): a
          # src-only tarball still installs and prints --help, so without this check a
          # runtime-less, unusable CLI would ship silently. `grep -c` (never `-q`) is
          # load-bearing under `set -o pipefail`: -q exits at the first match, tar dies
          # on the closed pipe (EPIPE), and the pipeline "fails" precisely when the
          # tarball is healthy — run 31554895670 rejected a good tarball that way.
          RUNTIME_FILES="$(tar -tzf "$TARBALL" | grep -c '^package/runtime/')" || RUNTIME_FILES=0
          if [ "$RUNTIME_FILES" -eq 0 ]; then
            echo "Tarball $TARBALL contains no runtime/ files — prepack did not run." >&2
            exit 1
          fi
          echo "Tarball contains $RUNTIME_FILES runtime/ files."
          PREFIX="$(mktemp -d)"
          # --min-release-age=7: same override as the pack step — the checked-out tag may
          # still carry the broken `168h` value in its .npmrc.
          npm install -g --prefix "$PREFIX" "$TARBALL" --min-release-age=7
          # Only the config-free, bun-free, AWS-free path is exercised here: printing usage
          # (src/cli.mjs's `!command || command === "help" || "--help" || "-h"` branch) returns
          # before touching TENKACLOUD_CONFIG_DIR or spawning `bun`/`aws`, so it is the one
          # command guaranteed to succeed on a bare runner with only the tarball installed. Run
          # it from outside the checkout to prove the tarball needs no monorepo on disk.
          (cd /tmp && "$PREFIX/bin/tenkacloud" --help)

      - name: Create the fixed-name copy for the stable download URL
        working-directory: packages/standalone-cli
        run: cp tenkacloud-cli-*.tgz tenkacloud-cli.tgz

      - name: Create or update the release
        working-directory: packages/standalone-cli
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          ASSETS=(tenkacloud-cli-*.tgz tenkacloud-cli.tgz)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — attempting to attach assets to it." >&2
            if ! gh release upload "$TAG" "${ASSETS[@]}" --clobber; then
              echo "Uploading assets to an existing release failed. This repository's Releases are" >&2
              echo "immutable: assets cannot be added or changed once a release is published. Do" >&2
              echo "not create the GitHub Release by hand before pushing the tag -- pushing a" >&2
              echo "v* tag alone creates a --generate-notes release with both tarballs attached" >&2
              echo "from the start. If a release for this tag already exists without the CLI" >&2
              echo "assets (created before this workflow existed, or by hand), delete that" >&2
              echo "release and re-push the tag (or re-run this workflow via workflow_dispatch)" >&2
              echo "so the release is created here, with the assets attached from the start." >&2
              exit 1
            fi
          else
            gh release create "$TAG" \
              --generate-notes \
              "${ASSETS[@]}"
          fi
