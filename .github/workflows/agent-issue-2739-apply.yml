name: Agent issue 2739 implementation

permissions:
  contents: write

on:
  push:
    branches:
      - agent/issue-2739-turso-scheduled-actions

jobs:
  apply-and-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.11"

      - name: Apply the backend-aware scheduled-resource fix
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          shared_path = Path("infrastructure/lib/problem-deploy/handlers/event-handler/shared.ts")
          shared = shared_path.read_text()
          shared = replace_once(
              shared,
              'import type { AdminAuditLogRepository } from "../../control-data/admin-audit-log-repository.js";\nimport type {',
              'import type { AdminAuditLogRepository } from "../../control-data/admin-audit-log-repository.js";\nimport { selectBackend } from "../../control-data/backend-config.js";\nimport type {',
              "shared import",
          )
          shared = replace_once(
              shared,
              ''' * **防御設計**: `COMPETITOR_ACCOUNTS_TABLE_NAME` env が未配線なら `undefined` を返す。 これにより
 * オーナーが generic-scoring Lambda に CompetitorAccounts read grant + env を足す前は scheduled
 * teardown が dormant になり、 毎分 tick / 採点を一切壊さない。''',
              ''' * **防御設計**: default DynamoDB backend では従来どおり table env が 1 つでも欠ければ
 * `undefined` を返して dormant にする。pure Turso backend は table 自体を synth しないため、注入済み
 * `ControlDataRuntime` が SQL repository を解決し、backend 非依存の bus / environment だけで有効化する
 * (#2739)。unknown backend は `selectBackend` が fail loud に拒否する。''',
              "teardown comment",
          )
          shared = replace_once(
              shared,
              '''export function buildScheduledTeardownResources(
  runtime: ControlDataRuntime,
): EventSharedResources | undefined {
  const competitorAccountsTableName = process.env.COMPETITOR_ACCOUNTS_TABLE_NAME;
  const eventsTableName = process.env.EVENTS_TABLE_NAME;
  const deploymentsTableName = process.env.DEPLOYMENTS_TABLE_NAME;
  const eventBusName = process.env.DEPLOY_EVENT_BUS_NAME;
  const env = process.env.DEPLOY_ENVIRONMENT;
  if (
    !competitorAccountsTableName ||
    !eventsTableName ||
    !deploymentsTableName ||
    !eventBusName ||
    !env
  ) {
    return undefined;
  }
  return {
    runtime,
    eventsTableName,
    deploymentsTableName,
    competitorAccountsTableName,
    eventBusName,
    env,
    ddb: DynamoDBDocumentClient.from(new DynamoDBClient({})),
    events: new EventBridgeClient({}),
    // teardown 未使用 field の placeholder (bulkTeardownEvent は参照しない)。
    teamsTableName: "",
    disruptionsTableName: process.env.DISRUPTIONS_TABLE_NAME ?? "",
    adminAuditLogTableName: process.env.ADMIN_AUDIT_LOG_TABLE_NAME ?? "",
    s3: new S3Client({}),
    scheduler: new SchedulerClient({}),
    problemsCatalog: {},
    problemsDisruptions: {},
    problemsProvenance: {},
    bulkDeployPayloadBucket: "",
    useBulkDistributedMap: false,
    // [#2571] generic-scoring Lambda は sakura/azure/gcp credential parameter への
    // ssm:GetParameter + kms:Decrypt grant を既に持つ (generic-scoring-lambda.ts) ため、
    // ここで wire しても新規 IAM は不要。 未 wire のままだと非 AWS single-provider 行の
    // scheduled bulk teardown が adapter.destroy に届かず leak する (#2571 の core bug)。
    ssm: new SSMClient({}),
    sakuraAppRunBaseUrl: process.env.SAKURA_APPRUN_BASE_URL || undefined,
  };
}''',
              '''export function buildScheduledTeardownResources(
  runtime: ControlDataRuntime,
): EventSharedResources | undefined {
  const backend = selectBackend(process.env);
  const competitorAccountsTableName = process.env.COMPETITOR_ACCOUNTS_TABLE_NAME;
  const eventsTableName = process.env.EVENTS_TABLE_NAME;
  const deploymentsTableName = process.env.DEPLOYMENTS_TABLE_NAME;
  const eventBusName = process.env.DEPLOY_EVENT_BUS_NAME;
  const env = process.env.DEPLOY_ENVIRONMENT;
  if (!eventBusName || !env) return undefined;
  if (
    backend.kind === "dynamodb" &&
    (!competitorAccountsTableName || !eventsTableName || !deploymentsTableName)
  ) {
    return undefined;
  }
  return {
    runtime,
    // Pure Turso has no DynamoDB tables. Repository seams ignore these placeholders and resolve
    // through the injected SQL runtime; DynamoDB reached this point only with every name present.
    eventsTableName: eventsTableName ?? "",
    deploymentsTableName: deploymentsTableName ?? "",
    competitorAccountsTableName: competitorAccountsTableName ?? "",
    eventBusName,
    env,
    ddb: DynamoDBDocumentClient.from(new DynamoDBClient({})),
    events: new EventBridgeClient({}),
    // teardown 未使用 field の placeholder (bulkTeardownEvent は参照しない)。
    teamsTableName: "",
    disruptionsTableName: process.env.DISRUPTIONS_TABLE_NAME ?? "",
    adminAuditLogTableName: process.env.ADMIN_AUDIT_LOG_TABLE_NAME ?? "",
    s3: new S3Client({}),
    scheduler: new SchedulerClient({}),
    problemsCatalog: {},
    problemsDisruptions: {},
    problemsProvenance: {},
    bulkDeployPayloadBucket: "",
    useBulkDistributedMap: false,
    // [#2571] generic-scoring Lambda は sakura/azure/gcp credential parameter への
    // ssm:GetParameter + kms:Decrypt grant を既に持つ (generic-scoring-lambda.ts) ため、
    // ここで wire しても新規 IAM は不要。 未 wire のままだと非 AWS single-provider 行の
    // scheduled bulk teardown が adapter.destroy に届かず leak する (#2571 の core bug)。
    ssm: new SSMClient({}),
    sakuraAppRunBaseUrl: process.env.SAKURA_APPRUN_BASE_URL || undefined,
  };
}''',
              "teardown builder",
          )
          shared = replace_once(
              shared,
              ''' * **防御設計**: deploy に必須な env (`TEAMS_TABLE_NAME` + `BATTLE_PROBLEMS_CATALOG` を含む) が
 * 1 つでも欠けると `undefined` を返す。 これにより generic-scoring Lambda に Teams read grant +
 * catalog 配線が無い間は scheduled deploy が dormant になり、 毎分 tick / 採点を一切壊さない
 * (= teardown 配線 (#1910) と同じ段階的有効化モデル)。 `bulkDeployEvent` は teams を Query し
 * problemsCatalog で problemId→problemDir を解決するため、 teardown の placeholder では不足する。''',
              ''' * **防御設計**: problem catalog / bus / environment は backend 共通で必須。default DynamoDB
 * backend は Teams を含む 4 table env も必須のままにし、1 つでも欠ければ dormant にする。pure Turso
 * backend は table env を synth しないため、空 placeholder と注入済み SQL runtime で repository seam を
 * 通す (#2739)。`bulkDeployEvent` の problemId→problemDir 解決には catalog が引き続き必須。''',
              "deploy comment",
          )
          shared = replace_once(
              shared,
              '''export function buildScheduledDeployResources(
  runtime: ControlDataRuntime,
): EventSharedResources | undefined {
  const competitorAccountsTableName = process.env.COMPETITOR_ACCOUNTS_TABLE_NAME;
  const eventsTableName = process.env.EVENTS_TABLE_NAME;
  const deploymentsTableName = process.env.DEPLOYMENTS_TABLE_NAME;
  const teamsTableName = process.env.TEAMS_TABLE_NAME;
  const eventBusName = process.env.DEPLOY_EVENT_BUS_NAME;
  const env = process.env.DEPLOY_ENVIRONMENT;
  const problemsCatalog = parseProblemsCatalog(process.env.BATTLE_PROBLEMS_CATALOG);
  if (
    !competitorAccountsTableName ||
    !eventsTableName ||
    !deploymentsTableName ||
    !teamsTableName ||
    !eventBusName ||
    !env ||
    Object.keys(problemsCatalog).length === 0
  ) {
    return undefined;
  }
  return {
    runtime,
    eventsTableName,
    deploymentsTableName,
    teamsTableName,
    competitorAccountsTableName,
    eventBusName,
    env,
    problemsCatalog,
    ddb: DynamoDBDocumentClient.from(new DynamoDBClient({})),
    events: new EventBridgeClient({}),
    s3: new S3Client({}),
    scheduler: new SchedulerClient({}),
    // deploy 未使用 field の placeholder (bulkDeployEvent fan-out 経路は参照しない)。
    disruptionsTableName: process.env.DISRUPTIONS_TABLE_NAME ?? "",
    adminAuditLogTableName: process.env.ADMIN_AUDIT_LOG_TABLE_NAME ?? "",
    problemsDisruptions: {},
    problemsProvenance: {},
    // Distributed Map 経路は EventApiLambda 専用 (= S3 bucket env)。 reconciler は旧 fan-out
    // 経路 (N×M DeployCreateRequested publish) を使うので bucket 不要 / flag は false 固定。
    bulkDeployPayloadBucket: "",
    useBulkDistributedMap: false,
    // [#2571] teardown 側と同じく generic-scoring Lambda は sakura/azure/gcp credential
    // grant を既に持つ。 未 wire のままだと scheduled bulk deploy が非 AWS single-provider
    // 問題の v1 unsupportedRuntime gate すら通らず silent skip する (#2571 の core bug —
    // resolveProblemRuntimeDescriptor 自体も未配線だったため)。
    ssm: new SSMClient({}),
    sakuraAppRunBaseUrl: process.env.SAKURA_APPRUN_BASE_URL || undefined,
    resolveProblemRuntimeDescriptor: makeProblemRuntimeDescriptorResolver(
      process.env.BATTLE_PROBLEMS_RUNTIMES,
    ),
  };
}''',
              '''export function buildScheduledDeployResources(
  runtime: ControlDataRuntime,
): EventSharedResources | undefined {
  const backend = selectBackend(process.env);
  const competitorAccountsTableName = process.env.COMPETITOR_ACCOUNTS_TABLE_NAME;
  const eventsTableName = process.env.EVENTS_TABLE_NAME;
  const deploymentsTableName = process.env.DEPLOYMENTS_TABLE_NAME;
  const teamsTableName = process.env.TEAMS_TABLE_NAME;
  const eventBusName = process.env.DEPLOY_EVENT_BUS_NAME;
  const env = process.env.DEPLOY_ENVIRONMENT;
  const problemsCatalog = parseProblemsCatalog(process.env.BATTLE_PROBLEMS_CATALOG);
  if (!eventBusName || !env || Object.keys(problemsCatalog).length === 0) return undefined;
  if (
    backend.kind === "dynamodb" &&
    (!competitorAccountsTableName || !eventsTableName || !deploymentsTableName || !teamsTableName)
  ) {
    return undefined;
  }
  return {
    runtime,
    // Pure Turso has no DynamoDB tables. Repository seams ignore these placeholders and resolve
    // through the injected SQL runtime; DynamoDB reached this point only with every name present.
    eventsTableName: eventsTableName ?? "",
    deploymentsTableName: deploymentsTableName ?? "",
    teamsTableName: teamsTableName ?? "",
    competitorAccountsTableName: competitorAccountsTableName ?? "",
    eventBusName,
    env,
    problemsCatalog,
    ddb: DynamoDBDocumentClient.from(new DynamoDBClient({})),
    events: new EventBridgeClient({}),
    s3: new S3Client({}),
    scheduler: new SchedulerClient({}),
    // deploy 未使用 field の placeholder (bulkDeployEvent fan-out 経路は参照しない)。
    disruptionsTableName: process.env.DISRUPTIONS_TABLE_NAME ?? "",
    adminAuditLogTableName: process.env.ADMIN_AUDIT_LOG_TABLE_NAME ?? "",
    problemsDisruptions: {},
    problemsProvenance: {},
    // Distributed Map 経路は EventApiLambda 専用 (= S3 bucket env)。 reconciler は旧 fan-out
    // 経路 (N×M DeployCreateRequested publish) を使うので bucket 不要 / flag は false 固定。
    bulkDeployPayloadBucket: "",
    useBulkDistributedMap: false,
    // [#2571] teardown 側と同じく generic-scoring Lambda は sakura/azure/gcp credential
    // grant を既に持つ。 未 wire のままだと scheduled bulk deploy が非 AWS single-provider
    // 問題の v1 unsupportedRuntime gate すら通らず silent skip する (#2571 の core bug —
    // resolveProblemRuntimeDescriptor 自体も未配線だったため)。
    ssm: new SSMClient({}),
    sakuraAppRunBaseUrl: process.env.SAKURA_APPRUN_BASE_URL || undefined,
    resolveProblemRuntimeDescriptor: makeProblemRuntimeDescriptorResolver(
      process.env.BATTLE_PROBLEMS_RUNTIMES,
    ),
  };
}''',
              "deploy builder",
          )
          shared_path.write_text(shared)

          lambda_path = Path("infrastructure/lib/problem-deploy/generic-scoring-lambda.ts")
          lambda_source = lambda_path.read_text()
          lambda_source = replace_once(
              lambda_source,
              '''   * [Issue #2442 / Phase C2] `controlDataBackend` が純 SQL (`turso`) のとき
   * `ProblemDeployBackendStack` は本 table を synth しない (= `undefined`)。その場合 env
   * `COMPETITOR_ACCOUNTS_TABLE_NAME` は注入せず grant も付与しない —
   * `buildScheduledTeardownResources` / `buildScheduledDeployResources` は空文字 env を
   * 既に「未配線 = dormant」として扱うため、pure SQL では scheduled teardown/deploy が
   * dormant のまま安全に倒れる ({@link eventsTable} と同じ条件)。''',
              '''   * [Issue #2442 / Phase C2 / #2739] `controlDataBackend` が純 SQL (`turso`) のとき
   * `ProblemDeployBackendStack` は本 table を synth しない (= `undefined`)。その場合 env / DDB grant
   * は付与しないが、backend-aware scheduled resource builders は注入済み SQL runtime を使うため
   * teardown/deploy を有効化できる。DynamoDB backend の staged-enablement guard は維持する。''',
              "lambda props comment",
          )
          lambda_source = replace_once(
              lambda_source,
              '''        // [ADR-047] scheduled auto-teardown 用。 buildScheduledTeardownResources がこの env を見て
        // 有効化する (未設定なら scheduled teardown は dormant)。 Issue #2442: 純 SQL backend
        // では table 自体が無いので env も足さない (= dormant のまま安全に倒れる)。''',
              '''        // [ADR-047 / #2739] DynamoDB では staged-enablement guard に使う table env。
        // pure SQL backend は table 自体が無いので env を足さないが、builder は backend を見て
        // injected SQL runtime + bus/environment で scheduled teardown を有効化する。''',
              "lambda teardown env comment",
          )
          lambda_source = replace_once(
              lambda_source,
              '''        // [ADR-047 follow-up] scheduled auto-deploy 用。 buildScheduledDeployResources がこの env +
        // BATTLE_PROBLEMS_CATALOG (下の define) を見て有効化する (未設定なら scheduled deploy は dormant)。''',
              '''        // [ADR-047 follow-up / #2739] DynamoDB では staged-enablement guard に使う Teams env。
        // pure SQL backend は table env 無しでも、catalog + bus/environment + injected SQL runtime で有効。''',
              "lambda deploy env comment",
          )
          lambda_path.write_text(lambda_source)
          PY

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Format changed files
        run: |
          bun x biome format --write \
            infrastructure/lib/problem-deploy/handlers/event-handler/shared.ts \
            infrastructure/lib/problem-deploy/generic-scoring-lambda.ts \
            infrastructure/test/problem-deploy/scheduled-resources-turso.test.ts \
            infrastructure/test/problem-deploy/generic-scoring-reconciler-scheduled-turso.test.ts \
            infrastructure/test/problem-deploy/generic-scoring-turso-synth.test.ts

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            infrastructure/lib/problem-deploy/handlers/event-handler/shared.ts \
            infrastructure/lib/problem-deploy/generic-scoring-lambda.ts \
            infrastructure/test/problem-deploy/scheduled-resources-turso.test.ts \
            infrastructure/test/problem-deploy/generic-scoring-reconciler-scheduled-turso.test.ts \
            infrastructure/test/problem-deploy/generic-scoring-turso-synth.test.ts
          git commit -m "fix(scoring): enable scheduled actions on pure Turso"
          git push

      - name: Run focused tests
        working-directory: infrastructure
        run: |
          bun run test/run-vitest.ts run \
            test/problem-deploy/scheduled-resources-turso.test.ts \
            test/problem-deploy/generic-scoring-reconciler-scheduled-turso.test.ts \
            test/problem-deploy/generic-scoring-turso-synth.test.ts

      - name: Run infrastructure typecheck and Biome
        run: |
          bun run --filter @TenkaCloud/infrastructure typecheck
          bun x biome check \
            infrastructure/lib/problem-deploy/handlers/event-handler/shared.ts \
            infrastructure/lib/problem-deploy/generic-scoring-lambda.ts \
            infrastructure/test/problem-deploy/scheduled-resources-turso.test.ts \
            infrastructure/test/problem-deploy/generic-scoring-reconciler-scheduled-turso.test.ts \
            infrastructure/test/problem-deploy/generic-scoring-turso-synth.test.ts
