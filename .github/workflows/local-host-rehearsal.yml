name: Local hosting rehearsal

# Exercise the real Docker adapter when the hosting implementation or any runtime contract it
# imports changes: the shared container scorer, Compose policy, Docker adapter, manifest, port
# remapper, state store and verifier, plus the pinned problems catalog it reads sqli-demo from.
# PRs cover the organizer/two-participant competition flow. workflow_dispatch retains the full
# Docker/image/browser rehearsal; required ci already runs all host HTTP/SQLite tests and types.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/local-host/**'
      - 'scripts/lib/**'
      - 'scripts/problem-pack/**'
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - 'infrastructure/templates/**'
      - 'problems'
      - 'apps/**/local-host/**'
      - 'apps/application-admin-console/src/**'
      - 'apps/participant-portal/src/**'
      - 'apps/**/vite.host.config.ts'
      - 'apps/**/host.html'
      - 'tsconfig.host.json'
      - 'docker/host/**'
      - '.github/workflows/local-host-rehearsal.yml'

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  local-host:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: true
      - uses: ./.github/actions/bun-install
      - name: Type-check hosting and both existing applications
        if: github.event_name == 'workflow_dispatch'
        run: |
          bun run typecheck:host
          bun run --filter @TenkaCloud/application-admin-console typecheck
          bun run --filter @TenkaCloud/participant-portal typecheck
      - name: Real SQLite and HTTP boundary tests
        if: github.event_name == 'workflow_dispatch'
        run: bun run test:host
      - name: Build the host and normal participant interfaces
        run: bun run build:host
      - name: Check Docker availability
        run: |
          docker info
          docker compose version
      - name: Production SQL and PostgreSQL terminal with two isolated teams
        if: github.event_name == 'workflow_dispatch'
        env:
          # Isolated runner fixture; only this test's owned Compose projects use compact IPAM.
          HOST_DOCKER_NETWORK_POOL: 10.240.0.0/16
        run: bun run test:host:docker
      - name: Hosted image plays a Cryptography Battle at its advertised origins
        if: github.event_name == 'workflow_dispatch'
        run: |
          docker build -f docker/host/Dockerfile \
            --build-arg TENKACLOUD_SOURCE_COMMIT="$(git rev-parse HEAD)" \
            --build-arg TENKACLOUD_CATALOG_COMMIT="$(git rev-parse HEAD:problems)" \
            -t tenkacloud-host:review .
          TENKACLOUD_HOST_IMAGE=tenkacloud-host:review bun run test:host:container
          bun run release:candidate --image tenkacloud-host:review --out .tenkacloud/host-candidate-built.json
      # Playwright's pinned Chromium for the browser rehearsal (the runner has none preinstalled).
      - name: Install Chromium for the browser rehearsal
        run: bunx playwright-core install --with-deps chromium
      - name: Forensic evidence, citations, scoring and SQLite restart
        run: bun run scripts/local-host/tests/forensic-browser-e2e.ts
      - name: Critical browser flow (organizer + two participants, real Docker)
        if: github.event_name == 'pull_request'
        env:
          HOST_E2E_ENGINE: docker
        run: bun run test:host:browser:smoke
      - name: Full browser rehearsal (all hosting features, real Docker)
        if: github.event_name == 'workflow_dispatch'
        env:
          HOST_E2E_ENGINE: docker
        run: bun run test:host:browser
      - name: Keep verified local UI screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local-host-ui-review
          path: |
            .tenkacloud/host-ui-review/local-catalog.png
            .tenkacloud/host-ui-review/local-event-create.png
            .tenkacloud/host-ui-review/participant-competition.png
            .tenkacloud/host-ui-review/participant-scoreboard.png
            .tenkacloud/host-ui-review/forensic-organizer-started.png
            .tenkacloud/host-ui-review/forensic-evidence-explanation.png
            .tenkacloud/host-ui-review/forensic-official-history.png
            .tenkacloud/host-ui-review/forensic-official-ranking.png
            .tenkacloud/host-ui-review/forensic-timeline-hints.png
            .tenkacloud/host-ui-review/forensic-recovery-hints.png
          retention-days: 3
          # The parent directory is hidden; only the reviewed PNGs above are eligible.
          include-hidden-files: true
          if-no-files-found: ignore
