name: Local hosting rehearsal

# Exercise the real Docker adapter when the hosting implementation or any runtime contract it
# imports changes: the shared container scorer, Compose policy, Docker adapter, manifest, port
# remapper, state store and verifier, plus the pinned problems catalog it reads sqli-demo from.
# PRs cover the organizer/two-participant competition flow. workflow_dispatch retains the full
# Docker/image/browser rehearsal; required ci already runs all host HTTP/SQLite tests and types.
on:
  workflow_dispatch:
    inputs:
      vpn_acceptance:
        description: 'Run only the approved ephemeral VPN acceptance VM'
        type: boolean
        required: false
        default: false
  pull_request:
    paths:
      - 'scripts/local-host/**'
      - 'scripts/lib/**'
      - 'scripts/problem-pack/**'
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - 'infrastructure/templates/**'
      - 'catalog-sources.json'
      - 'catalog-lock.json'
      - 'apps/**/local-host/**'
      - 'apps/application-admin-console/src/**'
      - 'apps/participant-portal/src/**'
      - 'apps/**/vite.host.config.ts'
      - 'apps/**/host.html'
      - 'tsconfig.host.json'
      - 'docker/host/**'
      - '.github/workflows/local-host-rehearsal.yml'

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  local-host:
    if: github.event_name != 'workflow_dispatch' || !inputs.vpn_acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: ./.github/actions/bun-install
      - name: Type-check hosting and both existing applications
        if: github.event_name == 'workflow_dispatch'
        run: |
          bun run typecheck:host
          bun run --filter @TenkaCloud/application-admin-console typecheck
          bun run --filter @TenkaCloud/participant-portal typecheck
      - name: Real SQLite and HTTP boundary tests
        if: github.event_name == 'workflow_dispatch'
        run: bun run test:host
      - name: Build the host and normal participant interfaces
        run: bun run build:host
      - name: Check Docker availability
        run: |
          docker info
          docker compose version
      - name: Production SQL and PostgreSQL terminal with two isolated teams
        if: github.event_name == 'workflow_dispatch'
        env:
          # Isolated runner fixture; only this test's owned Compose projects use compact IPAM.
          HOST_DOCKER_NETWORK_POOL: 10.240.0.0/16
        run: bun run test:host:docker
      - name: Hosted image plays a Forensic Casebook at its advertised origins
        if: github.event_name == 'workflow_dispatch'
        run: |
          docker build -f docker/host/Dockerfile \
            --build-arg TENKACLOUD_SOURCE_COMMIT="$(git rev-parse HEAD)" \
            --build-arg TENKACLOUD_CATALOG_DIGEST="$(bun run scripts/release/host-candidate.ts --catalog-digest)" \
            -t tenkacloud-host:review .
          TENKACLOUD_HOST_IMAGE=tenkacloud-host:review bun run test:host:container
          bun run release:candidate --image tenkacloud-host:review --out .tenkacloud/host-candidate-built.json
      # Playwright's pinned Chromium for the browser rehearsal (the runner has none preinstalled).
      - name: Install Chromium for the browser rehearsal
        run: bunx playwright-core install --with-deps chromium
      # Each exercises one problem for about 30 seconds; only the full rehearsal runs them.
      - name: Native Pi Siege, authenticated seats, official ranking and SQLite process restart
        if: github.event_name == 'workflow_dispatch'
        run: bun run scripts/local-host/tests/pi-siege-browser-e2e.ts
      - name: Tenant Boundary Duel, code repair, authenticated seats and persisted score history
        if: github.event_name == 'workflow_dispatch'
        run: bun run scripts/local-host/tests/tenant-boundary-browser-e2e.ts
      - name: Forensic evidence, citations, scoring and SQLite restart
        if: github.event_name == 'workflow_dispatch'
        run: bun run scripts/local-host/tests/forensic-browser-e2e.ts
      - name: Purpose selection without GPU or model downloads
        env:
          HOST_E2E_ENGINE: coordination
          HOST_E2E_CATALOG_ALL: '1'
          HOST_E2E_ADMIN_PORT: '0'
          HOST_E2E_PARTICIPANT_PORT: '0'
        run: bun run scripts/local-host/tests/purpose-selection-rehearsal.ts
      - name: Critical browser flow (organizer + two participants, real Docker)
        if: github.event_name == 'pull_request'
        env:
          HOST_E2E_ENGINE: docker
        run: bun run test:host:browser:smoke
      - name: Same local application under Node 24 with real Docker
        env:
          HOST_E2E_ENGINE: docker
          HOST_E2E_HTTP_RUNTIME: node
        run: |
          bun run scripts/local-host/build-node.ts
          bun run scripts/local-host/tests/browser-e2e.ts
      - name: Full browser rehearsal (all hosting features, real Docker)
        if: github.event_name == 'workflow_dispatch'
        env:
          HOST_E2E_ENGINE: docker
        run: bun run test:host:browser
      - name: Keep verified local UI screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local-host-ui-review
          path: |
            .tenkacloud/host-ui-review/local-catalog.png
            .tenkacloud/host-ui-review/local-event-create.png
            .tenkacloud/host-ui-review/purpose-selection-mobile.png
            .tenkacloud/host-ui-review/participant-competition.png
            .tenkacloud/host-ui-review/participant-scoreboard.png
            .tenkacloud/host-ui-review/pi-siege/native-debrief-en.png
            .tenkacloud/host-ui-review/pi-siege/native-debrief-ja-mobile.png
            .tenkacloud/host-ui-review/pi-siege/native-official-ranking.png
            .tenkacloud/host-ui-review/pi-siege/native-official-history.png
            .tenkacloud/host-ui-review/tenant-boundary-duel/replay-en.png
            .tenkacloud/host-ui-review/tenant-boundary-duel/replay-ja-mobile.png
            .tenkacloud/host-ui-review/tenant-boundary-duel/official-ranking.png
            .tenkacloud/host-ui-review/tenant-boundary-duel/official-history.png
            .tenkacloud/host-ui-review/forensic-organizer-started.png
            .tenkacloud/host-ui-review/forensic-evidence-explanation.png
            .tenkacloud/host-ui-review/forensic-official-history.png
            .tenkacloud/host-ui-review/forensic-official-ranking.png
            .tenkacloud/host-ui-review/forensic-timeline-hints.png
            .tenkacloud/host-ui-review/forensic-recovery-hints.png
          retention-days: 3
          # The parent directory is hidden; only the reviewed PNGs above are eligible.
          include-hidden-files: true
          if-no-files-found: ignore

  vpn-acceptance:
    # Never run native VM configuration on pull_request or push events.
    if: github.event_name == 'workflow_dispatch' && inputs.vpn_acceptance == true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      TENKACLOUD_VPN_ACCEPTANCE: github-ephemeral-v1
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
        timeout-minutes: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
        timeout-minutes: 2
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: '1.3.11'
        timeout-minutes: 2
      - name: Install locked dependencies without lifecycle scripts
        id: dependencies
        timeout-minutes: 5
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Prepare the approved disposable native Linux VM
        id: prepare
        timeout-minutes: 6
        run: |
          sudo env TENKACLOUD_VPN_ACCEPTANCE="$TENKACLOUD_VPN_ACCEPTANCE" \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" RUNNER_OS="$RUNNER_OS" ImageOS="$ImageOS" \
            TENKACLOUD_BUN_SOURCE="$(command -v bun)" \
            bash scripts/local-host/tests/vpn-acceptance-setup.sh
      - name: NORMAL - prepare the explicitly selected public problem catalog
        id: catalog
        timeout-minutes: 4
        continue-on-error: true
        run: make catalog-download catalog-prepare
      - name: NORMAL - build the original host interfaces
        id: normal-build
        if: steps.catalog.outcome == 'success'
        timeout-minutes: 5
        continue-on-error: true
        run: bun run build:host
      - name: NORMAL - install pinned browser
        id: chromium
        timeout-minutes: 4
        continue-on-error: true
        run: bunx playwright-core install --with-deps chromium
      - name: NORMAL - original Dockerfiles, SQL and PostgreSQL with two teams
        id: normal-docker
        if: always() && steps.catalog.outcome == 'success' && steps.prepare.outcome == 'success'
        timeout-minutes: 6
        continue-on-error: true
        env:
          HOST_DOCKER_NETWORK_POOL: 10.240.0.0/16
        run: bun run test:host:docker
      - name: NORMAL - organizer and two participant browsers with real Docker
        id: normal-browser
        if: always() && steps.normal-build.outcome == 'success' && steps.chromium.outcome == 'success'
        timeout-minutes: 6
        continue-on-error: true
        env:
          HOST_E2E_ENGINE: docker
        run: bun run test:host:browser:smoke
      - name: Verify real peer packets and fail-closed restart
        id: vpn
        if: always() && steps.prepare.outcome == 'success' && steps.dependencies.outcome == 'success'
        timeout-minutes: 14
        continue-on-error: true
        run: |
          sudo env TENKACLOUD_VPN_ACCEPTANCE="$TENKACLOUD_VPN_ACCEPTANCE" \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" RUNNER_OS="$RUNNER_OS" ImageOS="$ImageOS" \
            "$(command -v bun)" run scripts/local-host/tests/vpn-acceptance.ts
      - name: Remove only the acceptance fixture's owned resources
        id: cleanup
        if: always()
        timeout-minutes: 2
        run: |
          sudo env TENKACLOUD_VPN_ACCEPTANCE="$TENKACLOUD_VPN_ACCEPTANCE" \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" RUNNER_OS="$RUNNER_OS" ImageOS="$ImageOS" \
            "$(command -v bun)" run scripts/local-host/tests/vpn-acceptance.ts --cleanup
      - name: Report separate normal-flow and VPN outcomes
        if: always()
        env:
          CATALOG_OUTCOME: ${{ steps.catalog.outcome }}
          BUILD_OUTCOME: ${{ steps.normal-build.outcome }}
          CHROMIUM_OUTCOME: ${{ steps.chromium.outcome }}
          DOCKER_OUTCOME: ${{ steps.normal-docker.outcome }}
          BROWSER_OUTCOME: ${{ steps.normal-browser.outcome }}
          VPN_OUTCOME: ${{ steps.vpn.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: |
          printf 'NORMAL catalog=%s build=%s chromium=%s docker=%s browser=%s\n' \
            "$CATALOG_OUTCOME" "$BUILD_OUTCOME" "$CHROMIUM_OUTCOME" "$DOCKER_OUTCOME" "$BROWSER_OUTCOME"
          printf 'VPN packets/restart=%s cleanup=%s\n' "$VPN_OUTCOME" "$CLEANUP_OUTCOME"
          for outcome in "$CATALOG_OUTCOME" "$BUILD_OUTCOME" "$CHROMIUM_OUTCOME" \
            "$DOCKER_OUTCOME" "$BROWSER_OUTCOME" "$VPN_OUTCOME" "$CLEANUP_OUTCOME"; do
            [[ "$outcome" == success ]] || exit 1
          done
