name: Local hosting rehearsal

# Exercise the real Docker adapter when the hosting implementation changes.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/local-host/**'
      - 'apps/**/local-host/**'
      - 'apps/**/vite.host.config.ts'
      - 'apps/**/host.html'
      - 'tsconfig.host.json'
      - '.github/workflows/local-host-rehearsal.yml'

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  local-host:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: true
      - uses: ./.github/actions/bun-install
      - name: Type-check hosting and both existing applications
        run: |
          bun run typecheck:host
          bun run --filter @TenkaCloud/application-admin-console typecheck
          bun run --filter @TenkaCloud/participant-portal typecheck
      - name: Real SQLite and HTTP boundary tests
        run: bun run test:host
      - name: Build the host and normal participant interfaces
        run: bun run build:host
      - name: Check Docker availability
        run: |
          docker info
          docker compose version
      - name: Production adapter and existing sqli-demo with two teams
        run: bun run test:host:docker
