name: agent-biome-fix

permissions:
  contents: write

on:
  pull_request:
    paths:
      - ".claude/harness/**/*.ts"
      - ".claude/settings.json"
      - "infrastructure/lib/problem-deploy/**/*.ts"
      - ".github/workflows/agent-biome-fix.yml"

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/principle-driven-harness

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.11"

      - name: Install packages
        env:
          npm_config_ignore_scripts: "true"
          CI: "true"
        run: make install_ci

      - name: Apply Biome formatting
        run: |
          bun biome check --write \
            .claude/settings.json \
            .claude/harness/src/rules/hook-command-target-exists.ts \
            .claude/harness/src/rules/hook-command-target-exists.test.ts \
            .claude/harness/src/rules/index.ts \
            infrastructure/lib/problem-deploy/runtime-clients/ssrf-guard.ts \
            infrastructure/lib/problem-deploy/runtime-clients/http-probe-client.ts \
            infrastructure/lib/problem-deploy/handlers/shared/ssrf-guard.ts \
            infrastructure/lib/problem-deploy/handlers/generic-scoring-handler/scoring-kernel.ts

      - name: Commit format changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude infrastructure/lib/problem-deploy
          git commit -m "fix(agent): apply Biome formatting"
          git push origin HEAD:agent/principle-driven-harness
