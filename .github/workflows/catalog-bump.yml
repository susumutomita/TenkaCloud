name: Catalog release bump

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional stable TenkaCloudChallenge release tag (otherwise latest release)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: catalog-release-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
      - uses: ./.github/actions/bun-install
      - name: Resolve, acquire and validate the new catalog
        id: bump
        env:
          CATALOG_TAG: ${{ inputs.tag }}
        run: bun run scripts/problem-pack/catalog-bump-main.ts
      - name: Verify the published lock
        if: steps.bump.outputs.branch != ''
        run: make catalog-verify-lock
      - name: Sync the unbuilt host candidate catalog pin
        if: steps.bump.outputs.branch != ''
        shell: bash
        run: |
          set -euo pipefail
          if jq -e '.image == null' release/host-candidate.json > /dev/null; then
            bun run scripts/release/host-candidate.ts --sync-catalog
            bun run release:check
          else
            echo "release/host-candidate.json records a built image; its catalog pin is left for the next candidate." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Push and open the catalog PR, then dispatch CI
        if: steps.bump.outputs.branch != ''
        env:
          BRANCH: ${{ steps.bump.outputs.branch }}
          TAG: ${{ steps.bump.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git switch -c "$BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog-sources.json catalog-lock.json release/host-candidate.json
          git commit -m "chore(catalog): select TenkaCloudChallenge $TAG by release tag"
          git push origin "$BRANCH"
          if ! gh pr create --base main --head "$BRANCH" \
            --title "chore(catalog): select TenkaCloudChallenge $TAG by release tag" \
            --body-file catalog-bump-body.md > pr-url.txt 2> pr-error.txt; then
            cat pr-error.txt >&2
            if grep -Eiq 'not permitted to create or approve pull requests|not allowed to create or approve pull requests|Resource not accessible by integration' pr-error.txt; then
              message='Enable Settings → Actions → General → Workflow permissions → "Allow GitHub Actions to create and approve pull requests".'
              echo "::error::$message"
              echo "$message" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "Branch \`$BRANCH\` remains pushed. Create the PR manually, then dispatch ci.yml on that branch." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat pr-url.txt >> "$GITHUB_STEP_SUMMARY"
          gh workflow run ci.yml --ref "$BRANCH"
          echo "Dispatched ci.yml on \`$BRANCH\` for the required ci check." >> "$GITHUB_STEP_SUMMARY"
