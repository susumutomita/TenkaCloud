# GitHub Pages: landing/ ディレクトリだけを配信する。
#
# 設計判断: ADR / 運用 doc などの中間情報 (= docs/) は **ホストしない**。
# 公開 landing は OSS としての product description / 入り口だけに絞り、
# 設計詳細は repo 内 docs/ で完結させて core 開発者だけが読む形にする。
# (= public landing と core dev docs を IA で分離)
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      # 「モックで試す」 動線で配信する participant-portal が rebuild 対象なので、
      # apps/participant-portal/** の変更でも Pages を再 deploy する。 さもないと
      # portal demo の fixtures / UI 変更が landing 経由でしか反映されない (= PR #1217
      # で score events fixture / mock info UX が live に反映されなかった原因)。
      - 'apps/participant-portal/**'
      # Issue #1954: 運営フロー demo (application-admin-console) も /admin-demo/ で配信するため、
      # その変更でも Pages を再 deploy する。
      - 'apps/application-admin-console/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the code
        # actions/checkout v4.3.1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: true
      - name: Setup safe-chain
        continue-on-error: true
        run: bunx @aikidosec/safe-chain setup-ci
      # Build participant-portal as static demo (dev-mock mode) and place under
      # landing/portal-demo/ so the LP can iframe a live mock. base=/TenkaCloud/portal-demo/
      # matches GitHub Pages project-page subpath; BrowserRouter picks this up via
      # `import.meta.env.BASE_URL`.
      - name: Setup Bun
        # oven-sh/setup-bun v2.0.2
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.11
      - name: Install dependencies (ignore lifecycle scripts)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build participant-portal demo
        # `bun run --filter <pkg>` 経由だと workspace 解決のタイミングで "No packages
        # matched the filter" を返すことがあるため、 workspace ディレクトリへ cd して
        # 直接 vite を呼ぶ。 base=/TenkaCloud/portal-demo/ で BrowserRouter basename +
        # 静的 asset path の両方を解決する (= main.tsx 側は `import.meta.env.BASE_URL`)。
        working-directory: apps/participant-portal
        run: |
          bun x vite build --base=/TenkaCloud/portal-demo/
      - name: Stage participant-portal demo under landing/portal-demo/
        run: |
          mkdir -p landing/portal-demo
          cp -r apps/participant-portal/dist/. landing/portal-demo/
      # Issue #1954: 運営フロー demo (application-admin-console) を no-AWS demo mode で static
      # build し landing/admin-demo/ に配置する。 VITE_DEMO_MODE=1 で mock auth + demo-client、
      # base=/TenkaCloud/admin-demo/ で routing + asset path を解決、 参加者 demo への hand-off
      # 先 (participantPortalUrl) は deploy 済 portal-demo の Pages path に向ける。
      - name: Build application-admin-console demo
        working-directory: apps/application-admin-console
        env:
          VITE_DEMO_MODE: "1"
          VITE_DEMO_PARTICIPANT_URL: /TenkaCloud/portal-demo/
        run: |
          bun x vite build --base=/TenkaCloud/admin-demo/
      - name: Stage application-admin-console demo under landing/admin-demo/
        run: |
          mkdir -p landing/admin-demo
          cp -r apps/application-admin-console/dist/. landing/admin-demo/
      # 全 third-party action は **commit SHA で pin** する (tag は移動可能なため supply-chain
      # 攻撃面になる)。version comment は更新の参考、書き換えは Renovate に任せる。
      # actions/configure-pages v5.0.0
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      # actions/upload-pages-artifact v3.0.1
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: landing
      # actions/deploy-pages v4.0.5
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
