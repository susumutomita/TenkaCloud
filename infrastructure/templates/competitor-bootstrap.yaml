AWSTemplateFormatVersion: "2010-09-09"
Description: >
  TenkaCloud Competitor Bootstrap. Deployed once by the competitor (= the AWS
  account that hosts the problem stacks) to grant the TenkaCloud control plane
  AssumeRole access. Trust is restricted to the TenkaCloud account ID + ExternalId
  combo to prevent Confused Deputy attacks.

# After deploying this stack, share the RoleArn output with the TenkaCloud
# operator. The operator can then deploy problem CFn templates into this account.
# Deleting the stack removes the role and revokes TenkaCloud access in one shot.

# NOTE: IAM Role / Policy Description fields only allow tab/LF/CR + printable
# ASCII (0x20-0x7E) + Latin-1 supplement (0xA1-0xFF). CJK characters cause
# CREATE_FAILED with InvalidRequest. Keep all Description fields ASCII-only.

Parameters:
  TenkaCloudAccountId:
    Type: String
    AllowedPattern: "^[0-9]{12}$"
    ConstraintDescription: Must be a 12-digit AWS account ID.
    Description: >-
      AWS account ID of the TenkaCloud control plane that is allowed to
      AssumeRole into this account. Shared by the operator in advance.
  ExternalId:
    Type: String
    NoEcho: true
    MinLength: 16
    MaxLength: 128
    AllowedPattern: "^[A-Za-z0-9_=,.@:/-]+$"
    Description: >-
      ExternalId secret passed by TenkaCloud when assuming the role.
      Tenant-specific secret used to defend against Confused Deputy attacks.
      Shared by the operator in advance and must be kept secret.
  RoleName:
    Type: String
    Default: TenkaCloud-CompetitorDeploy-Role
    AllowedPattern: "^[A-Za-z0-9_+=,.@-]{1,64}$"
    Description: >-
      IAM Role name to create. Keep the default unless coordinated with the
      operator (TenkaCloud expects this exact name).

Resources:
  # Role with broad permissions over the surfaces touched by problem CFn templates.
  # Each problem may create VPC + EC2 + IAM (instance profile / role) + the CFn
  # stack itself; this scope is wide enough for Create / Update / Delete.
  # Tightening to least-privilege is deferred until problem templates stabilize.
  CompetitorDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: >-
        AssumeRole target used by TenkaCloud to deploy problem CFn stacks
        (security-battle-royale, etc.) into this account. Trust = TenkaCloud
        account + ExternalId.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowTenkaCloudControlPlaneToAssume
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${TenkaCloudAccountId}:root"
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      MaxSessionDuration: 3600
      Policies:
        - PolicyName: ProblemDeployPermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # CloudFormation umbrella (deploy / update / delete / describe).
              - Sid: CloudFormationFull
                Effect: Allow
                Action:
                  - cloudformation:*
                Resource: "*"

              # EC2 / VPC resources created by problem CFn templates.
              - Sid: Ec2Vpc
                Effect: Allow
                Action:
                  - ec2:*
                Resource: "*"

              # SSM (AMI resolution + Session Manager) + Parameter Store.
              - Sid: Ssm
                Effect: Allow
                Action:
                  - ssm:GetParameters
                  - ssm:GetParameter
                  - ssm:GetParametersByPath
                  - ssm:DescribeParameters
                Resource: "*"

              # IAM scope is narrowed to the `tc-*` Path / Name prefix that
              # problem CFn templates use for their instance profile / role.
              - Sid: IamForProblemRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PassRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:GetInstanceProfile
                  - iam:AddRoleToInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                  - iam:TagRole
                  - iam:UntagRole
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/tc-*"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:instance-profile/tc-*"

              # S3 headroom for future problem templates (= unused today,
              # kept narrow via `tc-*` bucket prefix).
              - Sid: S3ForProblemBuckets
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:GetBucket*
                  - s3:PutBucket*
                  - s3:ListBucket
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - "arn:aws:s3:::tc-*"
                  - "arn:aws:s3:::tc-*/*"

              # CloudWatch Logs for problem app / UserData diagnostics.
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DeleteLogGroup
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Resource: "*"
      Tags:
        - Key: TenkaCloud:Purpose
          Value: competitor-deploy
        - Key: TenkaCloud:ManagedBy
          Value: competitor-bootstrap.yaml

Outputs:
  RoleArn:
    Description: >-
      ARN of the created Role. Share this value with the TenkaCloud operator;
      TenkaCloud will then be able to deploy problem stacks into this account.
    Value: !GetAtt CompetitorDeployRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-RoleArn"
  AccountId:
    Description: Competitor AWS account ID (value to enter in the TenkaCloud UI).
    Value: !Ref AWS::AccountId
  RoleName:
    Description: Role name (for verifying that it matches the TenkaCloud default).
    Value: !Ref RoleName
