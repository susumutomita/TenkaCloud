AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  TenkaCloud cloud hosting launcher: Lambda, DynamoDB, Cognito and both existing web
  applications. Review the broad CodeBuild caller role and selected sources before
  creating this launcher or starting a build. Current deploy reuses standard CDKToolkit,
  or runs official cdk bootstrap only if missing, with explicit unattended approval.
  Standard bootstrap defaults to AdministratorAccess for CloudFormation execution.
  Default current sources are pinned to an offline-verified
  candidate; live AWS deployment remains unverified. Current destroy coordinates event cleanup and
  retains history, identity and asset storage, which may continue to incur charges.
  Advanced historical-source compatibility preserves the original fixed implementation,
  including its broad deployment role and destructive destroy-all contract. It does not
  migrate data or accept current hosting options.

# One complete launcher. Historical parameter IDs, physical names, checkpoints and
# action semantics remain available only under the explicit historical source contract.
# No AWS execution or IAM change is performed by generating or reviewing this file.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Organizer (review privileged deployment role before use)"
        Parameters:
          - TenantAdminEmail
      - Label:
          default: "Advanced: repository sources and release classification"
        Parameters:
          - SourceContract
          - RepoUrl
          - RepoRef
          - ProblemsRepoUrl
          - ProblemsRepoRef
      - Label:
          default: "Advanced: control-data backend (safe to leave alone)"
        Parameters:
          - ControlDataBackend
          - TursoDatabaseUrl
          - TursoAuthTokenParameterName
      - Label:
          default: "Advanced: capacity and build tuning (safe to leave alone)"
        Parameters:
          - Environment
          - Action
          - DeployExternalId
          - DynamoReadCapacity
          - DynamoWriteCapacity
          - RetainDataTables
          - BunVersion
          - CodeBuildTimeoutMinutes
    ParameterLabels:
      TenantAdminEmail:
        default: "Organizer email (receives the Cognito invite after deploy)"

Parameters:
  SourceContract:
    Type: String
    Default: current-cloud-v1
    AllowedValues:
      - current-cloud-v1
      - historical-949a40a9
    Description: >-
      Current Lambda/DynamoDB hosting uses standard CDKToolkit and the reviewed broad
      CodeBuild role. Starting deploy approves first bootstrap if missing and application
      IAM changes; the default CDK execution role uses AdministratorAccess. The advanced historical
      contract preserves the original complete launcher, broad IAM and destroy-all
      behavior for its pinned old source pair. No automatic data migration is performed.

  Environment:
    Type: String
    Default: development
    AllowedValues:
      - development
      - staging
      - production
    Description: >-
      Target environment. Selects infrastructure/environments/{env}/config.json
      in the historical contract. Current hosting uses the same selected environment
      for its application and backend stacks; CDKToolkit is shared per account/region.

  Action:
    Type: String
    Default: deploy
    AllowedValues:
      - deploy
      - destroy
      - destroy-all
    Description: >-
      Current deploy starts hosting and destroy drains recorded event resources before
      removing platform stacks, retaining data. destroy-all is historical-only.
      Historical behavior: deploy starts hosting; destroy removes the stacks;
      `destroy-all` additionally removes stack-owned retained data first. The cleanup
      tutorial uses ACTION=destroy-all. Note that `destroy` no longer preserves DynamoDB
      history by default (#2959): tables are deployed with DeletionPolicy: Delete unless
      the deploy set RetainDataTables=true, so they go away with the stacks. That default
      exists because retained tables keep billing and nothing cleans them up.

  TenantAdminEmail:
    Type: String
    Description: >-
      Application Admin Console initial user (Tenant Admin). After the cloud deployment,
      the selected implementation creates this Cognito user and emails an invitation.
    AllowedPattern: ^[^\s@]+@[^\s@]+\.[^\s@]+$
    ConstraintDescription: Must be a valid email address.

  RepoUrl:
    Type: String
    Default: https://github.com/susumutomita/TenkaCloud.git
    Description: >-
      Public git URL of the TenkaCloud platform repo to deploy. Override only when
      deploying a fork.

  RepoRef:
    Type: String
    Default: ""
    Description: >-
      Optional full commit SHA, branch or tag. Empty uses the source-contract default
      in SourceDefaults below. Current sources must implement current-cloud-v1; an
      incompatible ref fails before AWS changes. main is development/unreleased.

  ProblemsRepoUrl:
    Type: String
    Default: https://github.com/susumutomita/TenkaCloudChallenge.git
    Description: >-
      Public git URL cloned into problems/. Custom catalogs remain selectable; current
      hosting executes only compatible hello-world and ac26-crypto-battle artifacts.

  ProblemsRepoRef:
    Type: String
    Default: ""
    Description: >-
      Optional full commit SHA, branch or tag. Empty uses the source-contract default.
      Current catalogs must contain the reviewed hello-world and ac26-crypto-battle
      artifacts and their supported contracts; arbitrary additional runtimes are not enabled.

  DeployExternalId:
    Type: String
    Default: ""
    NoEcho: true
    AllowedPattern: '^$|^[A-Za-z0-9_=,.@:/-]{16,128}$'
    ConstraintDescription: >-
      Leave empty for a same-account cloud hosting trial, or enter 16-128 ASCII letters,
      digits, and _ = , . @ : / -.
    Description: >-
      Optional CDK_PARAM_DEPLOY_EXTERNAL_ID for AssumeRole into competitor accounts
      (problem deploy backend). Leave empty for a same-account cloud hosting trial.

  ControlDataBackend:
    Type: String
    Default: dynamodb
    AllowedValues:
      - dynamodb
      - turso
    Description: >-
      Current hosting supports DynamoDB only. Historical-source behavior
      (CDK_PARAM_CONTROL_DATA_BACKEND): `dynamodb` (default)
      keeps every table on DynamoDB. `turso` is the pure-SQL zero-cost backend -
      CDK synthesizes ZERO DynamoDB tables - and requires TursoDatabaseUrl +
      TursoAuthTokenParameterName. See docs/running-costs.md.

  TursoDatabaseUrl:
    Type: String
    Default: ""
    Description: >-
      Turso libsql:// database URL (from `turso db show <db> --url`). Required when
      ControlDataBackend is turso; leave empty for dynamodb.

  TursoAuthTokenParameterName:
    Type: String
    Default: ""
    Description: >-
      SSM Parameter Store name (SecureString) holding the Turso auth token - create it
      first, e.g. `aws ssm put-parameter --name /TenkaCloud/development/turso/auth-token
      --type SecureString --value <token>`. Required for a non-dynamodb backend. The
      deploy Lambda reads it at runtime; CodeBuild only forwards the name.

  DynamoReadCapacity:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 200
    Description: >-
      Historical-source option; current on-demand tables require the unchanged value 1.
      Provisioned read capacity units applied to every DynamoDB table AND every GSI
      (CDK_PARAM_DYNAMODB_READ_CAPACITY, fanned out by the DynamoDbLowCapacity aspect).
      Default 1 keeps the standing cost at the practical minimum for a personal trial;
      raise it for an event with real load - 1 RCU throttles quickly. Raising it raises
      the hourly DynamoDB charge; the 200 ceiling matches the event-capacity runbook's
      billing guard (docs/operations/dynamodb-event-capacity.md) so a digit typo cannot
      provision thousands of units. Ignored when ControlDataBackend is turso (zero
      DynamoDB tables are synthesized there).

  DynamoWriteCapacity:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 200
    Description: >-
      Historical-source option; current on-demand tables require the unchanged value 1.
      Provisioned write capacity units applied to every DynamoDB table AND every GSI
      (CDK_PARAM_DYNAMODB_WRITE_CAPACITY). Same default/cost/ceiling/behavior notes as
      DynamoReadCapacity, including being ignored when ControlDataBackend is turso.

  RetainDataTables:
    Type: String
    Default: auto
    AllowedValues:
      - auto
      - "false"
      - "true"
    Description: >-
      Current hosting always retains data; false is rejected. auto selects true for
      current hosting and preserves the historical default false for historical sources.
      Historical behavior (CDK_PARAM_RETAIN_DATA_TABLES):
      Default false, so ACTION=destroy removes them along with the stacks. Set true only
      if you want the history kept: retained tables keep billing at their provisioned
      capacity forever, and nothing deletes them for you - you have to run
      `aws dynamodb delete-table` by hand. This is read at DEPLOY time and baked into the
      stack template, so flipping it later has no effect on a stack that is already
      deployed; re-deploy first, then destroy.

  BunVersion:
    Type: String
    Default: 1.3.11
    Description: Bun version installed in the build (matches the repo toolchain).

  CodeBuildTimeoutMinutes:
    Type: Number
    Default: 90
    MinValue: 15
    MaxValue: 480
    Description: CodeBuild timeout in minutes (a cloud deployment usually finishes in 15-30).

Mappings:
  SourceDefaults:
    current-cloud-v1:
      # Offline-verified current CLI source; live AWS deployment is not validated.
      CurrentPlatformCommit: 6cec1a9284e5103fe7d27067479b42f1cb64e3c5
      CatalogCommit: 915fe862fe09bf6b63bb96edcf0cb3deddd54d37
      Classification: candidate/unreleased
    historical-949a40a9:
      CurrentPlatformCommit: 949a40a9ed9199331d928ad5cf9397dbb4ba3f81
      CatalogCommit: 363a7c9b83969e20d63b74fd0410a354da5e202b
      Classification: historical/unverified

Conditions:
  UsesCurrentSources: !Equals [!Ref SourceContract, current-cloud-v1]
  HasPlatformOverride: !Not [!Equals [!Ref RepoRef, ""]]
  HasCatalogOverride: !Not [!Equals [!Ref ProblemsRepoRef, ""]]
  HasAnyOverride: !Or
    - !Condition HasPlatformOverride
    - !Condition HasCatalogOverride
  HasExternalId: !Not [!Equals [!Ref DeployExternalId, ""]]
  UsesAnyMainRef: !Or
    - !Equals [!Ref RepoRef, main]
    - !Equals [!Ref ProblemsRepoRef, main]

Resources:
  LauncherLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      # Distinct from CodeBuild's legacy default `/aws/codebuild/<project>` so an existing
      # launcher can update without "resource already exists"; destroy-all removes that legacy group.
      LogGroupName: !Sub /tenkacloud/codebuild/lite-launcher-${Environment}
      RetentionInDays: 1

  # =====================================
  # CodeBuild project: clones the repos, installs bun, builds the SPAs, bootstraps CDK,
  # runs `make deploy`. NO_SOURCE -> the buildspec fetches its own source via git clone.
  # =====================================
  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub tenkacloud-lite-${Environment}
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        Image: aws/codebuild/amazonlinux-x86_64-standard:5.0
        ComputeType: BUILD_GENERAL1_MEDIUM
        # CDK asset bundling can fall back to Docker; PrivilegedMode keeps it reliable.
        PrivilegedMode: true
        ImagePullCredentialsType: CODEBUILD
        EnvironmentVariables:
          - Name: SOURCE_CONTRACT
            Value: !Ref SourceContract
            Type: PLAINTEXT
          - Name: DEFAULT_CLASSIFICATION
            Value: !FindInMap [SourceDefaults, !Ref SourceContract, Classification]
            Type: PLAINTEXT
          - Name: DEFAULT_REPO_REF
            Value: !FindInMap [SourceDefaults, !Ref SourceContract, CurrentPlatformCommit]
            Type: PLAINTEXT
          - Name: DEFAULT_PROBLEMS_REPO_REF
            Value: !FindInMap [SourceDefaults, !Ref SourceContract, CatalogCommit]
            Type: PLAINTEXT
          - Name: ENVIRONMENT
            Value: !Ref Environment
            Type: PLAINTEXT
          - Name: ACTION
            Value: !Ref Action
            Type: PLAINTEXT
          - Name: TENANT_ADMIN_EMAIL
            Value: !Ref TenantAdminEmail
            Type: PLAINTEXT
          - Name: REPO_URL
            Value: !Ref RepoUrl
            Type: PLAINTEXT
          - Name: REPO_REF
            Value: !If [HasPlatformOverride, !Ref RepoRef, !FindInMap [SourceDefaults, !Ref SourceContract, CurrentPlatformCommit]]
            Type: PLAINTEXT
          - Name: PROBLEMS_REPO_URL
            Value: !Ref ProblemsRepoUrl
            Type: PLAINTEXT
          - Name: PROBLEMS_REPO_REF
            Value: !If [HasCatalogOverride, !Ref ProblemsRepoRef, !FindInMap [SourceDefaults, !Ref SourceContract, CatalogCommit]]
            Type: PLAINTEXT
          - Name: DEPLOY_EXTERNAL_ID
            Value: !If [HasExternalId, !Ref DeployExternalId, ""]
            Type: PLAINTEXT
          - Name: CONTROL_DATA_BACKEND
            Value: !Ref ControlDataBackend
            Type: PLAINTEXT
          - Name: TURSO_DATABASE_URL
            Value: !Ref TursoDatabaseUrl
            Type: PLAINTEXT
          - Name: TURSO_AUTH_TOKEN_PARAMETER_NAME
            Value: !Ref TursoAuthTokenParameterName
            Type: PLAINTEXT
          - Name: DYNAMO_READ_CAPACITY
            Value: !Ref DynamoReadCapacity
            Type: PLAINTEXT
          - Name: DYNAMO_WRITE_CAPACITY
            Value: !Ref DynamoWriteCapacity
            Type: PLAINTEXT
          - Name: RETAIN_DATA_TABLES
            Value: !Ref RetainDataTables
            Type: PLAINTEXT
          - Name: BUN_VERSION
            Value: !Ref BunVersion
            Type: PLAINTEXT
          - Name: JSII_DEPRECATED
            Value: quiet
            Type: PLAINTEXT
          - Name: TENKACLOUD_LITE_MANAGED_LAUNCHER_LOG_GROUP
            Value: "1"
            Type: PLAINTEXT
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            install:
              # Node 22 is the newest version the managed CodeBuild standard image ships;
              # node 24 is not yet a managed runtime (aws/aws-codebuild-docker-images#795).
              # bun drives the toolchain and Node only backs the CDK CLI shebang + esbuild.
              runtime-versions:
                nodejs: 22
              commands:
                - |
                  echo "Source contract: ${SOURCE_CONTRACT}"
                  if [ "${REPO_REF}" = "main" ] || [ "${PROBLEMS_REPO_REF}" = "main" ]; then
                    release_classification="development/unreleased"
                  elif [ "${REPO_REF}" = "${DEFAULT_REPO_REF}" ] && [ "${PROBLEMS_REPO_REF}" = "${DEFAULT_PROBLEMS_REPO_REF}" ]; then
                    release_classification="${DEFAULT_CLASSIFICATION}"
                  else
                    release_classification="custom/unverified"
                  fi
                  echo "Release classification: ${release_classification}"

                  checkout_repo_ref() {
                    checkout_repo_url="$1"
                    checkout_requested_ref="$2"
                    checkout_destination="$3"
                    checkout_label="$4"

                    if printf '%s' "${checkout_requested_ref}" | grep -Eq '^[0-9a-fA-F]{40}$'; then
                      echo "Fetching ${checkout_label} ${checkout_repo_url} @ immutable commit ${checkout_requested_ref}"
                      if ! git init --quiet "${checkout_destination}"; then
                        echo "Failed to initialize ${checkout_label} checkout."
                        return 1
                      fi
                      if ! git -C "${checkout_destination}" remote add origin "${checkout_repo_url}"; then
                        echo "Failed to configure ${checkout_label} origin."
                        return 1
                      fi
                      if ! git -C "${checkout_destination}" fetch --depth 1 origin "${checkout_requested_ref}"; then
                        echo "Failed to fetch ${checkout_label} commit ${checkout_requested_ref}; refusing to fall back to another ref."
                        return 1
                      fi
                      if ! checkout_resolved_ref="$(git -C "${checkout_destination}" rev-parse --verify 'FETCH_HEAD^{commit}')"; then
                        echo "Fetched ${checkout_label} ref did not resolve to a commit."
                        return 1
                      fi
                      checkout_normalized_ref="$(printf '%s' "${checkout_requested_ref}" | tr '[:upper:]' '[:lower:]')"
                      if [ "${checkout_resolved_ref}" != "${checkout_normalized_ref}" ]; then
                        echo "Resolved ${checkout_label} commit ${checkout_resolved_ref} does not match requested ${checkout_normalized_ref}."
                        return 1
                      fi
                      if ! git -C "${checkout_destination}" checkout --quiet --detach "${checkout_resolved_ref}"; then
                        echo "Failed to check out ${checkout_label} commit ${checkout_resolved_ref}."
                        return 1
                      fi
                    else
                      echo "Cloning ${checkout_label} ${checkout_repo_url} @ ${checkout_requested_ref}"
                      if ! git clone --depth 1 --branch "${checkout_requested_ref}" "${checkout_repo_url}" "${checkout_destination}"; then
                        echo "Failed to clone ${checkout_label} ref ${checkout_requested_ref}; no fallback ref will be used."
                        return 1
                      fi
                    fi
                  }

                  # Public OSS repositories: no auth / GitHub connection. A full commit SHA
                  # uses fetch + detached checkout because `git clone --branch <sha>` fails.
                  checkout_repo_ref "${REPO_URL}" "${REPO_REF}" repo platform || exit 1
                  # Replace the platform's catalog submodule with the independently selected
                  # problem catalog so third parties can ship their own repository.
                  if [ "${SOURCE_CONTRACT}" = "current-cloud-v1" ] && [ ! -f repo/scripts/cloud-hosting/launcher-check.ts ]; then
                    echo "Selected platform ref does not implement current-cloud-v1; refusing incompatible deployment."
                    exit 1
                  fi
                  rm -rf repo/problems
                  checkout_repo_ref "${PROBLEMS_REPO_URL}" "${PROBLEMS_REPO_REF}" repo/problems catalog || exit 1
                - cd repo
                - echo "Installing bun ${BUN_VERSION}"
                - npm install -g "bun@${BUN_VERSION}"
                - bun --version
                # Frozen + ignore-scripts matches the repo supply-chain policy (make install_ci).
                - bun install --frozen-lockfile --ignore-scripts
            pre_build:
              commands:
                - cd "${CODEBUILD_SRC_DIR}/repo"
                - |
                  export AWS_REGION="${AWS_DEFAULT_REGION}"
                  if [ "${SOURCE_CONTRACT}" = "current-cloud-v1" ]; then
                    bun scripts/cloud-hosting/launcher-check.ts || exit 1
                    export TENKACLOUD_ADMIN_EMAIL="${TENANT_ADMIN_EMAIL}"
                    export CDK_PARAM_ENVIRONMENT="${ENVIRONMENT}"
                    export ENV="${ENVIRONMENT}"
                  elif [ "${SOURCE_CONTRACT}" = "historical-949a40a9" ]; then
                    if [ "${RETAIN_DATA_TABLES}" = "auto" ]; then export RETAIN_DATA_TABLES=false; fi
                    export AWS_REGION="${AWS_DEFAULT_REGION}"
                    export AWS_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
                    ENV_DIR="infrastructure/environments/${ENVIRONMENT}"
                    mkdir -p "${ENV_DIR}"
                    {
                      echo "TENANT_ADMIN_EMAIL=${TENANT_ADMIN_EMAIL}"
                      echo "AWS_ACCOUNT_ID=${AWS_ACCOUNT_ID}"
                      echo "AWS_REGION=${AWS_REGION}"
                      if [ -n "${DEPLOY_EXTERNAL_ID}" ]; then
                        echo "CDK_PARAM_DEPLOY_EXTERNAL_ID=${DEPLOY_EXTERNAL_ID}"
                      fi
                      # Zero-cost Turso backend (docs/running-costs.md). Only emit the
                      # CDK_PARAM_* when a non-DynamoDB backend is chosen; env-check-lite
                      # then enforces that the URL + token-parameter-name are both set.
                      if [ "${CONTROL_DATA_BACKEND}" != "dynamodb" ]; then
                        echo "CDK_PARAM_CONTROL_DATA_BACKEND=${CONTROL_DATA_BACKEND}"
                        echo "CDK_PARAM_TURSO_DATABASE_URL=${TURSO_DATABASE_URL}"
                        echo "CDK_PARAM_TURSO_AUTH_TOKEN_PARAMETER_NAME=${TURSO_AUTH_TOKEN_PARAMETER_NAME}"
                      fi
                      # DynamoDB capacity knob (#2679). Emitted unconditionally: with the
                      # default (1/1) it resolves to the same synth as before, and a turso
                      # backend synthesizes zero DynamoDB tables so the value is ignored.
                      echo "CDK_PARAM_DYNAMODB_READ_CAPACITY=${DYNAMO_READ_CAPACITY}"
                      echo "CDK_PARAM_DYNAMODB_WRITE_CAPACITY=${DYNAMO_WRITE_CAPACITY}"
                      # Retention knob (#2959). Default "false" -> tables carry DeletionPolicy:
                      # Delete, so ACTION=destroy leaves nothing billing behind.
                      echo "CDK_PARAM_RETAIN_DATA_TABLES=${RETAIN_DATA_TABLES}"
                    } > "${ENV_DIR}/.env"
                    echo "Wrote ${ENV_DIR}/.env (TENANT_ADMIN_EMAIL / AWS_ACCOUNT_ID / AWS_REGION)"
                    # Bootstrap is only needed to deploy (idempotent); skip it for both teardown modes.
                    if [ "${ACTION}" = "deploy" ]; then
                      ./node_modules/aws-cdk/bin/cdk bootstrap "aws://${AWS_ACCOUNT_ID}/${AWS_REGION}"
                    fi
                  else
                    echo "Unsupported source contract"; exit 2
                  fi
            build:
              commands:
                - cd "${CODEBUILD_SRC_DIR}/repo"
                - |
                  if [ "${SOURCE_CONTRACT}" = "current-cloud-v1" ]; then
                    if [ "${ACTION}" = "deploy" ]; then
                      # Starting this reviewed build approves missing standard bootstrap and app IAM changes.
                      make deploy ENV="${ENVIRONMENT}" CLOUD_ARGS="--setup-if-needed --yes" || exit $?
                    elif [ "${ACTION}" = "destroy" ]; then
                      make destroy ENV="${ENVIRONMENT}" CLOUD_ARGS="--yes" || exit $?
                    else
                      echo "Current hosting supports deploy/destroy; retained data is not purged."; exit 2
                    fi
                  elif [ "${SOURCE_CONTRACT}" = "historical-949a40a9" ]; then
                    if [ "${ACTION}" = "destroy-all" ]; then
                      echo "ACTION=destroy-all -> removing stack-owned data, logs, and Lite stacks"
                      # TENKACLOUD_LITE_DOWN_YES bypasses the interactive confirm in this non-TTY build.
                      if ! TENKACLOUD_LITE_DOWN_YES=1 make destroy-all ENV="${ENVIRONMENT}"; then
                        echo "Lite complete teardown failed; cleanup checkpoint will not be emitted."
                        exit 1
                      fi
                      # Public onboarding checkpoint: complete teardown only, never preserve mode.
                      echo "Cleanup checkpoint: TC{LITE-CLEANUP-COMPLETE}"
                    elif [ "${ACTION}" = "destroy" ]; then
                      echo "ACTION=destroy -> removing Lite stacks (DynamoDB tables go with them unless RetainDataTables=true was set at deploy time)"
                      if ! TENKACLOUD_LITE_DOWN_YES=1 make destroy ENV="${ENVIRONMENT}"; then
                        echo "Lite teardown failed."
                        exit 1
                      fi
                      echo "No complete-cleanup checkpoint is emitted for ACTION=destroy. If this stack was deployed with RetainDataTables=true, the tables are still there and still billing."
                    elif [ "${ACTION}" = "deploy" ]; then
                      # `make deploy` builds the SPAs (ships the cloned catalog) then runs the Lite deploy.
                      make deploy ENV="${ENVIRONMENT}"
                    else
                      echo "Unsupported ACTION: ${ACTION}"
                      exit 2
                    fi
                  else
                    echo "Unsupported source contract"; exit 2
                  fi
            post_build:
              commands:
                - |
                  if [ "${CODEBUILD_BUILD_SUCCEEDING}" != "1" ]; then
                    echo "Build failed; no deployment or cleanup success is claimed."; exit 1
                  fi
                  if [ "${ACTION}" = "destroy" ] || [ "${ACTION}" = "destroy-all" ]; then
                    echo "Teardown finished. Finally, delete the launcher stack you created from this"
                    echo "template to remove the CodeBuild project, its role, and its log group."
                  elif [ "${ACTION}" = "deploy" ]; then
                    echo "Deploy finished. The Admin Console + Participant Portal URLs are in the"
                    echo "CloudFormation Outputs of the selected implementation (current: tenkacloud-cloud / tenkacloud-cloud-problem-deploy, with environment suffix outside development)."
                  else
                    echo "No supported launcher action completed."
                  fi
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref LauncherLogGroup
      TimeoutInMinutes: !Ref CodeBuildTimeoutMinutes

  # =====================================
  # IAM role for the deploy build
  # =====================================
  # Preserve the former launcher caller policy for both source contracts.
  # This is privileged bootstrap/deployment authority, including IAM, and persists
  # after setup. Review all actions and who may create/update/start this build.
  # Current CDK deployment uses standard bootstrap roles; no custom managed policy
  # is installed or attached. Historical deployment/cleanup permissions are unchanged.
  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub tenkacloud-lite-${Environment}-codebuild-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Preserved caller authority for cdk bootstrap, deploy and direct CLI operations.
              # This is intentionally broad and is not a least-privilege policy.
              - Sid: DeployServices
                Effect: Allow
                Action:
                  - cloudformation:*
                  - iam:*
                  - lambda:*
                  - apigateway:*
                  - cognito-idp:*
                  - cognito-identity:*
                  - dynamodb:*
                  - s3:*
                  - cloudfront:*
                  - states:*
                  - events:*
                  - sns:*
                  - sqs:*
                  - ecr:*
                  - codebuild:*
                  - logs:*
                Resource: "*"
              # Cost-zero principle: secrets live in SSM Parameter Store, not Secrets Manager.
              - Sid: SsmParameters
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                  - ssm:PutParameter
                  - ssm:DeleteParameter
                  - ssm:AddTagsToResource
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/TenkaCloud/*
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cdk-bootstrap/*
              - Sid: KmsForBootstrapAndAssets
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: "*"
              # cdk deploy assumes the bootstrap roles to publish assets / run the change set.
              - Sid: AssumeCdkRoles
                Effect: Allow
                Action:
                  - sts:AssumeRole
                Resource:
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/cdk-*
              - Sid: Identity
                Effect: Allow
                Action:
                  - sts:GetCallerIdentity
                Resource: "*"

Outputs:
  ReleaseManifestVersion:
    Description: >-
      Compatibility manifest version for the historical source pair only. The current
      source contract is an unreleased candidate; consult ReleaseClassification.
    Value: 1.11.0

  ReleaseClassification:
    Description: Saved source classification; build logs also classify one-build overrides.
    Value: !If
      - UsesAnyMainRef
      - development/unreleased
      - !If [HasAnyOverride, custom/unverified, !FindInMap [SourceDefaults, !Ref SourceContract, Classification]]

  CodeBuildProjectName:
    Description: CodeBuild project name. Review privileged role and source refs before "Start build".
    Value: !Ref CodeBuildProject

  StartBuildConsoleUrl:
    Description: >-
      After reviewing the broad role and source refs, "Start build" approves deploy and
      missing standard bootstrap (default AdministratorAccess execution). "Start build with overrides" with
      ACTION=destroy coordinates current event cleanup and retains data. destroy-all
      is available only for the explicitly selected historical source contract.
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/codesuite/codebuild/projects/tenkacloud-lite-${Environment}?region=${AWS::Region}

  # Issue #2696: onboarding drill checkpoint 1 ("launcher created"). Deliberately a fixed,
  # public code -- it proves the learner reached this Outputs tab, not cryptographic
  # possession. The paired submission UI is the "Deploy your own TenkaCloud Lite" drill in
  # the landing demo portal; keep the value in sync with the lite-drill contract in
  # packages/portal-contracts (pinned by infrastructure/test/scripts/lite-pipeline-drill.test.ts).
  OnboardingDrillCheckpoint:
    Description: >-
      Onboarding drill checkpoint 1. Paste this code into the "Deploy your own TenkaCloud
      cloud hosting" drill in the landing demo portal to score the "launcher created" step.
    Value: TC{LITE-LAUNCHER-READY}
