AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  TenkaCloud Lite mode one-click deployment. Provisions a single CodeBuild project
  that git-clones the (public) TenkaCloud repo + a problem-catalog repo and runs
  `make deploy` (Lite mode) to stand up TenkaCloud in this AWS account. It does NOT
  create the TenkaCloud stacks itself; the build step does.


  Cost note: build minutes for a handful of Lite deploys cost under a dollar.
  Separately, while deployed, the default DynamoDB profile is a standing cost of
  about $7.06 per month. `destroy` removes those tables by default; `destroy-all`
  also removes explicitly retained tables and logs (see docs/running-costs.md).


  IAM note: creating this stack also creates a CodeBuild role with broad,
  administrator-equivalent permissions so the build can deploy every TenkaCloud
  stack; this is why the console asks you to acknowledge IAM capabilities below.

# Single-file ("perapeti") template launched from the console. Because TenkaCloud is a
# PUBLIC OSS repo, CodeBuild git-clones it directly -- there is NO GitHub
# CodeStar/CodeConnections connection to set up, and no CodePipeline. After the stack is
# created, press "Start build" on the CodeBuild project (see the Outputs link) to deploy.
#
# The problem catalog is chosen by parameter (ProblemsRepoUrl), not bonded as a git
# submodule -- so a third party can deploy with their OWN catalog (fork TenkaCloudChallenge,
# author with its scripts/new-problem.ts, then pass ProblemsRepoUrl=<their fork>).
#
# Teardown: "Start build with overrides" + ACTION=destroy-all removes stack-owned retained
# data and the two app stacks, then delete the launcher stack created from this template.
# ACTION=destroy removes the stacks; DynamoDB tables go with them unless the deploy set
# RetainDataTables=true (#2959). The deploy itself creates the platform (Lambda +
# Cognito + DynamoDB + S3 + CloudFront + ...); a handful of Lite deploys cost under a dollar.
#
# IAM Role / Policy "Description" fields only accept ASCII (0x20-0x7E) + Latin-1 (0xA1-0xFF);
# CJK causes CREATE_FAILED. All comments in this file are ASCII so the quality-gates
# template-ascii check (walks infrastructure/templates/) passes.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Required (only field you need to fill in)"
        Parameters:
          - TenantAdminEmail
      - Label:
          default: "Advanced: repository sources and release classification"
        Parameters:
          - RepoUrl
          - RepoRef
          - ProblemsRepoUrl
          - ProblemsRepoRef
      - Label:
          default: "Advanced: control-data backend (safe to leave alone)"
        Parameters:
          - ControlDataBackend
          - TursoDatabaseUrl
          - TursoAuthTokenParameterName
      - Label:
          default: "Advanced: capacity and build tuning (safe to leave alone)"
        Parameters:
          - Environment
          - Action
          - DeployExternalId
          - DynamoReadCapacity
          - DynamoWriteCapacity
          - RetainDataTables
          - BunVersion
          - CodeBuildTimeoutMinutes
    ParameterLabels:
      TenantAdminEmail:
        default: "Tenant Admin email (receives the Cognito invite after deploy)"

Parameters:
  Environment:
    Type: String
    Default: development
    AllowedValues:
      - development
      - staging
      - production
    Description: >-
      Target environment. Selects infrastructure/environments/{env}/config.json
      and writes infrastructure/environments/{env}/.env during the build.

  Action:
    Type: String
    Default: deploy
    AllowedValues:
      - deploy
      - destroy
      - destroy-all
    Description: >-
      What this build does. `deploy` stands up Lite; `destroy` removes the stacks;
      `destroy-all` additionally removes stack-owned retained data first. The cleanup
      tutorial uses ACTION=destroy-all. Note that `destroy` no longer preserves DynamoDB
      history by default (#2959): tables are deployed with DeletionPolicy: Delete unless
      the deploy set RetainDataTables=true, so they go away with the stacks. That default
      exists because retained tables keep billing and nothing cleans them up.

  TenantAdminEmail:
    Type: String
    Description: >-
      Application Admin Console initial user (Tenant Admin). After the Lite deploy,
      tenkacloud-lite.ts creates this Cognito user and emails an invitation.
    AllowedPattern: ^[^\s@]+@[^\s@]+\.[^\s@]+$
    ConstraintDescription: Must be a valid email address.

  RepoUrl:
    Type: String
    Default: https://github.com/susumutomita/TenkaCloud.git
    Description: >-
      Public git URL of the TenkaCloud platform repo to deploy. Override only when
      deploying a fork.

  RepoRef:
    Type: String
    Default: 56a318e72f8ff9a37ce981860f68a0834bd3c229
    Description: >-
      Full 40-hex commit SHA, branch, or tag of the platform repo to deploy. The exact
      default platform/catalog pair is candidate/unverified; selecting main in either
      ref is development/unreleased; every other combination is custom/unverified.

  ProblemsRepoUrl:
    Type: String
    Default: https://github.com/susumutomita/TenkaCloudChallenge.git
    Description: >-
      Public git URL of the problem-catalog repo to ship (cloned into problems/).
      Point this at your own fork to deploy your own internal problems.

  ProblemsRepoRef:
    Type: String
    Default: 7a6ff45d928d4ac14b97b732c0e9069317c3130a
    Description: >-
      Full 40-hex commit SHA, branch, or tag of the problem-catalog repo to ship. The
      exact default platform/catalog pair is candidate/unverified; selecting main in
      either ref is development/unreleased; every other combination is custom/unverified.

  DeployExternalId:
    Type: String
    Default: ""
    NoEcho: true
    AllowedPattern: '^$|^[A-Za-z0-9_=,.@:/-]{16,128}$'
    ConstraintDescription: >-
      Leave empty for a same-account Lite trial, or enter 16-128 ASCII letters,
      digits, and _ = , . @ : / -.
    Description: >-
      Optional CDK_PARAM_DEPLOY_EXTERNAL_ID for AssumeRole into competitor accounts
      (problem deploy backend). Leave empty for a local-only Lite trial.

  ControlDataBackend:
    Type: String
    Default: dynamodb
    AllowedValues:
      - dynamodb
      - turso
    Description: >-
      Control-plane data backend (CDK_PARAM_CONTROL_DATA_BACKEND). `dynamodb` (default)
      keeps every table on DynamoDB. `turso` is the pure-SQL zero-cost backend -
      CDK synthesizes ZERO DynamoDB tables - and requires TursoDatabaseUrl +
      TursoAuthTokenParameterName. See docs/running-costs.md.

  TursoDatabaseUrl:
    Type: String
    Default: ""
    Description: >-
      Turso libsql:// database URL (from `turso db show <db> --url`). Required when
      ControlDataBackend is turso; leave empty for dynamodb.

  TursoAuthTokenParameterName:
    Type: String
    Default: ""
    Description: >-
      SSM Parameter Store name (SecureString) holding the Turso auth token - create it
      first, e.g. `aws ssm put-parameter --name /TenkaCloud/development/turso/auth-token
      --type SecureString --value <token>`. Required for a non-dynamodb backend. The
      deploy Lambda reads it at runtime; CodeBuild only forwards the name.

  DynamoReadCapacity:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 200
    Description: >-
      Provisioned read capacity units applied to every DynamoDB table AND every GSI
      (CDK_PARAM_DYNAMODB_READ_CAPACITY, fanned out by the DynamoDbLowCapacity aspect).
      Default 1 keeps the standing cost at the practical minimum for a personal trial;
      raise it for an event with real load - 1 RCU throttles quickly. Raising it raises
      the hourly DynamoDB charge; the 200 ceiling matches the event-capacity runbook's
      billing guard (docs/operations/dynamodb-event-capacity.md) so a digit typo cannot
      provision thousands of units. Ignored when ControlDataBackend is turso (zero
      DynamoDB tables are synthesized there).

  DynamoWriteCapacity:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 200
    Description: >-
      Provisioned write capacity units applied to every DynamoDB table AND every GSI
      (CDK_PARAM_DYNAMODB_WRITE_CAPACITY). Same default/cost/ceiling/behavior notes as
      DynamoReadCapacity, including being ignored when ControlDataBackend is turso.

  RetainDataTables:
    Type: String
    Default: "false"
    AllowedValues:
      - "false"
      - "true"
    Description: >-
      Whether DynamoDB tables survive stack deletion (CDK_PARAM_RETAIN_DATA_TABLES).
      Default false, so ACTION=destroy removes them along with the stacks. Set true only
      if you want the history kept: retained tables keep billing at their provisioned
      capacity forever, and nothing deletes them for you - you have to run
      `aws dynamodb delete-table` by hand. This is read at DEPLOY time and baked into the
      stack template, so flipping it later has no effect on a stack that is already
      deployed; re-deploy first, then destroy.

  BunVersion:
    Type: String
    Default: 1.3.11
    Description: Bun version installed in the build (matches the repo toolchain).

  CodeBuildTimeoutMinutes:
    Type: Number
    Default: 90
    MinValue: 15
    MaxValue: 480
    Description: CodeBuild timeout in minutes (a Lite deploy usually finishes in 15-30).

Conditions:
  HasExternalId: !Not [!Equals [!Ref DeployExternalId, ""]]
  # CloudFormation cannot import the repository manifest at runtime. These deployable-artifact
  # literals are consumers, not a second source of truth: the launcher regression test reads
  # release/tenkacloud-release.json and gates defaults, conditions, build log, and Outputs together.
  UsesAnyMainRef: !Or
    - !Equals [!Ref RepoRef, main]
    - !Equals [!Ref ProblemsRepoRef, main]
  UsesCandidateReleasePair: !And
    - !Equals [!Ref RepoRef, 56a318e72f8ff9a37ce981860f68a0834bd3c229]
    - !Equals [!Ref ProblemsRepoRef, 7a6ff45d928d4ac14b97b732c0e9069317c3130a]

Resources:
  LauncherLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      # Distinct from CodeBuild's legacy default `/aws/codebuild/<project>` so an existing
      # launcher can update without "resource already exists"; destroy-all removes that legacy group.
      LogGroupName: !Sub /tenkacloud/codebuild/lite-launcher-${Environment}
      RetentionInDays: 1

  # =====================================
  # CodeBuild project: clones the repos, installs bun, builds the SPAs, bootstraps CDK,
  # runs `make deploy`. NO_SOURCE -> the buildspec fetches its own source via git clone.
  # =====================================
  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub tenkacloud-lite-${Environment}
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        Image: aws/codebuild/amazonlinux-x86_64-standard:5.0
        ComputeType: BUILD_GENERAL1_MEDIUM
        # CDK asset bundling can fall back to Docker; PrivilegedMode keeps it reliable.
        PrivilegedMode: true
        ImagePullCredentialsType: CODEBUILD
        EnvironmentVariables:
          - Name: ENVIRONMENT
            Value: !Ref Environment
            Type: PLAINTEXT
          - Name: ACTION
            Value: !Ref Action
            Type: PLAINTEXT
          - Name: TENANT_ADMIN_EMAIL
            Value: !Ref TenantAdminEmail
            Type: PLAINTEXT
          - Name: REPO_URL
            Value: !Ref RepoUrl
            Type: PLAINTEXT
          - Name: REPO_REF
            Value: !Ref RepoRef
            Type: PLAINTEXT
          - Name: PROBLEMS_REPO_URL
            Value: !Ref ProblemsRepoUrl
            Type: PLAINTEXT
          - Name: PROBLEMS_REPO_REF
            Value: !Ref ProblemsRepoRef
            Type: PLAINTEXT
          - Name: DEPLOY_EXTERNAL_ID
            Value: !If [HasExternalId, !Ref DeployExternalId, ""]
            Type: PLAINTEXT
          - Name: CONTROL_DATA_BACKEND
            Value: !Ref ControlDataBackend
            Type: PLAINTEXT
          - Name: TURSO_DATABASE_URL
            Value: !Ref TursoDatabaseUrl
            Type: PLAINTEXT
          - Name: TURSO_AUTH_TOKEN_PARAMETER_NAME
            Value: !Ref TursoAuthTokenParameterName
            Type: PLAINTEXT
          - Name: DYNAMO_READ_CAPACITY
            Value: !Ref DynamoReadCapacity
            Type: PLAINTEXT
          - Name: DYNAMO_WRITE_CAPACITY
            Value: !Ref DynamoWriteCapacity
            Type: PLAINTEXT
          - Name: RETAIN_DATA_TABLES
            Value: !Ref RetainDataTables
            Type: PLAINTEXT
          - Name: BUN_VERSION
            Value: !Ref BunVersion
            Type: PLAINTEXT
          - Name: JSII_DEPRECATED
            Value: quiet
            Type: PLAINTEXT
          - Name: TENKACLOUD_LITE_MANAGED_LAUNCHER_LOG_GROUP
            Value: "1"
            Type: PLAINTEXT
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            install:
              # Node 22 is the newest version the managed CodeBuild standard image ships;
              # node 24 is not yet a managed runtime (aws/aws-codebuild-docker-images#795).
              # bun drives the toolchain and Node only backs the CDK CLI shebang + esbuild.
              runtime-versions:
                nodejs: 22
              commands:
                - |
                  echo "Release manifest version: 1.1.0-candidate.20260810 (baseline for the exact candidate ref pair)"
                  if [ "${REPO_REF}" = "main" ] || [ "${PROBLEMS_REPO_REF}" = "main" ]; then
                    release_classification="development/unreleased"
                  elif [ "${REPO_REF}" = "56a318e72f8ff9a37ce981860f68a0834bd3c229" ] && [ "${PROBLEMS_REPO_REF}" = "7a6ff45d928d4ac14b97b732c0e9069317c3130a" ]; then
                    release_classification="candidate/unverified"
                  else
                    release_classification="custom/unverified"
                  fi
                  echo "Release classification: ${release_classification}"

                  checkout_repo_ref() {
                    checkout_repo_url="$1"
                    checkout_requested_ref="$2"
                    checkout_destination="$3"
                    checkout_label="$4"

                    if printf '%s' "${checkout_requested_ref}" | grep -Eq '^[0-9a-fA-F]{40}$'; then
                      echo "Fetching ${checkout_label} ${checkout_repo_url} @ immutable commit ${checkout_requested_ref}"
                      if ! git init --quiet "${checkout_destination}"; then
                        echo "Failed to initialize ${checkout_label} checkout."
                        return 1
                      fi
                      if ! git -C "${checkout_destination}" remote add origin "${checkout_repo_url}"; then
                        echo "Failed to configure ${checkout_label} origin."
                        return 1
                      fi
                      if ! git -C "${checkout_destination}" fetch --depth 1 origin "${checkout_requested_ref}"; then
                        echo "Failed to fetch ${checkout_label} commit ${checkout_requested_ref}; refusing to fall back to another ref."
                        return 1
                      fi
                      if ! checkout_resolved_ref="$(git -C "${checkout_destination}" rev-parse --verify 'FETCH_HEAD^{commit}')"; then
                        echo "Fetched ${checkout_label} ref did not resolve to a commit."
                        return 1
                      fi
                      checkout_normalized_ref="$(printf '%s' "${checkout_requested_ref}" | tr '[:upper:]' '[:lower:]')"
                      if [ "${checkout_resolved_ref}" != "${checkout_normalized_ref}" ]; then
                        echo "Resolved ${checkout_label} commit ${checkout_resolved_ref} does not match requested ${checkout_normalized_ref}."
                        return 1
                      fi
                      if ! git -C "${checkout_destination}" checkout --quiet --detach "${checkout_resolved_ref}"; then
                        echo "Failed to check out ${checkout_label} commit ${checkout_resolved_ref}."
                        return 1
                      fi
                    else
                      echo "Cloning ${checkout_label} ${checkout_repo_url} @ ${checkout_requested_ref}"
                      if ! git clone --depth 1 --branch "${checkout_requested_ref}" "${checkout_repo_url}" "${checkout_destination}"; then
                        echo "Failed to clone ${checkout_label} ref ${checkout_requested_ref}; no fallback ref will be used."
                        return 1
                      fi
                    fi
                  }

                  # Public OSS repositories: no auth / GitHub connection. A full commit SHA
                  # uses fetch + detached checkout because `git clone --branch <sha>` fails.
                  checkout_repo_ref "${REPO_URL}" "${REPO_REF}" repo platform || exit 1
                  # Replace the platform's catalog submodule with the independently selected
                  # problem catalog so third parties can ship their own repository.
                  rm -rf repo/problems
                  checkout_repo_ref "${PROBLEMS_REPO_URL}" "${PROBLEMS_REPO_REF}" repo/problems catalog || exit 1
                - cd repo
                - echo "Installing bun ${BUN_VERSION}"
                - npm install -g "bun@${BUN_VERSION}"
                - bun --version
                # Frozen + ignore-scripts matches the repo supply-chain policy (make install_ci).
                - bun install --frozen-lockfile --ignore-scripts
            pre_build:
              commands:
                - cd "${CODEBUILD_SRC_DIR}/repo"
                - export AWS_REGION="${AWS_DEFAULT_REGION}"
                - export AWS_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
                - ENV_DIR="infrastructure/environments/${ENVIRONMENT}"
                - mkdir -p "${ENV_DIR}"
                - |
                  {
                    echo "TENANT_ADMIN_EMAIL=${TENANT_ADMIN_EMAIL}"
                    echo "AWS_ACCOUNT_ID=${AWS_ACCOUNT_ID}"
                    echo "AWS_REGION=${AWS_REGION}"
                    if [ -n "${DEPLOY_EXTERNAL_ID}" ]; then
                      echo "CDK_PARAM_DEPLOY_EXTERNAL_ID=${DEPLOY_EXTERNAL_ID}"
                    fi
                    # Zero-cost Turso backend (docs/running-costs.md). Only emit the
                    # CDK_PARAM_* when a non-DynamoDB backend is chosen; env-check-lite
                    # then enforces that the URL + token-parameter-name are both set.
                    if [ "${CONTROL_DATA_BACKEND}" != "dynamodb" ]; then
                      echo "CDK_PARAM_CONTROL_DATA_BACKEND=${CONTROL_DATA_BACKEND}"
                      echo "CDK_PARAM_TURSO_DATABASE_URL=${TURSO_DATABASE_URL}"
                      echo "CDK_PARAM_TURSO_AUTH_TOKEN_PARAMETER_NAME=${TURSO_AUTH_TOKEN_PARAMETER_NAME}"
                    fi
                    # DynamoDB capacity knob (#2679). Emitted unconditionally: with the
                    # default (1/1) it resolves to the same synth as before, and a turso
                    # backend synthesizes zero DynamoDB tables so the value is ignored.
                    echo "CDK_PARAM_DYNAMODB_READ_CAPACITY=${DYNAMO_READ_CAPACITY}"
                    echo "CDK_PARAM_DYNAMODB_WRITE_CAPACITY=${DYNAMO_WRITE_CAPACITY}"
                    # Retention knob (#2959). Default "false" -> tables carry DeletionPolicy:
                    # Delete, so ACTION=destroy leaves nothing billing behind.
                    echo "CDK_PARAM_RETAIN_DATA_TABLES=${RETAIN_DATA_TABLES}"
                  } > "${ENV_DIR}/.env"
                - echo "Wrote ${ENV_DIR}/.env (TENANT_ADMIN_EMAIL / AWS_ACCOUNT_ID / AWS_REGION)"
                # Bootstrap is only needed to deploy (idempotent); skip it for both teardown modes.
                - |
                  if [ "${ACTION}" = "deploy" ]; then
                    ./node_modules/aws-cdk/bin/cdk bootstrap "aws://${AWS_ACCOUNT_ID}/${AWS_REGION}"
                  fi
            build:
              commands:
                - cd "${CODEBUILD_SRC_DIR}/repo"
                - |
                  if [ "${ACTION}" = "destroy-all" ]; then
                    echo "ACTION=destroy-all -> removing stack-owned data, logs, and Lite stacks"
                    # TENKACLOUD_LITE_DOWN_YES bypasses the interactive confirm in this non-TTY build.
                    if ! TENKACLOUD_LITE_DOWN_YES=1 make destroy-all ENV="${ENVIRONMENT}"; then
                      echo "Lite complete teardown failed; cleanup checkpoint will not be emitted."
                      exit 1
                    fi
                    # Public onboarding checkpoint: complete teardown only, never preserve mode.
                    echo "Cleanup checkpoint: TC{LITE-CLEANUP-COMPLETE}"
                  elif [ "${ACTION}" = "destroy" ]; then
                    echo "ACTION=destroy -> removing Lite stacks (DynamoDB tables go with them unless RetainDataTables=true was set at deploy time)"
                    if ! TENKACLOUD_LITE_DOWN_YES=1 make destroy ENV="${ENVIRONMENT}"; then
                      echo "Lite teardown failed."
                      exit 1
                    fi
                    echo "No complete-cleanup checkpoint is emitted for ACTION=destroy. If this stack was deployed with RetainDataTables=true, the tables are still there and still billing."
                  elif [ "${ACTION}" = "deploy" ]; then
                    # `make deploy` builds the SPAs (ships the cloned catalog) then runs the Lite deploy.
                    make deploy ENV="${ENVIRONMENT}"
                  else
                    echo "Unsupported ACTION: ${ACTION}"
                    exit 2
                  fi
            post_build:
              commands:
                - |
                  if [ "${ACTION}" = "destroy" ] || [ "${ACTION}" = "destroy-all" ]; then
                    echo "Teardown finished. Finally, delete the launcher stack you created from this"
                    echo "template to remove the CodeBuild project, its role, and its log group."
                  elif [ "${ACTION}" = "deploy" ]; then
                    echo "Deploy finished. The Admin Console + Participant Portal URLs are in the"
                    echo "CloudFormation Outputs of the tenkacloud-lite / tenkacloud-lite-problem-deploy stacks."
                  else
                    echo "No supported launcher action completed."
                  fi
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref LauncherLogGroup
      TimeoutInMinutes: !Ref CodeBuildTimeoutMinutes

  # =====================================
  # IAM role for the deploy build
  # =====================================
  # `make deploy` (Lite) drives `cdk deploy`, which stands up the whole platform (Lambda +
  # Cognito + DynamoDB + S3 + CloudFront + API Gateway + Step Functions + EventBridge + the
  # in-app CodeBuild for problem deploy + SSM). cdk also bootstraps and assumes the cdk-*
  # execution roles, so the role needs broad service access. This is the deploy operator,
  # distinct from competitor-bootstrap.yaml which stays least-privilege.
  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub tenkacloud-lite-${Environment}-codebuild-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Services that `cdk deploy` (Lite) and `cdk bootstrap` create/manage.
              - Sid: DeployServices
                Effect: Allow
                Action:
                  - cloudformation:*
                  - iam:*
                  - lambda:*
                  - apigateway:*
                  - cognito-idp:*
                  - cognito-identity:*
                  - dynamodb:*
                  - s3:*
                  - cloudfront:*
                  - states:*
                  - events:*
                  - sns:*
                  - sqs:*
                  - ecr:*
                  - codebuild:*
                  - logs:*
                Resource: "*"
              # Cost-zero principle: secrets live in SSM Parameter Store, not Secrets Manager.
              - Sid: SsmParameters
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                  - ssm:PutParameter
                  - ssm:DeleteParameter
                  - ssm:AddTagsToResource
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/TenkaCloud/*
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cdk-bootstrap/*
              - Sid: KmsForBootstrapAndAssets
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: "*"
              # cdk deploy assumes the bootstrap roles to publish assets / run the change set.
              - Sid: AssumeCdkRoles
                Effect: Allow
                Action:
                  - sts:AssumeRole
                Resource:
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/cdk-*
              - Sid: Identity
                Effect: Allow
                Action:
                  - sts:GetCallerIdentity
                Resource: "*"

Outputs:
  ReleaseManifestVersion:
    Description: >-
      Baseline manifest version for the exact default ref pair. main or custom overrides are
      classified separately and are not represented by this manifest version.
    Value: 1.1.0-candidate.20260810

  ReleaseClassification:
    Description: >-
      Classification of the ref parameters saved on this launcher stack. candidate/unverified is
      the default pair; development/unreleased means at least one saved ref is main; custom/unverified
      means another pair is saved. A one-build CodeBuild override is classified in that build's log.
    Value: !If
      - UsesAnyMainRef
      - development/unreleased
      - !If [UsesCandidateReleasePair, candidate/unverified, custom/unverified]

  CodeBuildProjectName:
    Description: CodeBuild project name. Press "Start build" to deploy.
    Value: !Ref CodeBuildProject

  StartBuildConsoleUrl:
    Description: >-
      Open the CodeBuild project: "Start build" deploys; "Start build with overrides" with
      ACTION=destroy-all completely removes Lite; ACTION=destroy removes the stacks, taking
      the DynamoDB tables with them unless the deploy set RetainDataTables=true.
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/codesuite/codebuild/projects/tenkacloud-lite-${Environment}?region=${AWS::Region}

  # Issue #2696: onboarding drill checkpoint 1 ("launcher created"). Deliberately a fixed,
  # public code -- it proves the learner reached this Outputs tab, not cryptographic
  # possession. The paired submission UI is the "Deploy your own TenkaCloud Lite" drill in
  # the landing demo portal; keep the value in sync with the lite-drill contract in
  # packages/portal-contracts (pinned by infrastructure/test/scripts/lite-pipeline-drill.test.ts).
  OnboardingDrillCheckpoint:
    Description: >-
      Onboarding drill checkpoint 1. Paste this code into the "Deploy your own TenkaCloud
      Lite" drill in the landing demo portal to score the "launcher created" step.
    Value: TC{LITE-LAUNCHER-READY}
