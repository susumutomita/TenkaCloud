AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  TenkaCloud Lite mode one-click deployment. Provisions a single CodeBuild project
  that git-clones the (public) TenkaCloud repo + a problem-catalog repo and runs
  `make deploy` (Lite mode) to stand up TenkaCloud in this AWS account. It does NOT
  create the TenkaCloud stacks itself; the build step does.

# Single-file ("perapeti") template launched from the console. Because TenkaCloud is a
# PUBLIC OSS repo, CodeBuild git-clones it directly -- there is NO GitHub
# CodeStar/CodeConnections connection to set up, and no CodePipeline. After the stack is
# created, press "Start build" on the CodeBuild project (see the Outputs link) to deploy.
#
# The problem catalog is chosen by parameter (ProblemsRepoUrl), not bonded as a git
# submodule -- so a third party can deploy with their OWN catalog (fork TenkaCloudChallenge,
# author with its scripts/new-problem.ts, then pass ProblemsRepoUrl=<their fork>).
#
# Teardown: "Start build with overrides" + ACTION=destroy runs `make destroy` (which deletes
# the two app stacks in the correct cross-stack order), then delete the launcher stack created
# from this template. The deploy itself creates the platform (Lambda + Cognito + DynamoDB +
# S3 + CloudFront + ...); a handful of Lite deploys cost under a dollar.
#
# IAM Role / Policy "Description" fields only accept ASCII (0x20-0x7E) + Latin-1 (0xA1-0xFF);
# CJK causes CREATE_FAILED. All comments in this file are ASCII so the quality-gates
# template-ascii check (walks infrastructure/templates/) passes.

Parameters:
  Environment:
    Type: String
    Default: development
    AllowedValues:
      - development
      - staging
      - production
    Description: >-
      Target environment. Selects infrastructure/environments/{env}/config.json
      and writes infrastructure/environments/{env}/.env during the build.

  Action:
    Type: String
    Default: deploy
    AllowedValues:
      - deploy
      - destroy
    Description: >-
      What this build does. `deploy` stands up the Lite stacks; `destroy` tears them
      down in the correct cross-stack order. To tear down from the console, open the
      CodeBuild project and use "Start build with overrides" with ACTION=destroy.

  TenantAdminEmail:
    Type: String
    Description: >-
      Application Admin Console initial user (Tenant Admin). After the Lite deploy,
      tenkacloud-lite.ts creates this Cognito user and emails an invitation.
    AllowedPattern: ^[^\s@]+@[^\s@]+\.[^\s@]+$
    ConstraintDescription: Must be a valid email address.

  RepoUrl:
    Type: String
    Default: https://github.com/susumutomita/TenkaCloud.git
    Description: >-
      Public git URL of the TenkaCloud platform repo to deploy. Override only when
      deploying a fork.

  RepoRef:
    Type: String
    Default: main
    Description: Branch or tag of the platform repo to deploy.

  ProblemsRepoUrl:
    Type: String
    Default: https://github.com/susumutomita/TenkaCloudChallenge.git
    Description: >-
      Public git URL of the problem-catalog repo to ship (cloned into problems/).
      Point this at your own fork to deploy your own internal problems.

  ProblemsRepoRef:
    Type: String
    Default: main
    Description: Branch or tag of the problem-catalog repo to ship.

  DeployExternalId:
    Type: String
    Default: ""
    NoEcho: true
    Description: >-
      Optional CDK_PARAM_DEPLOY_EXTERNAL_ID for AssumeRole into competitor accounts
      (problem deploy backend). Leave empty for a local-only Lite trial.

  ControlDataBackend:
    Type: String
    Default: dynamodb
    AllowedValues:
      - dynamodb
      - turso
      - sql
      - turso-mirror
      - sql-mirror
    Description: >-
      Control-plane data backend (CDK_PARAM_CONTROL_DATA_BACKEND). `dynamodb` (default)
      keeps every table on DynamoDB. `turso`/`sql` is the pure-SQL zero-cost backend -
      CDK synthesizes ZERO DynamoDB tables - and requires TursoDatabaseUrl +
      TursoAuthTokenParameterName. `turso-mirror`/`sql-mirror` keeps DynamoDB canonical
      while mirroring writes into SQL (migration bridge). See docs/running-costs.md.

  TursoDatabaseUrl:
    Type: String
    Default: ""
    Description: >-
      Turso libsql:// database URL (from `turso db show <db> --url`). Required when
      ControlDataBackend is turso/sql/turso-mirror/sql-mirror; leave empty for dynamodb.

  TursoAuthTokenParameterName:
    Type: String
    Default: ""
    Description: >-
      SSM Parameter Store name (SecureString) holding the Turso auth token - create it
      first, e.g. `aws ssm put-parameter --name /TenkaCloud/development/turso/auth-token
      --type SecureString --value <token>`. Required for a non-dynamodb backend. The
      deploy Lambda reads it at runtime; CodeBuild only forwards the name.

  DynamoReadCapacity:
    Type: Number
    Default: 1
    MinValue: 1
    Description: >-
      Provisioned read capacity units applied to every DynamoDB table AND every GSI
      (CDK_PARAM_DYNAMODB_READ_CAPACITY, fanned out by the DynamoDbLowCapacity aspect).
      Default 1 keeps the standing cost at the practical minimum for a personal trial;
      raise it for an event with real load - 1 RCU throttles quickly. Raising it raises
      the hourly DynamoDB charge. Ignored when ControlDataBackend is turso/sql (zero
      DynamoDB tables are synthesized there).

  DynamoWriteCapacity:
    Type: Number
    Default: 1
    MinValue: 1
    Description: >-
      Provisioned write capacity units applied to every DynamoDB table AND every GSI
      (CDK_PARAM_DYNAMODB_WRITE_CAPACITY). Same default/cost/behavior notes as
      DynamoReadCapacity, including being ignored when ControlDataBackend is turso/sql.

  BunVersion:
    Type: String
    Default: 1.3.11
    Description: Bun version installed in the build (matches the repo toolchain).

  CodeBuildTimeoutMinutes:
    Type: Number
    Default: 90
    MinValue: 15
    MaxValue: 480
    Description: CodeBuild timeout in minutes (a Lite deploy usually finishes in 15-30).

Conditions:
  HasExternalId: !Not [!Equals [!Ref DeployExternalId, ""]]

Resources:
  # =====================================
  # CodeBuild project: clones the repos, installs bun, builds the SPAs, bootstraps CDK,
  # runs `make deploy`. NO_SOURCE -> the buildspec fetches its own source via git clone.
  # =====================================
  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub tenkacloud-lite-${Environment}
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        Image: aws/codebuild/amazonlinux-x86_64-standard:5.0
        ComputeType: BUILD_GENERAL1_MEDIUM
        # CDK asset bundling can fall back to Docker; PrivilegedMode keeps it reliable.
        PrivilegedMode: true
        ImagePullCredentialsType: CODEBUILD
        EnvironmentVariables:
          - Name: ENVIRONMENT
            Value: !Ref Environment
            Type: PLAINTEXT
          - Name: ACTION
            Value: !Ref Action
            Type: PLAINTEXT
          - Name: TENANT_ADMIN_EMAIL
            Value: !Ref TenantAdminEmail
            Type: PLAINTEXT
          - Name: REPO_URL
            Value: !Ref RepoUrl
            Type: PLAINTEXT
          - Name: REPO_REF
            Value: !Ref RepoRef
            Type: PLAINTEXT
          - Name: PROBLEMS_REPO_URL
            Value: !Ref ProblemsRepoUrl
            Type: PLAINTEXT
          - Name: PROBLEMS_REPO_REF
            Value: !Ref ProblemsRepoRef
            Type: PLAINTEXT
          - Name: DEPLOY_EXTERNAL_ID
            Value: !If [HasExternalId, !Ref DeployExternalId, ""]
            Type: PLAINTEXT
          - Name: CONTROL_DATA_BACKEND
            Value: !Ref ControlDataBackend
            Type: PLAINTEXT
          - Name: TURSO_DATABASE_URL
            Value: !Ref TursoDatabaseUrl
            Type: PLAINTEXT
          - Name: TURSO_AUTH_TOKEN_PARAMETER_NAME
            Value: !Ref TursoAuthTokenParameterName
            Type: PLAINTEXT
          - Name: DYNAMO_READ_CAPACITY
            Value: !Ref DynamoReadCapacity
            Type: PLAINTEXT
          - Name: DYNAMO_WRITE_CAPACITY
            Value: !Ref DynamoWriteCapacity
            Type: PLAINTEXT
          - Name: BUN_VERSION
            Value: !Ref BunVersion
            Type: PLAINTEXT
          - Name: JSII_DEPRECATED
            Value: quiet
            Type: PLAINTEXT
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            install:
              # Node 22 is the newest version the managed CodeBuild standard image ships;
              # node 24 is not yet a managed runtime (aws/aws-codebuild-docker-images#795).
              # bun drives the toolchain and Node only backs the CDK CLI shebang + esbuild.
              runtime-versions:
                nodejs: 22
              commands:
                # Public OSS repo -> plain git clone, no auth / no GitHub connection.
                - echo "Cloning ${REPO_URL} @ ${REPO_REF}"
                - git clone --depth 1 --branch "${REPO_REF}" "${REPO_URL}" repo
                # Problem catalog: clone the chosen catalog into problems/ (replaces the
                # git submodule, so any catalog repo can be shipped by parameter).
                - echo "Cloning catalog ${PROBLEMS_REPO_URL} @ ${PROBLEMS_REPO_REF} into problems/"
                - rm -rf repo/problems
                - git clone --depth 1 --branch "${PROBLEMS_REPO_REF}" "${PROBLEMS_REPO_URL}" repo/problems
                - cd repo
                - echo "Installing bun ${BUN_VERSION}"
                - npm install -g "bun@${BUN_VERSION}"
                - bun --version
                # Frozen + ignore-scripts matches the repo supply-chain policy (make install_ci).
                - bun install --frozen-lockfile --ignore-scripts
            pre_build:
              commands:
                - cd "${CODEBUILD_SRC_DIR}/repo"
                - export AWS_REGION="${AWS_DEFAULT_REGION}"
                - export AWS_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
                - ENV_DIR="infrastructure/environments/${ENVIRONMENT}"
                - mkdir -p "${ENV_DIR}"
                - |
                  {
                    echo "TENANT_ADMIN_EMAIL=${TENANT_ADMIN_EMAIL}"
                    echo "AWS_ACCOUNT_ID=${AWS_ACCOUNT_ID}"
                    echo "AWS_REGION=${AWS_REGION}"
                    if [ -n "${DEPLOY_EXTERNAL_ID}" ]; then
                      echo "CDK_PARAM_DEPLOY_EXTERNAL_ID=${DEPLOY_EXTERNAL_ID}"
                    fi
                    # Zero-cost Turso backend (docs/running-costs.md). Only emit the
                    # CDK_PARAM_* when a non-DynamoDB backend is chosen; env-check-lite
                    # then enforces that the URL + token-parameter-name are both set.
                    if [ "${CONTROL_DATA_BACKEND}" != "dynamodb" ]; then
                      echo "CDK_PARAM_CONTROL_DATA_BACKEND=${CONTROL_DATA_BACKEND}"
                      echo "CDK_PARAM_TURSO_DATABASE_URL=${TURSO_DATABASE_URL}"
                      echo "CDK_PARAM_TURSO_AUTH_TOKEN_PARAMETER_NAME=${TURSO_AUTH_TOKEN_PARAMETER_NAME}"
                    fi
                    # DynamoDB capacity knob (#2679). Emitted unconditionally: with the
                    # default (1/1) it resolves to the same synth as before, and a turso
                    # backend synthesizes zero DynamoDB tables so the value is ignored.
                    echo "CDK_PARAM_DYNAMODB_READ_CAPACITY=${DYNAMO_READ_CAPACITY}"
                    echo "CDK_PARAM_DYNAMODB_WRITE_CAPACITY=${DYNAMO_WRITE_CAPACITY}"
                  } > "${ENV_DIR}/.env"
                - echo "Wrote ${ENV_DIR}/.env (TENANT_ADMIN_EMAIL / AWS_ACCOUNT_ID / AWS_REGION)"
                # Bootstrap is only needed to deploy (idempotent); skip it when destroying.
                - |
                  if [ "${ACTION}" != "destroy" ]; then
                    ./node_modules/aws-cdk/bin/cdk bootstrap "aws://${AWS_ACCOUNT_ID}/${AWS_REGION}"
                  fi
            build:
              commands:
                - cd "${CODEBUILD_SRC_DIR}/repo"
                - |
                  if [ "${ACTION}" = "destroy" ]; then
                    echo "ACTION=destroy -> tearing down the Lite stacks in the correct order"
                    # TENKACLOUD_LITE_DOWN_YES bypasses the interactive confirm in this non-TTY build.
                    TENKACLOUD_LITE_DOWN_YES=1 make destroy ENV="${ENVIRONMENT}"
                  else
                    # `make deploy` builds the SPAs (ships the cloned catalog) then runs the Lite deploy.
                    make deploy ENV="${ENVIRONMENT}"
                  fi
            post_build:
              commands:
                - |
                  if [ "${ACTION}" = "destroy" ]; then
                    echo "Teardown finished. Finally, delete the launcher stack you created from this"
                    echo "template to remove the CodeBuild project + its role."
                  else
                    echo "Deploy finished. The Admin Console + Participant Portal URLs are in the"
                    echo "CloudFormation Outputs of the tenkacloud-lite / tenkacloud-lite-problem-deploy stacks."
                  fi
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Sub /aws/codebuild/tenkacloud-lite-${Environment}
      TimeoutInMinutes: !Ref CodeBuildTimeoutMinutes

  # =====================================
  # IAM role for the deploy build
  # =====================================
  # `make deploy` (Lite) drives `cdk deploy`, which stands up the whole platform (Lambda +
  # Cognito + DynamoDB + S3 + CloudFront + API Gateway + Step Functions + EventBridge + the
  # in-app CodeBuild for problem deploy + SSM). cdk also bootstraps and assumes the cdk-*
  # execution roles, so the role needs broad service access. This is the deploy operator,
  # distinct from competitor-bootstrap.yaml which stays least-privilege.
  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub tenkacloud-lite-${Environment}-codebuild-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Services that `cdk deploy` (Lite) and `cdk bootstrap` create/manage.
              - Sid: DeployServices
                Effect: Allow
                Action:
                  - cloudformation:*
                  - iam:*
                  - lambda:*
                  - apigateway:*
                  - cognito-idp:*
                  - cognito-identity:*
                  - dynamodb:*
                  - s3:*
                  - cloudfront:*
                  - states:*
                  - events:*
                  - sns:*
                  - sqs:*
                  - ecr:*
                  - codebuild:*
                  - logs:*
                Resource: "*"
              # Cost-zero principle: secrets live in SSM Parameter Store, not Secrets Manager.
              - Sid: SsmParameters
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                  - ssm:PutParameter
                  - ssm:DeleteParameter
                  - ssm:AddTagsToResource
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/TenkaCloud/*
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cdk-bootstrap/*
              - Sid: KmsForBootstrapAndAssets
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: "*"
              # cdk deploy assumes the bootstrap roles to publish assets / run the change set.
              - Sid: AssumeCdkRoles
                Effect: Allow
                Action:
                  - sts:AssumeRole
                Resource:
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/cdk-*
              - Sid: Identity
                Effect: Allow
                Action:
                  - sts:GetCallerIdentity
                Resource: "*"

Outputs:
  CodeBuildProjectName:
    Description: CodeBuild project name. Press "Start build" to deploy.
    Value: !Ref CodeBuildProject

  StartBuildConsoleUrl:
    Description: >-
      Open the CodeBuild project: "Start build" deploys; "Start build with overrides" with
      ACTION=destroy tears down.
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/codesuite/codebuild/projects/tenkacloud-lite-${Environment}?region=${AWS::Region}
