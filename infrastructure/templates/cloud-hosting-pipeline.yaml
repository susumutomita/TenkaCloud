AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  TenkaCloud cloud hosting launcher, adapted from the former Lite CodeBuild path.
  This source-only, incomplete competition slice requires previously reviewed IAM
  roles and policies. Creating this stack does not start a build or deploy the platform.
  Start build explicitly after reviewing costs and the pinned source commit.
  Build minutes, platform resources and retained data can incur charges.

# This launcher deliberately creates no IAM role or policy. Initial least-privilege
# account setup remains a prerequisite, not an AdministratorAccess fallback.
# It has no purge/destroy action: coordinated runner shutdown remains unfinished.
# The catalog is the immutable gitlink recorded by the selected platform commit.
Parameters:
  Environment:
    Type: String
    Default: development
    AllowedValues: [development, staging, production]
  AdminEmail:
    Type: String
    AllowedPattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
    Description: Organizer invitation address; receives the Cognito invitation after deployment.
  CodeBuildServiceRoleArn:
    Type: String
    AllowedPattern: '^arn:aws:iam::[0-9]{12}:role/tenkacloud/cloud-hosting/[A-Za-z0-9_+=.@/-]+$'
    Description: >-
      Existing reviewed same-account CodeBuild service role, with trust scoped to this
      project and the exact project bootstrap/upload/deploy/logging permissions.
      The ARN validates identity only, not policy contents. See BOOTSTRAP-IAM.md.
  CloudFormationExecutionPolicyArn:
    Type: String
    AllowedPattern: '^arn:aws:iam::[0-9]{12}:policy/tenkacloud/cloud-hosting/[A-Za-z0-9_+=.@/-]+$'
    Description: Existing reviewed least-privilege account policy for the isolated project CDK toolkit.
  RepoUrl:
    Type: String
    Default: https://github.com/susumutomita/TenkaCloud.git
    AllowedPattern: '^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
    Description: Reviewed public platform repository or fork; source code executes with the service role.
  RepoRef:
    Type: String
    AllowedPattern: '^[a-f0-9]{40}$'
    Description: >-
      Required reviewed immutable platform commit containing the current cloud launcher.
      There is no default, branch fallback, or claim that an unpublished candidate is a release.
      Its problems gitlink chooses the catalog; a custom catalog requires a reviewed platform commit.
  RunnerBindings:
    Type: String
    Default: ""
    MaxLength: 4096
    Description: >-
      Optional reviewed TENKACLOUD_RUNNER_BINDINGS JSON using exact role and SSM parameter
      ARNs, never secret values. Empty creates only the foundation and cannot disable an
      existing runner. Account isolation and problem permissions require separate review.
  CodeBuildTimeoutMinutes:
    Type: Number
    Default: 90
    MinValue: 15
    MaxValue: 180
Resources:
  LauncherLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /tenkacloud/codebuild/cloud-hosting-${Environment}
      RetentionInDays: 14
      Tags:
        - Key: TenkaCloudProject
          Value: cloud-hosting
        - Key: Environment
          Value: !Ref Environment
  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub tenkacloud-cloud-hosting-${Environment}
      Description: Explicitly started cloud hosting deployment; reviewed IAM prerequisites required.
      ServiceRole: !Ref CodeBuildServiceRoleArn
      ConcurrentBuildLimit: 1
      TimeoutInMinutes: !Ref CodeBuildTimeoutMinutes
      QueuedTimeoutInMinutes: 30
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        Image: aws/codebuild/amazonlinux-x86_64-standard:5.0
        ComputeType: BUILD_GENERAL1_MEDIUM
        PrivilegedMode: false
        ImagePullCredentialsType: CODEBUILD
        EnvironmentVariables:
          - Name: CDK_PARAM_ENVIRONMENT
            Type: PLAINTEXT
            Value: !Ref Environment
          - Name: TENKACLOUD_ADMIN_EMAIL
            Type: PLAINTEXT
            Value: !Ref AdminEmail
          - Name: TENKACLOUD_CFN_EXECUTION_POLICY_ARN
            Type: PLAINTEXT
            Value: !Ref CloudFormationExecutionPolicyArn
          - Name: TENKACLOUD_RUNNER_BINDINGS
            Type: PLAINTEXT
            Value: !Ref RunnerBindings
          - Name: REPO_URL
            Type: PLAINTEXT
            Value: !Ref RepoUrl
          - Name: REPO_REF
            Type: PLAINTEXT
            Value: !Ref RepoRef
          - Name: JSII_DEPRECATED
            Type: PLAINTEXT
            Value: quiet
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          {
            "version": 0.2,
            "env": {
              "shell": "bash"
            },
            "phases": {
              "install": {
                "runtime-versions": {
                  "nodejs": 24
                },
                "commands": [
                  "set -euo pipefail\ncase \"${REPO_URL}\" in\n  https://github.com/*) ;;\n  *) echo \"A reviewed public GitHub HTTPS repository is required.\" >&2; exit 1 ;;\nesac\n[[ \"${REPO_REF}\" =~ ^[a-f0-9]{40}$ ]] || { echo \"An immutable platform commit is required.\" >&2; exit 1; }\n[ ! -e \"${CODEBUILD_SRC_DIR}/repo\" ] || { echo \"Refusing an existing checkout directory.\" >&2; exit 1; }\ngit init --quiet \"${CODEBUILD_SRC_DIR}/repo\"\ncd \"${CODEBUILD_SRC_DIR}/repo\"\ngit remote add origin \"${REPO_URL}\"\ngit -c protocol.file.allow=never fetch --depth 1 origin \"${REPO_REF}\"\nresolved=\"$(git rev-parse --verify 'FETCH_HEAD^{commit}')\"\n[ \"${resolved}\" = \"${REPO_REF}\" ] || { echo \"The resolved platform commit differs; no fallback is permitted.\" >&2; exit 1; }\ngit checkout --quiet --detach \"${resolved}\"\n[ -f scripts/cloud-hosting/main.ts ] || { echo \"This commit has no current cloud hosting entry point.\" >&2; exit 1; }\ncatalog=\"$(git ls-tree HEAD problems | awk '$1 == \"160000\" && $2 == \"commit\" { print $3 }')\"\n[[ \"${catalog}\" =~ ^[a-f0-9]{40}$ ]] || { echo \"A pinned problem-catalog submodule is required.\" >&2; exit 1; }\ngit -c protocol.file.allow=never submodule update --init --recursive problems\n[ \"$(git -C problems rev-parse HEAD)\" = \"${catalog}\" ] || { echo \"The catalog differs from the platform gitlink.\" >&2; exit 1; }\necho \"Unverified cloud source pair: platform=${resolved} catalog=${catalog}\"\n# Install the pinned Linux binary directly; no npm lifecycle hooks are run.\nnpm install --global --ignore-scripts @oven/bun-linux-x64@1.3.11\nexport PATH=\"$(npm root --global)/@oven/bun-linux-x64/bin:${PATH}\"\n[ \"$(bun --version)\" = \"1.3.11\" ] || { echo \"Unexpected Bun version.\" >&2; exit 1; }\nbun install --frozen-lockfile --ignore-scripts"
                ]
              },
              "build": {
                "commands": [
                  "set -euo pipefail\ncd \"${CODEBUILD_SRC_DIR}/repo\"\nexport PATH=\"$(npm root --global)/@oven/bun-linux-x64/bin:${PATH}\"\nexport AWS_REGION=\"${AWS_DEFAULT_REGION}\"\nif [ -z \"${TENKACLOUD_RUNNER_BINDINGS:-}\" ]; then unset TENKACLOUD_RUNNER_BINDINGS; fi\n# The shared CLI verifies ownership and the reviewed execution policy before upload/bootstrap.\n# It refuses accidental runner removal and never adopts the default/shared CDKToolkit.\nbun run scripts/cloud-hosting/main.ts up"
                ]
              }
            }
          }
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref LauncherLogGroup
      Tags:
        - Key: TenkaCloudProject
          Value: cloud-hosting
        - Key: Environment
          Value: !Ref Environment
Outputs:
  StartBuildUrl:
    Description: Open the project and explicitly Start build after review; stack creation starts nothing.
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/codesuite/codebuild/projects/${CodeBuildProject}/history?region=${AWS::Region}
  SourceContract:
    Description: The requested platform commit and its pinned catalog are verified before installation.
    Value: !Ref RepoRef
  RetentionNotice:
    Value: >-
      Deleting this launcher only removes the CodeBuild project. Logs, platform stacks,
      event data, organizer accounts, artifact/source buckets, project toolkit and exercise
      resources remain. Do not treat launcher deletion as competition teardown.
