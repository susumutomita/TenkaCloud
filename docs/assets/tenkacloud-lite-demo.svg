<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">TenkaCloud Lite demo flow</title>
  <desc id="desc">A screenshot-style flow showing authoring, Lite mode, deploy, participant play, and scoring.</desc>
  <defs>
    <style>
      .bg { fill: #f7f9fb; }
      .panel { fill: #ffffff; stroke: #c8d1da; stroke-width: 2; }
      .header { fill: #232f3e; }
      .nav { fill: #f0f4f8; }
      .text { fill: #1f2937; font: 600 22px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #4b5563; font: 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .tiny { fill: #6b7280; font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .white { fill: #ffffff; }
      .blue { fill: #2563eb; }
      .green { fill: #059669; }
      .amber { fill: #d97706; }
      .red { fill: #dc2626; }
      .line { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 6 6; fill: none; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" width="1100" height="560" rx="22"/>

  <rect class="panel" x="36" y="38" width="270" height="188" rx="10"/>
  <rect class="header" x="36" y="38" width="270" height="42" rx="10"/>
  <text class="white" x="56" y="66" font-size="18" font-family="system-ui, sans-serif" font-weight="700">Problem authoring</text>
  <text class="text" x="56" y="115">metadata.json</text>
  <text class="tiny" x="56" y="145">{ "kind": "flag" }</text>
  <text class="text" x="56" y="180">template.yaml</text>
  <text class="tiny" x="56" y="207">Resources: AWS::SSM::Parameter</text>

  <rect class="panel" x="416" y="38" width="270" height="188" rx="10"/>
  <rect class="header" x="416" y="38" width="270" height="42" rx="10"/>
  <text class="white" x="436" y="66" font-size="18" font-family="system-ui, sans-serif" font-weight="700">Lite mode</text>
  <rect class="nav" x="436" y="100" width="230" height="36" rx="6"/>
  <text class="small" x="452" y="124">Application Admin Console</text>
  <rect class="nav" x="436" y="150" width="230" height="36" rx="6"/>
  <text class="small" x="452" y="174">Participant Portal</text>
  <rect class="nav" x="436" y="200" width="120" height="10" rx="5"/>

  <rect class="panel" x="796" y="38" width="270" height="188" rx="10"/>
  <rect class="header" x="796" y="38" width="270" height="42" rx="10"/>
  <text class="white" x="816" y="66" font-size="18" font-family="system-ui, sans-serif" font-weight="700">Competitor AWS account</text>
  <rect class="nav" x="816" y="100" width="230" height="36" rx="6"/>
  <text class="small" x="832" y="124">CloudFormation stack</text>
  <rect class="nav" x="816" y="150" width="170" height="36" rx="6"/>
  <text class="small" x="832" y="174">Problem resources</text>
  <text class="tiny" x="816" y="207">AssumeRole + ExternalId</text>

  <rect class="panel" x="160" y="322" width="330" height="188" rx="10"/>
  <rect class="header" x="160" y="322" width="330" height="42" rx="10"/>
  <text class="white" x="180" y="350" font-size="18" font-family="system-ui, sans-serif" font-weight="700">Team experience</text>
  <circle class="blue" cx="194" cy="402" r="10"/>
  <text class="small" x="216" y="408">Open portal</text>
  <circle class="amber" cx="194" cy="444" r="10"/>
  <text class="small" x="216" y="450">Recover, migrate, harden, or capture flag</text>
  <circle class="green" cx="194" cy="486" r="10"/>
  <text class="small" x="216" y="492">Submit evidence and watch score</text>

  <rect class="panel" x="610" y="322" width="330" height="188" rx="10"/>
  <rect class="header" x="610" y="322" width="330" height="42" rx="10"/>
  <text class="white" x="630" y="350" font-size="18" font-family="system-ui, sans-serif" font-weight="700">Scoring engine</text>
  <rect class="nav" x="630" y="392" width="92" height="34" rx="6"/>
  <text class="small" x="653" y="415">flag</text>
  <rect class="nav" x="738" y="392" width="92" height="34" rx="6"/>
  <text class="small" x="756" y="415">uptime</text>
  <rect class="nav" x="630" y="442" width="142" height="34" rx="6"/>
  <text class="small" x="647" y="465">phased polling</text>
  <rect class="nav" x="788" y="442" width="132" height="34" rx="6"/>
  <text class="small" x="805" y="465">attack detect</text>

  <path class="line" d="M306 132 H416"/>
  <path class="line" d="M686 132 H796"/>
  <path class="line" d="M930 226 C930 274 866 300 790 322"/>
  <path class="line" d="M490 416 H610"/>
  <path class="dash" d="M325 322 C325 280 420 260 526 226"/>
  <text class="tiny" x="420" y="285">scores and status return to the portal</text>
</svg>
