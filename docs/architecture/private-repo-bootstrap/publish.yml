# ADR-008 Phase 4: private 問題 payload を S3 に publish するワークフロー。
#
# このファイルは TenkaCloudChallenges private repo の .github/workflows/publish.yml に
# そのままコピーして使う想定。 secret `AWS_CHALLENGE_PUBLISH_ROLE_ARN` を
# 事前に bind しておくこと (= oidc-iam-trust.template.yaml で発行した Role ARN)。
#
# トリガー:
#   - main branch への push で problems/** が変わったとき
#   - 手動実行 (workflow_dispatch) で全問題を再 publish
#
# 動作:
#   1. checkout
#   2. AWS OIDC で AssumeRole (= 短命 token、 long-lived key 不要)
#   3. 変更があった problem dir を zip 化
#   4. S3 (= tc-challenges-${env}/<problemId>/<gitSha>.zip) にアップロード
#   5. presigned URL は発行しない (= Worker Lambda 側で必要時に発行する)

name: publish

on:
  push:
    branches: [main]
    paths:
      - "problems/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:
    inputs:
      target_environment:
        description: "publish 先 environment (development / production)"
        required: true
        default: "development"
        type: choice
        options:
          - development
          - production

permissions:
  contents: read
  id-token: write # OIDC AssumeRole で必須

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # AWS_REGION は env に置いて全 step で共通化。 secret には置かない (= public 情報)
      AWS_REGION: ap-northeast-1
      # ChallengePayloadStack で作る S3 bucket の prefix。 environment で suffix を切替
      BUCKET_PREFIX: tc-challenges-
    steps:
      - name: Checkout
        # actions/checkout v4.3.1 (= TenkaCloud 本体 CI と pin 揃え)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Configure AWS credentials via OIDC
        # aws-actions/configure-aws-credentials v4.0.2
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ secrets.AWS_CHALLENGE_PUBLISH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          # session-name は CloudTrail で追跡しやすいよう commit SHA を含める
          role-session-name: tenkacloud-publish-${{ github.sha }}

      - name: Determine target environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "name=${{ github.event.inputs.target_environment }}" >> "$GITHUB_OUTPUT"
          else
            # main push は default で development。 production publish は dispatch 限定
            echo "name=development" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect changed problem directories
        id: changed
        run: |
          # main 直前 commit との diff から問題 dir を抽出。 全 publish (dispatch) は "ALL"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            mapfile -t dirs < <(find problems -mindepth 3 -maxdepth 3 -type d)
          else
            mapfile -t dirs < <(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" \
              | grep -E '^problems/[^/]+/[^/]+/' \
              | awk -F/ '{print $1"/"$2"/"$3}' \
              | sort -u)
          fi
          if [[ ${#dirs[@]} -eq 0 ]]; then
            echo "no problem dirs changed; skipping"
            echo "list=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'changed problem dirs:\n'
          printf '  %s\n' "${dirs[@]}"
          # bash array を改行区切り string 化して GITHUB_OUTPUT に詰める
          {
            echo "list<<EOF"
            printf '%s\n' "${dirs[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Zip and upload each problem
        if: steps.changed.outputs.list != ''
        run: |
          set -euo pipefail
          BUCKET="${BUCKET_PREFIX}${{ steps.env.outputs.name }}"
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-12)
          while IFS= read -r dir; do
            [[ -z "$dir" ]] && continue
            problem_id=$(basename "$dir")
            zip_path="/tmp/${problem_id}-${SHA_SHORT}.zip"
            echo "::group::publish ${problem_id}"
            # -X: extra-field を削る (= timestamp drift で diff が出ないよう決定論)
            # -r: recursive
            # -q: quiet
            (cd "$dir" && zip -X -q -r "$zip_path" .)
            aws s3 cp "$zip_path" "s3://${BUCKET}/${problem_id}/${SHA_SHORT}.zip" \
              --no-progress --content-type application/zip
            # latest pointer (= optional)、 競技中 version pin したいなら latest 更新を skip する設計に変更
            aws s3 cp "$zip_path" "s3://${BUCKET}/${problem_id}/latest.zip" \
              --no-progress --content-type application/zip
            rm -f "$zip_path"
            echo "::endgroup::"
          done <<< "${{ steps.changed.outputs.list }}"

      - name: Summary
        if: always()
        run: |
          echo "publish target environment: ${{ steps.env.outputs.name }}"
          echo "changed problem dirs:"
          echo "${{ steps.changed.outputs.list }}"
