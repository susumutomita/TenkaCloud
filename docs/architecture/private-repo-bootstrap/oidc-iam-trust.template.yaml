AWSTemplateFormatVersion: "2010-09-09"
Description: |
  ADR-008 Phase 4: GitHub OIDC trust + Role for TenkaCloudChallenges publish workflow.
  Issue #643 bootstrap artifact.

  デプロイ手順 (user 担当):
    aws cloudformation deploy \
      --stack-name tenkacloud-challenges-publish-role-${ENV} \
      --template-file oidc-iam-trust.template.yaml \
      --capabilities CAPABILITY_NAMED_IAM \
      --parameter-overrides \
          Environment=${ENV} \
          ChallengeBucketName=tc-challenges-${ENV} \
          ChallengesRepo=susumutomita/TenkaCloudChallenges

  Outputs.PublishRoleArn を private repo の GitHub Actions secret
  `AWS_CHALLENGE_PUBLISH_ROLE_ARN` に bind すること。

Parameters:
  Environment:
    Type: String
    AllowedValues: [development, staging, production]
    Description: ChallengePayloadStack で作る bucket の environment suffix と整合させる。

  ChallengeBucketName:
    Type: String
    Description: |
      private payload S3 bucket 名 (= `tc-challenges-${Environment}` を想定)。
      bucket は ChallengePayloadStack 側で作成済前提 (= 本テンプレは Role/IDP のみ管理)。

  ChallengesRepo:
    Type: String
    Default: susumutomita/TenkaCloudChallenges
    Description: |
      private repo の `org/repo` 表記。 fork からの濫用を防ぐため、
      OIDC sub の `repo:${ChallengesRepo}:ref:refs/heads/main` で trust 条件を絞る。

  ExistingOidcProviderArn:
    Type: String
    Default: ""
    Description: |
      AWS account に既に GitHub OIDC provider が登録済ならその ARN を渡す。
      空ならテンプレが新規作成する (= 1 account 1 provider 制約)。

Conditions:
  CreateOidcProvider: !Equals [!Ref ExistingOidcProviderArn, ""]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      # GitHub Actions の official audience。 変更しない
      ClientIdList:
        - sts.amazonaws.com
      # GitHub の root CA の SHA1。 GitHub が cert rotate したら更新する
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  PublishRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "tenkacloud-challenges-publish-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # main branch のみ trust。 fork や feature branch からの publish を防ぐ。
                # tag publish もしたいなら refs/tags/* 用に別 statement を追加する。
                token.actions.githubusercontent.com:sub: !Sub "repo:${ChallengesRepo}:ref:refs/heads/main"
      MaxSessionDuration: 3600
      Description: !Sub "TenkaCloudChallenges publish workflow assumes this role to upload zips to ${ChallengeBucketName}."
      Policies:
        - PolicyName: ChallengePayloadUpload
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: PutChallengePayload
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:PutObjectAcl
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${ChallengeBucketName}/*"
              - Sid: ListBucketForDebug
                Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${ChallengeBucketName}"

Outputs:
  PublishRoleArn:
    Value: !GetAtt PublishRole.Arn
    Description: |
      private repo の GitHub Actions secret `AWS_CHALLENGE_PUBLISH_ROLE_ARN` に bind する Role ARN。
    Export:
      Name: !Sub "tenkacloud-challenges-publish-role-arn-${Environment}"

  OidcProviderArn:
    Value: !If
      - CreateOidcProvider
      - !Ref GitHubOidcProvider
      - !Ref ExistingOidcProviderArn
    Description: 使用された GitHub OIDC Provider の ARN (= 既存 / 新規作成いずれか)。
