AWSTemplateFormatVersion: "2010-09-09"
Description: >
  TenkaCloud problem — microservice-migration-battle (Phase 1).
  Single EC2 (Amazon Linux 2023, t3.small) running 3 Node.js + Hono services
  (users / orders / catalog) behind an nginx reverse proxy on port 80. Competitors
  split this monolith into Lambda + API Gateway / ECS Fargate / App Runner
  during a timed Battle. Phase 1 ships only the EC2 monolith; Phase 2 adds the
  score engine + EC2 degradation + legacy switch, and Phase 3 adds the
  endpoint registration UI.

  同一 (Account, Region) に複数チームの problem stack が共存できるよう、
  リソース名は全て ${NamePrefix} (= "tc-{problemSlug}-{teamSlug}", UI の
  buildStackPrefix と一致) を冠する。

Parameters:
  NamePrefix:
    Type: String
    MinLength: 5
    MaxLength: 80
    AllowedPattern: "^tc-[a-z0-9]+(-[a-z0-9]+)+$"
    ConstraintDescription: >
      `tc-{problemSlug}-{teamSlug}` 形式 (英小文字 / 数字 / ハイフン)。
      application-admin-console の DeployForm が生成する prefix を渡す。
    Description: >
      すべてのリソース名に冠する共通 prefix。同一 Account / Region に複数チームの
      スタックが共存しても衝突しないようにする。
  AllowedCidr:
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]{1,2}$"
    Description: nginx (port 80) を許可する CIDR。
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues:
      - t3.small
      - t3.medium
    Description: EC2 インスタンスタイプ。3 Node.js プロセス + nginx 同居なので t3.small 推奨。
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-x86_64
    Description: SSM-backed Amazon Linux 2023 AMI (auto-resolved)。
  RepoUrl:
    Type: String
    Default: https://github.com/susumutomita/TenkaCloud.git
    Description: 問題ソース取得元 (公開 GitHub リポジトリ前提)。
  RepoRef:
    Type: String
    Default: main
    Description: チェックアウトする branch / tag / commit。
  DegradedAfterMinutes:
    Type: Number
    Default: 60
    MinValue: 1
    MaxValue: 720
    Description: >
      [ADR-012 Phase 4 Disruption] deploy 後 N 分経過時点で EC2 上に `tc qdisc` の
      network latency (200ms) を注入する self-triggered Scheduler の発火タイミング。
      metadata.json の `phases[0].afterMinutes` と整合させる前提 (= 同じタイミングで
      score engine が ec2 platform points を degradedPoints へ切替)。
      operator が deploy 時に上書き可能。

Resources:
  # ----- VPC + Networking -----
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.99.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-vpc"
        - Key: TenkaCloud:NamePrefix
          Value: !Ref NamePrefix

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.99.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-subnet"

  Igw:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-igw"

  IgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref Igw

  Rt:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-rt"

  RtRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttach
    Properties:
      RouteTableId: !Ref Rt
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref Igw

  RtAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref Rt
      SubnetId: !Ref PublicSubnet

  # ----- Security Group -----
  Sg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref Vpc
      GroupDescription: !Sub "${NamePrefix} microservice-migration-battle access"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedCidr
          Description: nginx reverse proxy (users / orders / catalog)
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-sg"

  # ----- IAM (SSM Session Manager only) -----
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${NamePrefix}-instance-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${NamePrefix}-instance-profile"
      Roles:
        - !Ref InstanceRole

  # ----- EC2 -----
  Ec2:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref Sg
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-ec2"
        - Key: TenkaCloud:Problem
          Value: microservice-migration-battle
        - Key: TenkaCloud:NamePrefix
          Value: !Ref NamePrefix
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          dnf update -y
          dnf install -y docker git
          systemctl enable --now docker
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fsSL "https://github.com/docker/compose/releases/download/v2.27.0/docker-compose-linux-x86_64" \
            -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose

          mkdir -p /opt/tenkacloud
          cd /opt/tenkacloud
          # branch / tag / commit いずれも指せるよう shallow fetch + checkout 形式
          git clone "${RepoUrl}" repo
          cd repo
          git fetch origin "${RepoRef}" || git fetch --all
          git checkout "${RepoRef}" || git checkout FETCH_HEAD

          PROBLEM_ROOT=/opt/tenkacloud/repo/problems/battles/microservice-migration-battle
          cd "$PROBLEM_ROOT/services"

          cat > .env <<ENVEOF
          NAME_PREFIX=${NamePrefix}
          REGION=${AWS::Region}
          ENVEOF

          docker compose up -d --build

  # ----- Disruption pattern (ADR-012 Phase 4) -----
  # phases[0] (degraded) と整合する self-triggered Scheduler。 deploy 後
  # DegradedAfterMinutes 経過時点で SSM RunCommand を発行し、 EC2 の eth0 に
  # `tc qdisc` で 200ms の network latency を注入する。 同じタイミングで platform
  # 側の score engine が ec2 points を degradedPoints (= 10) に切り替える (= 別 path
  # で metadata.phases から駆動)。 portal は metadata.disruptions[] から countdown を
  # 表示する (= predict)。
  #
  # 設計選択: `rate(N minutes)` を Scheduler に渡すと、 deploy 後 N 分後の最初の発火 +
  # 以降 N 分毎にも発火する。 tc qdisc add は EEXIST で fail するので 2 回目以降は
  # no-op (= idempotent)。 正確に 1 回だけ発火させたい場合は CustomResource で deploy
  # 時刻 + offset の `at()` 式を組み立てる必要があるが、 Phase 1 reference impl では
  # 簡潔さを優先して rate() + idempotent Lambda で実装する。
  DisruptionFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${NamePrefix}-disruption-fn-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SendCommandToOwnInstance
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Ec2}"
                  - !Sub "arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript"

  DegradedDisruptionFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${NamePrefix}-degraded-disruption"
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt DisruptionFunctionRole.Arn
      Timeout: 30
      Environment:
        Variables:
          INSTANCE_ID: !Ref Ec2
      Code:
        ZipFile: |
          import os
          import boto3

          # phases[0]=degraded fire 時点で EC2 に network latency を注入する。
          # `tc qdisc add` は 2 回目以降 EEXIST で fail するので `|| true` で握り潰す。
          # Scheduler が rate(N min) で N 分毎に再発火するが、 1 回目以降は no-op。
          def handler(event, context):
              ssm = boto3.client("ssm")
              ssm.send_command(
                  InstanceIds=[os.environ["INSTANCE_ID"]],
                  DocumentName="AWS-RunShellScript",
                  Comment="TenkaCloud microservice-migration: phases[0] degraded fire",
                  Parameters={
                      "commands": [
                          "tc qdisc add dev eth0 root netem delay 200ms || true",
                      ],
                  },
              )
              return {"ok": True}

  SchedulerInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${NamePrefix}-scheduler-invoke-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeDisruptionFunction
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt DegradedDisruptionFunction.Arn

  DegradedDisruptionSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${NamePrefix}-degraded-disruption"
      Description: >
        TenkaCloud microservice-migration-battle phases[0]=degraded の disruption schedule。
        deploy 後 DegradedAfterMinutes 経過時点で EC2 上に network latency を注入する。
      FlexibleTimeWindow: { Mode: "OFF" }
      ScheduleExpression: !Sub "rate(${DegradedAfterMinutes} minutes)"
      Target:
        Arn: !GetAtt DegradedDisruptionFunction.Arn
        RoleArn: !GetAtt SchedulerInvokeRole.Arn

Outputs:
  BaseUrl:
    Description: 参加者向け nginx reverse proxy URL。Score Engine が `/users/score` / `/orders/score` / `/catalog/score` を probe する。
    Value: !Sub "http://${Ec2.PublicDnsName}"
  UsersScoreUrl:
    Description: users service の初期エンドポイント (EC2 上)。
    Value: !Sub "http://${Ec2.PublicDnsName}/users/score"
  OrdersScoreUrl:
    Description: orders service の初期エンドポイント (EC2 上)。
    Value: !Sub "http://${Ec2.PublicDnsName}/orders/score"
  CatalogScoreUrl:
    Description: catalog service の初期エンドポイント (EC2 上)。
    Value: !Sub "http://${Ec2.PublicDnsName}/catalog/score"
  InstanceId:
    Description: EC2 インスタンス ID (運営者が SSM Session Manager から接続する際に使う)。
    Value: !Ref Ec2
  SsmStartSessionCommand:
    Description: 運営者がインスタンスへ Session Manager で接続するコマンド。
    Value: !Sub "aws ssm start-session --target ${Ec2}"
  NamePrefix:
    Description: 本スタックが利用した共通リソース prefix。
    Value: !Ref NamePrefix
