AWSTemplateFormatVersion: "2010-09-09"
Description: >
  TenkaCloud problem — microservice-migration-battle (Phase 1).
  Single EC2 (Amazon Linux 2023, t3.small) running 3 Node.js + Hono services
  (users / orders / catalog) behind an nginx reverse proxy on port 80. Competitors
  split this monolith into Lambda + API Gateway / ECS Fargate / App Runner
  during a timed Battle. Phase 1 ships only the EC2 monolith; Phase 2 adds the
  score engine + EC2 degradation + legacy switch, and Phase 3 adds the
  endpoint registration UI.

  同一 (Account, Region) に複数チームの problem stack が共存できるよう、
  リソース名は全て ${NamePrefix} (= "tc-{problemSlug}-{teamSlug}", UI の
  buildStackPrefix と一致) を冠する。

Parameters:
  NamePrefix:
    Type: String
    MinLength: 5
    MaxLength: 80
    AllowedPattern: "^tc-[a-z0-9]+(-[a-z0-9]+)+$"
    ConstraintDescription: >
      `tc-{problemSlug}-{teamSlug}` 形式 (英小文字 / 数字 / ハイフン)。
      application-admin-console の DeployForm が生成する prefix を渡す。
    Description: >
      すべてのリソース名に冠する共通 prefix。同一 Account / Region に複数チームの
      スタックが共存しても衝突しないようにする。
  AllowedCidr:
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]{1,2}$"
    Description: nginx (port 80) を許可する CIDR。
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues:
      - t3.small
      - t3.medium
    Description: EC2 インスタンスタイプ。3 Node.js プロセス + nginx 同居なので t3.small 推奨。
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-x86_64
    Description: SSM-backed Amazon Linux 2023 AMI (auto-resolved)。
  RepoUrl:
    Type: String
    Default: https://github.com/susumutomita/TenkaCloud.git
    Description: 問題ソース取得元 (公開 GitHub リポジトリ前提)。
  RepoRef:
    Type: String
    Default: main
    Description: チェックアウトする branch / tag / commit。
  DegradationMinutes:
    Type: Number
    Default: 60
    MinValue: 1
    MaxValue: 1440
    Description: >
      競技開始から EC2 ネットワーク劣化を起動するまでの分数 (Phase 2 / Issue #606)。
      score engine の `MICROSERVICE_MIGRATION_DEGRADATION_MINUTES` と同値にすること。
      EC2 UserData の cron が boot から本値分後に `tc qdisc` を流し、200ms の遅延を注入する
      (= EC2 残置への penalty を実機で再現)。デフォルト 60 分。

Resources:
  # ----- VPC + Networking -----
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.99.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-vpc"
        - Key: TenkaCloud:NamePrefix
          Value: !Ref NamePrefix

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.99.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-subnet"

  Igw:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-igw"

  IgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref Igw

  Rt:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-rt"

  RtRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttach
    Properties:
      RouteTableId: !Ref Rt
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref Igw

  RtAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref Rt
      SubnetId: !Ref PublicSubnet

  # ----- Security Group -----
  Sg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref Vpc
      GroupDescription: !Sub "${NamePrefix} microservice-migration-battle access"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedCidr
          Description: nginx reverse proxy (users / orders / catalog)
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-sg"

  # ----- IAM (SSM Session Manager only) -----
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${NamePrefix}-instance-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${NamePrefix}-instance-profile"
      Roles:
        - !Ref InstanceRole

  # ----- EC2 -----
  Ec2:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref Sg
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-ec2"
        - Key: TenkaCloud:Problem
          Value: microservice-migration-battle
        - Key: TenkaCloud:NamePrefix
          Value: !Ref NamePrefix
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          dnf update -y
          # iproute-tc は `tc qdisc` (Phase 2 / Issue #606 ネットワーク劣化 cron) で使う。
          dnf install -y docker git iproute-tc
          systemctl enable --now docker
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fsSL "https://github.com/docker/compose/releases/download/v2.27.0/docker-compose-linux-x86_64" \
            -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose

          mkdir -p /opt/tenkacloud
          cd /opt/tenkacloud
          # branch / tag / commit いずれも指せるよう shallow fetch + checkout 形式
          git clone "${RepoUrl}" repo
          cd repo
          git fetch origin "${RepoRef}" || git fetch --all
          git checkout "${RepoRef}" || git checkout FETCH_HEAD

          PROBLEM_ROOT=/opt/tenkacloud/repo/problems/battles/microservice-migration-battle
          cd "$PROBLEM_ROOT/services"

          cat > .env <<ENVEOF
          NAME_PREFIX=${NamePrefix}
          REGION=${AWS::Region}
          ENVEOF

          docker compose up -d --build

          # ----- Phase 2 / Issue #606: EC2 劣化シミュレーション (= ネットワーク遅延注入) -----
          #
          # マイクロサービス分割の incentive (= EC2 残置の penalty) を実機で再現する。
          # `DegradationMinutes` 分後に primary NIC へ `tc qdisc ... netem delay 200ms` を
          # 流し、EC2 上の `/score` 応答時間が 1500ms threshold を超えやすくする
          # (= polling Lambda 側で score < migration platform スコアに沈める)。
          #
          # ⚠️ 本 cron は **問題の仕掛け** であって malware ではない。再起動でも仕掛けが
          #    効くように systemd timer に書き込み、`docker compose` 起動後の独立 unit
          #    にしてある (= compose 失敗時は劣化を起こさない、運営トラブルシュート簡易化)。
          PRIMARY_NIC="$(ip -o -4 route show to default | awk '{print $5}' | head -n1)"
          if [[ -z "$PRIMARY_NIC" ]]; then
            echo "[degradation] PRIMARY_NIC could not be detected, skip degradation setup" >&2
          else
            mkdir -p /opt/tenkacloud/degradation

            # inject.sh は heredoc を 'INJECT' (quoted) で囲い、shell expansion を防ぐ。
            cat > /opt/tenkacloud/degradation/inject.sh <<'INJECT'
          #!/bin/bash
          # 本 script は Phase 2 / Issue #606 の劣化シミュレーション。
          # 200ms 遅延を primary NIC root qdisc に注入する。`add` が ALREADY EXISTS の
          # 場合は `change` で冪等に上書きする (= timer 再 trigger でも崩れない)。
          NIC="$1"
          if [[ -z "$NIC" ]]; then
            echo "[degradation] NIC unset, skip" >&2
            exit 0
          fi
          /sbin/tc qdisc add dev "$NIC" root netem delay 200ms 2>/dev/null || \
            /sbin/tc qdisc change dev "$NIC" root netem delay 200ms
          echo "[degradation] netem delay 200ms applied on $NIC at $(date -Is)"
          INJECT
            chmod +x /opt/tenkacloud/degradation/inject.sh

            # NIC 値を unit に焼き込む (= systemd は shell expansion しないので、書き出し時に展開)。
            cat > /etc/systemd/system/tenkacloud-degradation.service <<UNIT
          [Unit]
          Description=TenkaCloud Microservice Migration Battle - EC2 network degradation (Phase 2 / #606)
          After=docker.service network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/opt/tenkacloud/degradation/inject.sh $PRIMARY_NIC
          UNIT

            # OnBootSec で `DegradationMinutes` 分後に oneshot service を発火する。
            # CFn `${DegradationMinutes}` は Fn::Sub で展開済 (= 例 60min)。
            cat > /etc/systemd/system/tenkacloud-degradation.timer <<TIMER
          [Unit]
          Description=TenkaCloud Microservice Migration Battle - degradation trigger (boot + ${DegradationMinutes} min)

          [Timer]
          OnBootSec=${DegradationMinutes}min
          Unit=tenkacloud-degradation.service
          Persistent=true

          [Install]
          WantedBy=timers.target
          TIMER

            systemctl daemon-reload
            systemctl enable --now tenkacloud-degradation.timer
          fi

Outputs:
  BaseUrl:
    Description: 参加者向け nginx reverse proxy URL。Score Engine が `/users/score` / `/orders/score` / `/catalog/score` を probe する。
    Value: !Sub "http://${Ec2.PublicDnsName}"
  UsersScoreUrl:
    Description: users service の初期エンドポイント (EC2 上)。
    Value: !Sub "http://${Ec2.PublicDnsName}/users/score"
  OrdersScoreUrl:
    Description: orders service の初期エンドポイント (EC2 上)。
    Value: !Sub "http://${Ec2.PublicDnsName}/orders/score"
  CatalogScoreUrl:
    Description: catalog service の初期エンドポイント (EC2 上)。
    Value: !Sub "http://${Ec2.PublicDnsName}/catalog/score"
  InstanceId:
    Description: EC2 インスタンス ID (運営者が SSM Session Manager から接続する際に使う)。
    Value: !Ref Ec2
  SsmStartSessionCommand:
    Description: 運営者がインスタンスへ Session Manager で接続するコマンド。
    Value: !Sub "aws ssm start-session --target ${Ec2}"
  NamePrefix:
    Description: 本スタックが利用した共通リソース prefix。
    Value: !Ref NamePrefix
