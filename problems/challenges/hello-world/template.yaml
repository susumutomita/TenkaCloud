AWSTemplateFormatVersion: "2010-09-09"
Description: >
  TenkaCloud sample problem (hello-world). Minimal smoke test stack that creates
  a single SSM Parameter and nothing else. Use this for verifying that
  `make deploy-battles` end-to-end works without exposing any vulnerable software
  or public-facing resources. Free of charge under standard SSM tier.

Parameters:
  NamePrefix:
    Type: String
    MinLength: 5
    MaxLength: 80
    AllowedPattern: "^tc-[a-z0-9]+(-[a-z0-9]+)+$"
    ConstraintDescription: >
      `tc-{problemSlug}-{teamSlug}` format. The deploy-battles.sh script auto-injects
      this value, you do not need to set it manually.
    Description: >
      Common prefix attached to all resource names. Used to prevent collisions
      when multiple teams' stacks coexist in the same account / region.
  TenkaCloudAccountId:
    Type: String
    AllowedPattern: "^[0-9]{12}$"
    Description: TenkaCloud operator AWS account ID (passed by deploy chain).
  ExternalId:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: ExternalId for ParticipantViewerRole trust (passed by deploy chain).

Resources:
  ParticipantViewerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${NamePrefix}-participant-viewer"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${TenkaCloudAccountId}:root"
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      MaxSessionDuration: 3600
      Policies:
        - PolicyName: ProblemSpecific
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadOwnSsmParameters
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: !Sub "arn:aws:ssm:*:*:parameter/${NamePrefix}/*"
              # Issue #820: AWS Console SSM Parameter Store list view requires
              # DescribeParameters / GetParametersByPath (list APIs cannot be
              # resource-scoped, but the Console filters by path so the user only
              # sees their own problem's parameters).
              - Sid: ListSsmParametersForConsole
                Effect: Allow
                Action:
                  - ssm:DescribeParameters
                  - ssm:GetParametersByPath
                Resource: "*"
              - Sid: DescribeOwnStack
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackResources
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplate
                Resource: !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${NamePrefix}/*"
              # Issue #820: required for CFn Console stack list view
              # (ListStacks cannot be resource-scoped). List-only, no impact on
              # the solution path (reading the SSM Parameter value).
              - Sid: ListCfnStacksForConsole
                Effect: Allow
                Action:
                  - cloudformation:ListStacks
                Resource: "*"

  HelloParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${NamePrefix}/hello"
      Type: String
      Value: !Sub "Hello from ${NamePrefix}"
      Description: !Sub "TenkaCloud smoke test parameter created by hello-world (${NamePrefix})."
      Tier: Standard

Outputs:
  ParameterName:
    Description: SSM Parameter name created by this stack.
    Value: !Ref HelloParameter
  ParameterValue:
    Description: SSM Parameter value (echoed in Outputs for smoke test verification).
    Value: !Sub "Hello from ${NamePrefix}"
  NamePrefix:
    Description: Common resource prefix that this stack used.
    Value: !Ref NamePrefix
  ParticipantViewerRoleArn:
    Description: Role ARN that competitors AssumeRole to access their own stack via AWS Console.
    Value: !GetAtt ParticipantViewerRole.Arn
